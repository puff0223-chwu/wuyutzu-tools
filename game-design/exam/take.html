<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#1f2a44">
<title>線上檢定所</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@700;900&family=Noto+Sans+TC:wght@400;500;700;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link href="exam.css?v=20261023b" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<script src="core.js?v=20261024a"></script>
<style>
body{background:var(--bg)}
.wrap{max-width:760px;margin:0 auto;padding:18px 16px 90px}
.brand{display:flex;align-items:center;gap:8px;margin-bottom:12px;font-weight:900}
.brand .b{background:var(--purple);color:#fff;border:2px solid var(--ink);border-radius:10px;padding:2px 10px;box-shadow:2px 2px 0 var(--ink)}
.card h1{font-size:1.45rem}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin:12px 0}
.fact{background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:8px 12px}
.fact span{display:block;font-size:.78rem;color:var(--muted);font-weight:700}
.fact b{font-size:1.02rem}
.info{margin:10px 0 4px;border:1.5px solid var(--line);border-radius:12px;background:#fff}
.info summary{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:8px 12px;cursor:pointer;list-style:none;font-size:.92rem}
.info summary::-webkit-details-marker{display:none}
.info summary .sum{flex:1;min-width:0}
.info summary .more{color:var(--purple);font-weight:800;font-size:.85rem;white-space:nowrap}
.info[open] summary .more{font-size:0}.info[open] summary .more::after{content:"收起 ▴";font-size:.85rem}
.info ul{margin:0;padding:4px 14px 10px 30px;font-size:.92rem;line-height:1.85;border-top:1px dashed var(--line)}
.info li span{display:inline-block;min-width:5.5em;color:var(--muted);font-weight:700}
.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form .full{grid-column:1/-1}
.rules{background:#fff;border:2px dashed var(--line);border-radius:12px;padding:10px 14px;margin:10px 0;font-size:.94rem}
.rules li{margin:3px 0}
.pledge{display:flex;gap:10px;align-items:flex-start;background:var(--soft);border-radius:12px;padding:12px;font-weight:700;cursor:pointer}
.pledge input{width:22px;height:22px;accent-color:var(--purple);flex:none;margin-top:2px}
.msg{border-radius:12px;padding:10px 14px;margin:10px 0;font-weight:700}
.msg.bad{background:var(--badbg);color:var(--bad)} .msg.ok{background:var(--okbg);color:var(--ok)} .msg.warn{background:var(--warnbg);color:var(--warn)} .msg.info{background:var(--bluebg);color:var(--blue)}
.tries{display:flex;flex-direction:column;gap:6px;margin:8px 0}
.tries div{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:#fff;border:1.5px solid var(--line);border-radius:10px;padding:6px 10px}
/* 作答畫面 */
#exam{position:fixed;inset:0;z-index:20;background:var(--bg);display:flex;flex-direction:column;-webkit-user-select:none;user-select:none}
#exam .bar{background:var(--ink);color:#fff;display:flex;align-items:center;gap:10px;padding:8px 12px;padding-top:max(8px,env(safe-area-inset-top));flex-wrap:wrap}
#exam .bar .t{font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:38vw}
.timer{font-family:"JetBrains Mono",monospace;font-weight:800;font-size:1.25rem;background:#fff;color:var(--ink);border-radius:10px;padding:2px 10px;min-width:84px;text-align:center}
.timer.warn{background:var(--gold)} .timer.end{background:var(--red);color:#fff;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.55}}
.pill{font-size:.82rem;font-weight:800;border-radius:999px;padding:2px 10px;background:rgba(255,255,255,.14)}
.pill.v{background:var(--red)}
#exam .body{flex:1;overflow:auto;padding:16px 14px 20px;-webkit-overflow-scrolling:touch}
#exam .inner{max-width:760px;margin:0 auto}
.qcard{background:var(--paper);border:2px solid var(--ink);border-radius:16px;box-shadow:4px 4px 0 var(--ink);padding:16px 18px;position:relative;overflow:hidden}
.qcard .wm{position:absolute;inset:0;pointer-events:none;opacity:.06;background-repeat:repeat}
.qhead{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.qhead .n{font-family:"Noto Serif TC",serif;font-weight:900;font-size:1.15rem}
.stemx{font-size:1.06rem;line-height:1.75}
.opts{display:flex;flex-direction:column;gap:9px;margin-top:14px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;font:inherit;color:inherit;background:#fff;border:2px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer;width:100%}
.opt .L{flex:none;width:30px;height:30px;border-radius:50%;border:2px solid var(--ink);display:flex;align-items:center;justify-content:center;font-weight:900;background:#fff}
.opt.m .L{border-radius:8px}
.opt.on{border-color:var(--purple);background:var(--soft)}
.opt.on .L{background:var(--purple);color:#fff;border-color:var(--purple)}
.opt .c{flex:1;min-width:0;padding-top:2px}
textarea.ans{min-height:170px;font-size:1.02rem;line-height:1.6;margin-top:12px;-webkit-user-select:text;user-select:text}
.nav{display:flex;gap:10px;margin-top:14px;align-items:center}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:6px;margin-top:10px}
.grid button{font:inherit;font-weight:800;border:2px solid var(--line);background:#fff;border-radius:10px;padding:6px 0;cursor:pointer;position:relative}
.grid button.done{background:var(--ink);color:#fff;border-color:var(--ink)}
.grid button.cur{outline:3px solid var(--gold);outline-offset:1px}
.grid button.flag::after{content:"🚩";position:absolute;top:-8px;right:-6px;font-size:.75rem}
.overlay{position:fixed;inset:0;z-index:60;background:rgba(31,42,68,.92);display:flex;align-items:center;justify-content:center;padding:20px}
.overlay .box{background:var(--paper);border:3px solid var(--ink);border-radius:18px;max-width:440px;width:100%;padding:22px;text-align:center;box-shadow:6px 6px 0 var(--red)}
.overlay .big{font-size:3rem;line-height:1}
.overlay h2{margin:8px 0}
.save{font-size:.8rem}
.res .q{background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;margin:8px 0}
.res .op{padding:4px 8px;border-radius:8px;margin-top:4px;display:flex;gap:6px}
.res .op.mine{background:var(--soft);font-weight:700}
.res .op.right{outline:2px solid var(--ok)}
.res .exp{margin-top:6px;padding:6px 10px;background:#faf8f3;border-left:4px solid var(--gold);border-radius:6px;font-size:.92rem}
.foot{text-align:center;color:var(--muted);font-size:.8rem;margin-top:26px}
@media (max-width:520px){.form{grid-template-columns:1fr}.timer{font-size:1.1rem}#exam .bar .t{display:none}}
</style>
</head>
<body>
<div class="wrap" id="app"><div class="card"><p class="muted">載入中…</p></div></div>
<div id="exam" class="hidden"></div>
<div id="ov"></div>
<script>
(function () {
  'use strict';
  var X = window.ExamCore, R = X.REST, esc = X.escapeHtml;
  var $ = function (s, el) { return (el || document).querySelector(s); }, $$ = function (s, el) { return Array.prototype.slice.call((el || document).querySelectorAll(s)); };
  var app = $('#app'), examEl = $('#exam'), ov = $('#ov');
  var code = (new URLSearchParams(location.search).get('code') || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
  var META = null, ME = null, REC = null, PAPER = null, SHEET = null, K = 0, ATT = null, ANS = {}, FLAG = {}, CUR = 0;
  var EXT = {}, BONUS = 0, CHECKING = false;
  var extK = function (k) { return +((EXT || {})[k]) || 0; };
  var OFFSET = 0, DEADLINE = 0, PEND = {}, EVQ = [], ENDING = false, ENDED = false, VIOL = 0, LASTV = 0, WASFS = false, LASTACT = Date.now(), IDLE = false;
  var timers = [];
  var store = { get: function (k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } }, set: function (k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { } } };
  var DEV = store.get('exam:dev'); if (!DEV) { DEV = X.newId(16); store.set('exam:dev', DEV); }
  var now = function () { return Date.now() + OFFSET; };
  var G = function () { return (META && META.guard && META.guard.on) ? META.guard : null; };
  function card(html) { app.innerHTML = '<div class="brand"><span class="b">🎲 線上檢定所</span></div>' + html + '<div class="foot">© 巫魚子老師 線上檢定所</div>'; }
  function sanitize(html) {
    var h = window.DOMPurify ? DOMPurify.sanitize(String(html || ''), { ADD_ATTR: ['data-img'], FORBID_TAGS: ['style', 'script', 'iframe', 'form', 'input'] }) : esc(X.plain(html));
    return h.replace(/<a\b[^>]*>/gi, '<span class="nolink">').replace(/<\/a>/gi, '</span>'); // 作答中連結不能點（點了會離開畫面）
  }
  var IMG = {};
  function img(id) { if (!IMG[id]) IMG[id] = R.img(id).then(function (r) { return (r && r.data) || ''; }, function () { delete IMG[id]; return ''; }); return IMG[id]; }
  function fill(el, html) { el.innerHTML = sanitize(html); $$('img[data-img]', el).forEach(function (i) { img(i.getAttribute('data-img')).then(function (d) { i.src = d; }); }); }
  function prefetch(id) { var q = PAPER && PAPER[id]; if (!q) return; X.imgIds([q.s].concat(q.o || []).join(' ')).forEach(img); }
  function arr(v) { return Array.isArray(v) ? v : (v && typeof v === 'object' ? Object.keys(v).sort(function (a, b) { return a - b; }).map(function (k) { return v[k]; }) : []); }
  function attempts(rec) { rec = rec || {}; return Object.keys(rec).filter(function (k) { return /^\d+$/.test(k) && rec[k] && rec[k].st; }).sort(function (a, b) { return a - b; }).map(function (k) { var a = rec[k]; a.k = +k; return a; }); }
  function errText(e) { return e && (e.status === 401 || e.status === 403) ? '被系統拒絕' : (e && e.name === 'AbortError' ? '連線逾時' : '網路連不上'); }

  /* ---------- 進場 ---------- */
  if (!X.validCode(code)) { card('<div class="card"><h1>🔍 找不到測驗</h1><p>連結好像不完整。請重新掃老師的 QR Code，或跟老師確認網址。</p></div>'); return; }
  R.meta(code).then(function (m) {
    if (!m) { card('<div class="card"><h1>🔍 找不到這份測驗</h1><p>測驗代碼 <b class="mono">' + esc(code) + '</b> 不存在或已經被刪除。</p></div>'); return; }
    META = m; document.title = m.title + '｜線上檢定所'; landing();
  }, function (e) { card('<div class="card"><h1>📴 連不上</h1><p>' + errText(e) + '，請確認網路後重新整理。</p><button class="btn" onclick="location.reload()">🔄 重新整理</button></div>'); });

  // 測驗資訊：平常只顯示一行重點，點開才看完整清單（畫面留給學生輸入資料）
  function facts() {
    var g = G(), st = X.stateOf(META, now()), li = function (k, v) { return '<li><span>' + k + '</span>' + v + '</li>'; };
    return '<details class="info"><summary><span class="sum">📋 <b>' + X.STATE[st] + '</b>・' + (META.draw || META.n) + ' 題・' + META.mins + ' 分鐘・' + (META.tries >= 20 ? '不限次數' : '可作答 ' + META.tries + ' 次') + (META.closeAt ? '・截止 ' + X.fmtTime(META.closeAt) : '') + '</span><span class="more">測驗資訊 ▾</span></summary><ul>' +
      (META.subj ? li('科目', esc(META.subj)) : '') + (META.use ? li('用途', esc(META.use)) : '') + (META.term ? li('學期', esc(X.termName(META.term))) : '') +
      ((META.date || META.openAt) ? li('測驗日期', X.fmtTime(META.date || META.openAt)) : '') +
      li('狀態', X.STATE[st]) + li('題數', (META.draw || META.n) + ' 題') + li('作答時間', META.mins + ' 分鐘') + li('可作答次數', META.tries >= 20 ? '不限' : META.tries + ' 次') +
      (META.tries > 1 ? li('成績採計', X.POLICY[META.policy].name) : '') +
      (META.openAt ? li('開放時間', X.fmtTime(META.openAt)) : '') + (META.closeAt ? li('截止時間', X.fmtTime(META.closeAt)) : '') +
      li('反作弊', g ? '🛡️ 開啟（違規 ' + g.max + ' 次由系統代結）' : '關閉') + '</ul></details>';
  }
  function landing(msg) {
    var me = store.get('exam:me') || {};
    card('<div class="card"><h1>' + esc(META.title) + '</h1>' + (META.desc ? '<p class="small" style="white-space:pre-wrap;margin:6px 0 0">' + esc(META.desc) + '</p>' : '') + facts() +
      (msg ? '<div class="msg bad">' + msg + '</div>' : '') +
      '<div class="form"><div><label class="f">班級</label><input type="text" id="iCls" maxlength="8" placeholder="例如 201" value="' + esc(me.cls || '') + '"></div>' +
      '<div><label class="f">座號</label><input type="number" id="iSeat" min="1" max="99" inputmode="numeric" value="' + esc(me.seat || '') + '"></div>' +
      '<div><label class="f">姓名</label><input type="text" id="iName" maxlength="12" value="' + esc(me.name || '') + '"></div>' +
      '<div><label class="f">學號</label><input type="text" id="iNo" maxlength="12" autocapitalize="characters" autocomplete="off" value="' + esc(me.no || '') + '"></div></div>' +
      '<div class="row" style="margin-top:14px"><button class="btn lg" id="iGo">下一步 →</button>' + (META.pub ? '<span class="small muted">📣 老師已公布成績，按下一步可以查詢</span>' : '') + '</div></div>');
    $('#iNo').oninput = function (e) { var p = e.target.selectionStart; e.target.value = e.target.value.toUpperCase(); try { e.target.setSelectionRange(p, p); } catch (x) { } };
    $('#iGo').onclick = function () {
      var cls = $('#iCls').value.trim(), seat = +$('#iSeat').value, name = $('#iName').value.trim(), no = X.normId($('#iNo').value);
      if (!cls) return landing('請輸入班級');
      if (!(seat >= 1 && seat <= 99)) return landing('座號要是 1～99');
      if (!name) return landing('請輸入姓名');
      if (!X.validId(no)) return landing('學號要是 3～12 個英文字母或數字');
      ME = { cls: cls.slice(0, 8), seat: seat, name: name.slice(0, 12), no: no };
      store.set('exam:me', ME);
      lobby();
    };
  }

  // 登出：忘記這台裝置記住的學生資料（平板輪流用時，下一位不會看到上一位的姓名學號）
  function logout() { try { localStorage.removeItem('exam:me'); } catch (e) { } ME = null; REC = null; landing(); }
  /* ---------- 大廳：看自己的作答紀錄、決定能不能開始 ---------- */
  function lobby(note) {
    card('<div class="card"><p class="muted">讀取中…</p></div>');
    Promise.all([R.meta(code), R.student(code, ME.no), R.ext(code, ME.no).catch(function () { return null; }), R.bonus(code, ME.no).catch(function () { return 0; })]).then(function (r) {
      META = r[0] || META; REC = r[1] || {}; EXT = r[2] || {}; BONUS = +r[3] || 0;
      var list = attempts(REC), last = list[list.length - 1], st = X.stateOf(META, now()), html = '';
      html += '<div class="card"><div class="row"><h1 style="font-size:1.25rem">' + esc(META.title) + '</h1><span class="sp"></span><button class="btn ghost sm" id="lBack" title="清除這台裝置記住的班級座號姓名學號">🚪 登出</button></div>' +
        '<p style="margin:6px 0 0"><b>' + esc(ME.cls) + ' 班 ' + ME.seat + ' 號 ' + esc(ME.name) + '</b> <span class="mono muted">' + esc(ME.no) + '</span></p>';
      if (last && last.info && last.info.name !== ME.name) html += '<div class="msg warn">⚠️ 這個學號之前登記的姓名是「' + esc(last.info.name) + '」，請確認學號沒有打錯。</div>';
      if (note) html += '<div class="msg ' + (note.cls || 'info') + '">' + note.t + '</div>';
      if (list.length) html += '<div class="tries">' + list.map(function (a) { return '<div><b>第 ' + a.k + ' 次</b><span class="small muted">' + X.fmtTime(a.st) + ' 開始</span>' + (a.end ? '<span class="chip ' + (a.end.by === 'guard' ? 'bad' : a.end.by === 'self' ? 'ok' : 'blue') + '">' + X.BY[a.end.by].icon + ' ' + X.BY[a.end.by].name + (a.end.why ? '：' + esc(X.WHY[a.end.why] || a.end.why) : '') + '</span>' : '<span class="chip blue">🔵 作答中</span>') + '</div>'; }).join('') + '</div>';
      var action = '';
      if (last && !last.end) {
        var dl = X.deadlineOf(META, last, extK(last.k));
        if (now() > dl + X.CONFIG.GRACE || META.open === false) {
          html += '<div class="msg warn">⏰ 第 ' + last.k + ' 次作答的時間已經結束，系統會用你已經存下的答案收卷。</div>';
          if (META.open !== false) R.end(code, ME.no, last.k, 'time').catch(function () { });
        } else if (last.dev && last.dev !== DEV) {
          html += '<div class="msg bad">🔒 這個學號正在<b>另一台裝置</b>作答。<br>如果要換裝置繼續，請老師在成績頁按「🔓 解除裝置鎖」，再按下面的「重新檢查」。</div>';
          action = '<button class="btn" id="lRe">🔄 重新檢查</button>';
        } else {
          html += '<div class="msg info">🔵 第 ' + last.k + ' 次作答還在進行中，剩 ' + X.fmtLeft(dl - now()) + '（時間不會暫停）。</div>';
          action = '<button class="btn lg" id="lResume">▶ 繼續作答</button>';
        }
      } else {
        var used = list.length, tries = Math.min(20, META.tries + BONUS), why = '';
        if (st === 'off') why = '⏸ 測驗還沒開放，請等老師開放後再重新整理。';
        else if (st === 'wait') why = '⏳ 測驗將在 ' + X.fmtTime(META.openAt) + ' 開放。';
        else if (st === 'closed') why = '🔒 測驗已經結束了。';
        else if (used >= tries) why = '✅ 你已經用完 ' + tries + ' 次作答機會。';
        else if (META.gap && last && last.end && now() < last.end.t + META.gap * 60000) why = '⏳ 兩次作答之間要間隔 ' + META.gap + ' 分鐘，還要等 ' + X.fmtLeft(last.end.t + META.gap * 60000 - now()) + '。';
        if (why) { html += '<div class="msg ' + (st === 'open' && used >= tries ? 'ok' : 'warn') + '">' + why + '</div>'; action = st !== 'open' || why.indexOf('間隔') >= 0 ? '<button class="btn ghost" id="lRe">🔄 重新檢查</button>' : ''; }
        else {
          var k = used + 1, g = G(), mins = Math.min(META.mins, META.closeAt ? Math.floor((META.closeAt - now()) / 60000) : 1e9);
          html += '<h2 style="font-size:1.1rem;margin-top:14px">📝 第 ' + k + ' 次作答' + (tries > 1 ? '（共可作答 ' + (tries >= 20 ? '不限' : tries) + ' 次）' : '') + '</h2>' +
            '<div class="rules"><b>作答規則</b><ul style="margin:4px 0 0;padding-left:1.3em">' +
            '<li>按下「開始作答」後立刻開始倒數 <b>' + mins + ' 分鐘</b>' + (mins < META.mins ? '（因為快到截止時間了）' : '') + '，中途<b>不會暫停</b>。</li>' +
            '<li>每選一個答案就會自動存到雲端，時間到系統會自動收卷。</li>' +
            '<li>多重選擇題：每錯一個選項（該選沒選、不該選卻選）倒扣 1/5（等於扣該題 2/5 分），扣到 0 分為止；沒作答 0 分。</li>' +
            (g ? '<li>🛡️ <b>反作弊開啟</b>：作答時會進入全螢幕。<b>離開全螢幕、切換到其他頁面或 App、開分割畫面</b>都算違規' + (g.idle ? '；' + g.idle + ' 分鐘沒有任何動作也會被視為離開' : '') + '。</li>' +
              '<li>' + (g.max > 1 ? '第 ' + (g.max - 1 > 1 ? '1～' + (g.max - 1) : '1') + ' 次違規會警告，<b>第 ' + g.max + ' 次違規系統會立刻幫你交卷</b>' : '<b>只要違規一次，系統就會立刻幫你交卷</b>') + '，成績單會註明「系統代結」。</li>' +
              '<li>開始前請先關掉通知、音樂，平板請不要滑出控制中心。</li>' : '') +
            '</ul></div>' +

  function violation(kind) {
    if (ENDED || ENDING) return;
    var t = Date.now();
    if (t - LASTV < 3000) return; // 同一個動作常常一次觸發好幾種事件（切 App 時又離開全螢幕）
    LASTV = t; VIOL++;
    sendEv({ k: 'v', d: kind });
    var g = G(), v = $('#xV'); if (v) { v.textContent = '🛡️ 違規 ' + VIOL + '/' + g.max; v.classList.add('v'); }
    if (VIOL >= g.max) { finish('guard', kind); return; }
    var rest = g.max - VIOL;
    showOv('<div class="big">⚠️</div><h2>第 ' + VIOL + ' 次違規</h2><p>偵測到你<b>' + esc(X.WHY[kind]) + '</b>（' + X.fmtClock(t) + '）。</p>' +
      '<div class="msg bad">再違規 ' + rest + ' 次，系統會立刻幫你交卷。</div><p class="small muted">計時不會暫停。這次紀錄老師看得到。</p>' +
      '<button class="btn lg purple" id="oBack">回到考試</button>', 'warn');
    $('#oBack').onclick = function () { hideOv(); act(); enterFs(); };
  }
  function askFs() {
    showOv('<div class="big">🖥️</div><h2>請進入全螢幕作答</h2><p>按下面的按鈕繼續。作答時離開全螢幕會記違規。</p><button class="btn lg purple" id="oFs">進入全螢幕</button>', 'fs');
    $('#oFs').onclick = function () { enterFs().then(function () { setTimeout(function () { WASFS = isFs() || WASFS; }, 300); }); hideOv(); act(); };
  }
  function idleAsk() {
    IDLE = true; var n = 30;
    sendEv({ k: 'idle' });
    showOv('<div class="big">👀</div><h2>你還在嗎？</h2><p>已經 ' + G().idle + ' 分鐘沒有任何動作了。</p><div class="bigcount" style="font-size:2.6rem;font-weight:900;font-family:JetBrains Mono,monospace" id="oCnt">30</div><p class="small muted">倒數結束前沒有按，系統會代為交卷。</p><button class="btn lg purple" id="oHere">我還在！</button>', 'idle');
    var t = setInterval(function () { n--; var c = $('#oCnt'); if (c) c.textContent = n; if (n <= 0) { clearInterval(t); IDLE = false; if (!ENDED) finish('guard', 'idle'); } }, 1000);
    timers.push(t);
    $('#oHere').onclick = function () { clearInterval(t); IDLE = false; hideOv(); act(); };
  }
  function showOv(html, kind) { ov.innerHTML = '<div class="overlay" data-k="' + kind + '"><div class="box">' + html + '</div></div>'; }
  function hideOv() { ov.innerHTML = ''; }

  /* ---------- 查成績（老師公布後） ---------- */
  function results(list) {
    var box = $('#resBox');
    Promise.all([R.grade(code, ME.no), META.pubPaper ? R.paper(code) : null, META.pubKey ? R.key(code) : null]).then(function (r) {
      var g = r[0], paper = r[1], key = r[2] || {};
      if (!g) { box.innerHTML = '<h2>📣 成績</h2><p class="muted">老師還沒有登錄你的成績。</p>'; return; }
      var ks = g.k || {}, ended = list.filter(function (a) { return a.end; });
      var html = '<h2>📣 成績</h2><div class="facts"><div class="fact"><span>採計分數（' + X.POLICY[g.policy || META.policy].name + '）</span><b style="font-size:1.6rem">' + (g.f == null ? '—' : g.f) + '</b>' + (g.fp ? '<span class="small" style="color:var(--warn)">簡答批閱中・暫定</span>' : '') + '</div></div>' +
        '<div class="tries">' + ended.map(function (a) { var x = ks['a' + a.k] || {}; return '<div><b>第 ' + a.k + ' 次</b><span class="chip ok">' + (x.s == null ? '—' : x.s) + ' / ' + (x.full || META.total) + ' 分</span>' + (x.p ? '<span class="chip warn">✏️ ' + x.p + ' 題批閱中</span>' : '') + '<span class="chip ' + (a.end.by === 'guard' ? 'bad' : a.end.by === 'self' ? 'ok' : 'blue') + '">' + X.BY[a.end.by].icon + ' ' + X.BY[a.end.by].name + (a.end.why ? '：' + esc(X.WHY[a.end.why] || a.end.why) : '') + '</span>' + (paper ? '<button class="btn ghost sm" data-k="' + a.k + '">看題目</button>' : '') + '</div>'; }).join('') + '</div><div id="resQ"></div>';
      box.innerHTML = html;
      if (!paper) return;
      Object.keys(paper).forEach(function (id) { paper[id].o = arr(paper[id].o); });
      Object.keys(key).forEach(function (id) { key[id].a = arr(key[id].a); });
      var show = function (k) {
        var a = ended.filter(function (x) { return x.k === k; })[0], d = (ks['a' + k] || {}).d || {}, cm = (ks['a' + k] || {}).c || {}, sh = X.sheetFor(paper, META, code, ME.no, k), ans = a.ans || {};
        var el = $('#resQ'); el.className = 'res';
        el.innerHTML = '<h3 style="margin-top:12px">第 ' + k + ' 次的題目</h3>' + sh.ids.map(function (id, n) {
          var q = paper[id], v = ans[id], sc = d[id], kk = key[id] || {}, right = kk.a || [];
          var mine = q.t === 's' ? (typeof v === 'number' ? [v] : []) : Object.keys(X.multiToSet(v)).map(Number);
          return '<div class="q"><div class="row" style="gap:6px"><b>第 ' + (n + 1) + ' 題</b><span class="chip gray">' + X.TYPES[q.t] + '</span><span class="chip ' + (sc == null ? 'gray' : sc < 0 ? 'warn' : sc >= q.p ? 'ok' : sc > 0 ? 'warn' : 'bad') + '">' + (sc == null ? '—' : sc < 0 ? '批閱中' : sc + ' / ' + q.p + ' 分') + '</span></div><div class="qhtml" data-s="' + id + '"></div>' +
            (q.t === 'a' ? '<div class="op mine" style="white-space:pre-wrap">' + esc(v || '（未作答）') + '</div>' + (kk.r ? '<div class="exp"><b>參考答案：</b><div class="qhtml" data-r="' + id + '"></div></div>' : '') :
              sh.opt[id].map(function (orig, i) { return '<div class="op ' + (mine.indexOf(orig) >= 0 ? 'mine ' : '') + (right.indexOf(orig) >= 0 ? 'right' : '') + '"><b>' + X.LETTERS[i] + '.</b><span class="qhtml" data-o="' + id + '_' + orig + '"></span>' + (mine.indexOf(orig) >= 0 ? '　👈 你的答案' : '') + (right.indexOf(orig) >= 0 ? '　✅' : '') + '</div>'; }).join('')) +
            (kk.e ? '<div class="exp"><b>💡 解析：</b><div class="qhtml" data-e="' + id + '"></div></div>' : '') +
            (cm[id] ? '<div class="exp" style="border-left-color:var(--purple)"><b>💬 老師評語：</b>' + esc(cm[id]) + '</div>' : '') + '</div>';
        }).join('');
        sh.ids.forEach(function (id) {
          var q = paper[id], kk = key[id] || {};
          fillLinks($('[data-s="' + id + '"]', el), q.s);
          q.o.forEach(function (o, orig) { var x = $('[data-o="' + id + '_' + orig + '"]', el); if (x) fillLinks(x, o); });
          var r = $('[data-r="' + id + '"]', el); if (r) fillLinks(r, kk.r);
          var e = $('[data-e="' + id + '"]', el); if (e) fillLinks(e, kk.e);
        });
      };
      $$('button[data-k]', box).forEach(function (b) { b.onclick = function () { show(+b.dataset.k); }; });
    }, function () { box.innerHTML = '<h2>📣 成績</h2><p class="muted">讀取成績失敗，請重新整理。</p>'; });
  }
  function fillLinks(el, html) { // 成績頁的解析可以點連結
    if (!el) return;
    el.innerHTML = window.DOMPurify ? DOMPurify.sanitize(String(html || ''), { ADD_ATTR: ['data-img', 'target'] }).replace(/<a\b/gi, '<a target="_blank" rel="noopener"') : esc(X.plain(html));
    $$('img[data-img]', el).forEach(function (i) { img(i.getAttribute('data-img')).then(function (d) { i.src = d; }); });
  }
})();
</script>
</body>
</html>
