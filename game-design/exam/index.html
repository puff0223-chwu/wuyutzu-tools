<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>線上檢定所｜老師後台</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@700;900&family=Noto+Sans+TC:wght@400;500;700;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/quill@2.0.3/dist/quill.snow.css" rel="stylesheet">
<link href="exam.css?v=20261023b" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/quill@2.0.3/dist/quill.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="../../account/staff.js?v=20261023a"></script>
<script src="core.js?v=20261023b"></script>
<style>
.wrap{max-width:1180px;margin:0 auto;padding:18px 16px 70px}
.top{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}
.top h1{font-size:1.5rem}
.badge{background:var(--purple);color:#fff;border:2px solid var(--ink);border-radius:10px;padding:2px 10px;font-weight:900;box-shadow:2px 2px 0 var(--ink);font-size:.95rem}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 14px}
.tabs button{font:inherit;font-weight:800;border:2px solid var(--ink);border-radius:999px;padding:6px 16px;background:#fff;color:var(--ink);cursor:pointer}
.tabs button.on{background:var(--ink);color:#fff}
.subtabs button{padding:4px 13px;font-size:.92rem}
/* 題庫 */
.bankbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.bankbar select{width:auto;min-width:200px;font-weight:800}
.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-top:12px}
.qlist{margin-top:12px;border-top:2px solid var(--ink)}
.qrow{display:grid;grid-template-columns:28px 44px 1fr auto;gap:10px;align-items:start;padding:10px 4px;border-bottom:1px dashed var(--line)}
.qrow:hover{background:#fbf8f1}
.qrow .no{font-weight:900;color:var(--muted);text-align:right;font-family:"JetBrains Mono",monospace;padding-top:2px}
.qrow .txt{min-width:0}
.qrow .stem{font-weight:600;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.qrow .meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px;font-size:.82rem}
.qrow .acts{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.qrow input[type=checkbox]{width:18px;height:18px;margin-top:4px;accent-color:var(--purple)}
.batch{position:sticky;bottom:10px;z-index:5;background:var(--ink);color:#fff;border-radius:14px;padding:10px 14px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;box-shadow:0 8px 24px rgba(0,0,0,.25);margin-top:12px}
.batch .btn{box-shadow:none}
.empty{text-align:center;padding:40px 10px;color:var(--muted)}
.pager{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:10px 0}
section[data-step]{min-height:300px}
#wSteps{position:sticky;top:0;background:var(--paper);z-index:3;padding:8px 0;margin:6px 0 10px}
/* 對話框 */
.modal{position:fixed;inset:0;background:rgba(31,42,68,.55);z-index:50;display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:24px 12px}
.modal .box{background:var(--paper);border:2px solid var(--ink);border-radius:18px;box-shadow:6px 6px 0 var(--ink);width:min(920px,100%);padding:20px 22px;position:relative}
.modal .box.wide{width:min(1120px,100%)}
.modal .x{position:absolute;right:14px;top:12px;border:0;background:none;font-size:1.5rem;cursor:pointer;color:var(--muted)}
.modal h2{font-size:1.25rem;margin-bottom:10px;padding-right:30px}
/* 編輯器 */
.ed{background:#fff;border:2px solid var(--line);border-radius:12px;overflow:hidden}
.ed .ql-toolbar.ql-snow{border:0;border-bottom:1px solid var(--line);background:#faf8f3;padding:6px}
.ed .ql-container.ql-snow{border:0;font:inherit;font-size:1rem}
.ed .ql-editor{min-height:70px;max-height:420px;overflow:auto}
.ed.mini .ql-editor{min-height:38px;padding:8px 12px}
.ed .ql-editor img{max-width:100%;cursor:pointer}
.ed .ql-editor img.sel{outline:3px solid var(--purple)}
.optrow{display:grid;grid-template-columns:46px 1fr 34px;gap:8px;align-items:start;margin-bottom:8px}
.optrow .mark{display:flex;flex-direction:column;align-items:center;gap:2px;font-weight:900;padding-top:6px;cursor:pointer;user-select:none}
.optrow .mark input{width:22px;height:22px;accent-color:var(--ok);cursor:pointer}
.optrow.right .ed{border-color:var(--ok);box-shadow:0 0 0 2px var(--okbg)}
.typepick{display:flex;gap:8px;flex-wrap:wrap}
.typepick label{border:2px solid var(--line);border-radius:12px;padding:6px 12px;cursor:pointer;font-weight:800;background:#fff}
.typepick input{display:none}
.typepick label.on{border-color:var(--purple);background:var(--soft);color:var(--purple)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.tagbox{display:flex;flex-wrap:wrap;gap:6px;align-items:center;border:2px solid var(--line);border-radius:10px;padding:5px 8px;background:#fff}
.tagbox input{border:0;padding:3px;flex:1;min-width:120px}
.tagbox .chip button{border:0;background:none;cursor:pointer;color:inherit;padding:0 0 0 2px;font-weight:900}
.imgtools{display:none;gap:6px;align-items:center;margin:6px 0 0;font-size:.85rem}
.imgtools.on{display:flex}
/* 預覽題目 */
.qview{border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;background:#fff;margin-bottom:10px}
.qview .head{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:6px}
.qview .op{display:flex;gap:8px;padding:5px 8px;border-radius:8px;margin-top:4px;border:1px solid transparent}
.qview .op.right{background:var(--okbg);border-color:#bfe0cb}
.qview .op b{min-width:22px}
.qview .exp{margin-top:8px;padding:8px 10px;background:#faf8f3;border-left:4px solid var(--gold);border-radius:6px;font-size:.92rem}
/* 匯入預覽 */
table.t{width:100%;border-collapse:collapse;font-size:.9rem}
table.t th,table.t td{border-bottom:1px solid var(--line);padding:6px 6px;text-align:left;vertical-align:top}
table.t th{background:#f3eee3;position:sticky;top:0;z-index:1;font-weight:900;white-space:nowrap}
table.t tr.warn td{background:var(--warnbg)}
table.t td.num,table.t th.num{text-align:right;font-family:"JetBrains Mono",monospace}
.scroll{max-height:52vh;overflow:auto;border:1.5px solid var(--line);border-radius:10px}
.prog{height:12px;background:#eee8dc;border-radius:999px;overflow:hidden;border:1.5px solid var(--ink)}
.prog i{display:block;height:100%;background:var(--purple);width:0;transition:width .2s}
/* 測驗 */
.elist{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.ecard{background:#fff;border:2px solid var(--ink);border-radius:14px;padding:14px;cursor:pointer;text-align:left;font:inherit;color:inherit;box-shadow:3px 3px 0 var(--ink)}
.ecard:hover{background:#fffaf0}
.ecard{position:relative}
.cardx{position:absolute;top:8px;right:8px;border:1.5px solid var(--line);background:#fff;border-radius:8px;width:32px;height:32px;cursor:pointer;font-size:.95rem;opacity:.7;line-height:1}
.cardx:hover,.cardx:focus{opacity:1;border-color:var(--bad);background:var(--badbg)}
/* ❓ 說明小圖示 */
.ckt{display:inline-flex;align-items:center;gap:2px}
.ckt .ck{margin-right:2px}
.tip{position:relative;display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:50%;border:1.5px solid var(--muted);background:#fff;color:var(--muted);font:inherit;font-size:.75rem;font-weight:900;cursor:help;padding:0;vertical-align:middle;flex:none}
.tip:hover,.tip:focus{border-color:var(--purple);color:#fff;background:var(--purple);outline:none}
.tip::after{content:attr(data-tip);position:absolute;left:50%;bottom:calc(100% + 8px);transform:translateX(-50%);width:max-content;max-width:min(320px,80vw);background:var(--ink);color:#fff;font-size:.84rem;font-weight:500;line-height:1.55;text-align:left;padding:8px 11px;border-radius:10px;box-shadow:0 6px 18px rgba(0,0,0,.25);white-space:normal;opacity:0;pointer-events:none;transition:opacity .15s;z-index:20}
.tip:hover::after,.tip:focus::after{opacity:1}
.ecard b{font-size:1.08rem;display:block}
.ecard .code{font-family:"JetBrains Mono",monospace;color:var(--red);font-weight:800}
.ehead{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.ehead h2{font-size:1.35rem}
.share{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center}
.share .qr{background:#fff;border:2px solid var(--ink);border-radius:12px;padding:10px}
.share .link{font-family:"JetBrains Mono",monospace;background:#fff;border:2px dashed var(--line);border-radius:10px;padding:8px 12px;word-break:break-all;font-weight:700}
.bigcode{font-family:"JetBrains Mono",monospace;font-size:2.2rem;font-weight:800;letter-spacing:.12em;color:var(--red)}
.pick{max-height:46vh;overflow:auto;border:1.5px solid var(--line);border-radius:12px;background:#fff}
.pick label{display:grid;grid-template-columns:24px 36px 1fr auto;gap:8px;padding:7px 10px;border-bottom:1px dashed var(--line);cursor:pointer;align-items:start}
.pick label:hover{background:#fbf8f1}
.pick input{width:18px;height:18px;accent-color:var(--purple);margin-top:3px}
.sumbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;background:var(--soft);border-radius:12px;padding:8px 12px;margin-top:10px;font-weight:700}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin:6px 0 12px}
.stat{background:#fff;border:2px solid var(--ink);border-radius:12px;padding:6px 14px;min-width:96px}
.stat b{display:block;font-size:1.35rem;font-family:"JetBrains Mono",monospace}
.stat span{font-size:.8rem;color:var(--muted);font-weight:700}
.tscroll{overflow:auto;border:1.5px solid var(--line);border-radius:12px;background:#fff;max-height:70vh}
tr.click{cursor:pointer} tr.click:hover td{background:#fbf8f1}
.tl{border-left:3px solid var(--line);margin:6px 0 0 8px;padding-left:12px}
.tl div{margin:4px 0;font-size:.9rem}
.tl .v{color:var(--bad);font-weight:700}
.proj{position:fixed;inset:0;background:var(--ink);color:#fff;z-index:80;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;padding:20px}
.proj h1{font-size:clamp(1.6rem,4vw,3rem)}
.proj .qrbox{background:#fff;padding:18px;border-radius:18px}
.proj .bigcode{color:var(--gold);font-size:clamp(2.4rem,7vw,5rem)}
.proj .x{position:absolute;right:20px;top:14px;color:#fff;background:none;border:2px solid #fff;border-radius:10px;padding:4px 12px;font:inherit;font-weight:800;cursor:pointer}
@media (max-width:640px){
  .qrow{grid-template-columns:24px 1fr;}
  .qrow .no{display:none}
  .qrow .acts{grid-column:1/-1;justify-content:flex-start}
  .share{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div id="gate"></div>
<div class="wrap hidden" id="main">
  <div class="top">
    <span class="badge">🎲 遊戲研究室</span>
    <h1>線上檢定所｜老師後台</h1>
    <span class="sp"></span>
    <span class="small muted" id="who"></span>
    <a class="btn ghost sm" id="center" href="../../account/?app=exam">👥 會員中心</a>
    <button class="btn ghost sm" id="logout">登出</button>
  </div>
  <div class="tabs" id="tabs">
    <button data-t="exams" class="on">📝 測驗</button>
    <button data-t="bank">📚 題庫</button>
  </div>
  <section id="t-exams"></section>
  <section id="t-bank" class="hidden"></section>
</div>
<div id="modals"></div>
<script type="module" src="teacher.js?v=20261023c"></script>
</body>
</html>
