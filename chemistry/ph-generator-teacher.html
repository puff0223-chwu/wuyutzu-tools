<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>🧪 消失的指示劑｜老師頁</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="../account/staff.js?v=20261022a"></script>
<style>
  :root {
    --ink: #102226; --ink-2: #183238; --paper: #f8f6ef; --line: #e3ddca;
    --ok: #2e9e5b; --bad: #d9473a; --amber: #ffb627; --muted: #8aa2a6; --text: #1f2d30;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Noto Sans TC', 'Microsoft JhengHei', sans-serif; background: var(--ink); color: var(--paper); min-height: 100vh; padding: 16px; }
  .wrap { max-width: 1100px; margin: 0 auto; }
  .hidden { display: none !important; }
  .ph-strip { height: 10px; border-radius: 5px; margin-bottom: 14px;
    background: linear-gradient(90deg, #d7263d, #f46036, #f9c80e, #9bc53d, #3fb56b, #2a9d8f, #3a86ff, #5e60ce, #7b2cbf); }
  h1 { font-weight: 900; font-size: 1.9em; }
  h1 small { font-size: 0.5em; color: var(--muted); font-weight: 400; margin-left: 8px; }
  .mono { font-family: 'JetBrains Mono', monospace; }

  .current { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin: 12px 0; background: var(--ink-2);
    border-radius: 12px; padding: 10px 14px; }
  .current .code { font-family: 'JetBrains Mono', monospace; font-size: 1.5em; font-weight: 700; color: var(--amber); letter-spacing: 0.1em; }
  .current .meta { color: var(--muted); font-size: 0.9em; }

  .tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
  .tabs button { font: inherit; border: none; padding: 9px 16px; border-radius: 999px; cursor: pointer; background: var(--ink-2); color: var(--muted); }
  .tabs button.on { background: var(--amber); color: #1a1a1a; font-weight: 700; }

  .paper { background: var(--paper); color: var(--text); border-radius: 14px; padding: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
  .paper h2 { font-size: 1.15em; margin-bottom: 12px; }
  .paper h3 { font-size: 1em; margin: 18px 0 8px; }
  .hint { color: #6b6248; font-size: 0.88em; line-height: 1.6; }
  label.l { font-size: 0.82em; color: #6b6248; font-weight: 700; display: block; margin-bottom: 4px; }
  input[type=text], input[type=number] { font: inherit; padding: 9px 11px; border-radius: 9px; border: 2px solid var(--line); background: #fff; color: var(--text); outline: none; }
  input:focus { border-color: var(--amber); }

  .btn { font: inherit; font-weight: 700; border: none; border-radius: 10px; padding: 10px 16px; cursor: pointer; background: var(--amber); color: #1a1a1a; }
  .btn.dark { background: var(--ink-2); color: var(--paper); }
  .btn.ghost { background: #fff; border: 2px solid var(--line); color: var(--text); }
  .btn:disabled { opacity: 0.4; cursor: default; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end; }

  .levels { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  .lv { background: #fff; border: 2px solid var(--line); border-radius: 12px; padding: 12px; text-align: center; }
  .lv .stars { font-size: 0.85em; }
  .lv .name { font-weight: 900; margin: 2px 0; }
  .lv .desc { font-size: 0.75em; color: #7a715a; min-height: 2.6em; }
  .stepper { display: flex; align-items: center; justify-content: center; gap: 10px; margin-top: 8px; }
  .stepper button { width: 34px; height: 34px; border-radius: 50%; border: none; background: var(--ink-2); color: #fff; font-size: 1.2em; cursor: pointer; }
  .stepper span { font-size: 1.6em; font-weight: 900; min-width: 1.2em; }
  .total { margin-top: 10px; font-weight: 700; }
  .total.bad { color: var(--bad); }
  .opts { display: grid; gap: 8px; margin-top: 8px; }
  .opt { display: flex; gap: 10px; align-items: flex-start; background: #fff; border: 2px solid var(--line); border-radius: 10px; padding: 10px 12px; cursor: pointer; }
  .opt input { margin-top: 4px; }

  .result { margin-top: 16px; display: grid; grid-template-columns: auto 1fr; gap: 18px; align-items: center; background: #fff; border-radius: 12px; padding: 16px; border: 2px dashed var(--amber); }
  .result .bigcode { font-family: 'JetBrains Mono', monospace; font-size: 2.4em; font-weight: 700; letter-spacing: 0.1em; }
  .linkbox { font-family: 'JetBrains Mono', monospace; font-size: 0.8em; word-break: break-all; color: #555; margin: 6px 0 10px; }
  .qr { width: 150px; height: 150px; }
  .qr img, .qr canvas { width: 100% !important; height: 100% !important; }
  .recent { margin-top: 6px; display: flex; flex-wrap: wrap; gap: 6px; }
  .recent .rc { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: #fff; }
  .recent .rc button { border: none; border-radius: 0; }
  .recent .rc .del { color: #b33; padding: 5px 8px; border-left: 1px solid var(--line); }
  .recent .rc .del:hover { background: #fde8e6; }
  .recent .clear { color: #b33; }
  .recent button { font: inherit; font-size: 0.85em; border: 1px solid var(--line); background: #fff; border-radius: 8px; padding: 5px 9px; cursor: pointer; }

  /* 投影 */
  .proj-q { background: #fff; border-radius: 14px; padding: 18px 20px; margin-bottom: 12px; border: 2px solid var(--line); }
  .proj-q .top { display: flex; justify-content: space-between; color: #7a715a; font-size: 0.9em; }
  .proj-q .conc { font-family: 'JetBrains Mono', 'Noto Sans TC', monospace; font-size: 2em; font-weight: 700; margin: 6px 0; }
  .proj-q .conc sup { font-size: 0.6em; }
  .proj-q .sol { font-size: 1.15em; line-height: 1.8; color: #2a5d43; margin-top: 6px; }
  .proj-q .ans { font-size: 1.6em; font-weight: 900; color: var(--ok); }

  .overlay { position: fixed; inset: 0; background: var(--ink); z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; padding: 20px; text-align: center; }
  .overlay .big { font-family: 'JetBrains Mono', monospace; font-size: min(14vw, 9em); font-weight: 700; color: var(--amber); letter-spacing: 0.08em; }
  .overlay .qr { width: min(42vh, 70vw); height: min(42vh, 70vw); background: #fff; padding: 14px; border-radius: 14px; }
  .overlay .url { font-family: 'JetBrains Mono', monospace; color: var(--muted); font-size: 1.1em; word-break: break-all; }
  .overlay .close { position: absolute; top: 16px; right: 20px; }

  /* 總表 */
  .table-wrap { overflow-x: auto; margin-top: 12px; }
  table { border-collapse: collapse; width: 100%; font-size: 0.86em; background: #fff; }
  th, td { border: 1px solid var(--line); padding: 6px 7px; text-align: center; vertical-align: top; }
  th { background: #efe9d8; position: sticky; top: 0; }
  td.qcell { min-width: 120px; }
  .qtxt { font-family: 'JetBrains Mono', monospace; font-size: 0.82em; color: #555; }
  .key { color: #7a715a; font-size: 0.85em; }
  .stu { font-weight: 700; font-family: 'JetBrains Mono', monospace; }
  .stu.ok { color: var(--ok); } .stu.bad { color: var(--bad); }
  .tries { font-size: 0.78em; color: #888; }
  .status { font-size: 0.8em; padding: 2px 8px; border-radius: 999px; white-space: nowrap; }
  .st-none { background: #eee; color: #888; } .st-doing { background: #fff1cc; color: #8a6200; }
  .st-sub { background: #dde8ff; color: #2849a8; } .st-all { background: #d8f3e3; color: #1f7a45; }
  tr.summary td { background: #faf6ea; font-weight: 700; }
  .toolbar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }

  /* 列印 */
  #print-area { display: none; }
  @media print {
    body { background: #fff !important; padding: 0; color: #000; }
    .wrap > *:not(#print-area) { display: none !important; }
    #print-area { display: block !important; }
    .sheet { page-break-inside: avoid; border: 1.5px solid #000; border-radius: 6px; padding: 12px 16px; margin-bottom: 12px; }
    .sheet h4 { font-size: 13pt; margin-bottom: 4px; }
    .sheet .who { display: flex; gap: 22px; font-size: 11pt; margin-bottom: 8px; }
    .sheet .logline { font-size: 9.5pt; margin-bottom: 6px; }
    .sheet ol { margin-left: 20px; }
    .sheet li { font-size: 12pt; padding: 6px 0; font-family: 'JetBrains Mono', 'Noto Sans TC', monospace; }
    .sheet li sup { font-size: 0.65em; }
    .pb { page-break-after: always; }
    .keytable { width: 100%; border-collapse: collapse; font-size: 9.5pt; }
    .keytable th, .keytable td { border: 1px solid #000; padding: 3px 5px; text-align: left; }
  }
  @media (max-width: 700px) { .levels { grid-template-columns: 1fr 1fr; } .result { grid-template-columns: 1fr; } }
.home-row { display: flex; justify-content: flex-end; margin-bottom: 6px; }
.home-link { color: inherit; font-weight: 700; text-decoration: none; font-size: 0.9em; border: 2px solid currentColor; border-radius: 20px; padding: 2px 14px; opacity: 0.8; }
.home-link:hover { opacity: 1; }
@media print { .home-row { display: none !important; } }
:root { --lab-accent: #ffb627; }
#act-panel { margin-bottom: 12px; }
.legacy { margin-top: 14px; }
</style>
</head>
<body>
<div id="gate"></div>
<div class="wrap hidden" id="main">
  <div class="home-row"><a class="home-link" href="lab223.html">⚗️ 實驗室 No.223</a></div>
  <div class="ph-strip"></div>
  <h1>🧪 消失的指示劑 <small>pH 值計算練習 · 老師頁 · 請勿提供給學生</small></h1>

  <div id="act-panel"></div>
  <div class="current" id="current"></div>

  <div class="tabs" id="tabs">
    <button data-t="board" class="on">📡 即時總表</button>
    <button data-t="stats">📊 能力分析</button>
    <button data-t="project">🖥️ 投影講解</button>
    <button data-t="print">🖨️ 列印學習單</button>
  </div>

  <!-- 即時總表 -->
  <section class="paper" id="t-board">
    <div class="toolbar"><div class="filters" id="bd-filter"></div><span style="flex:1"></span><button class="btn dark" id="btn-xlsx">📥 匯出 Excel</button></div>
    <p class="hint" id="bd-note" style="margin-top:6px"></p>
    <div class="table-wrap" id="bd-table"></div>
    <details class="legacy"><summary class="hint" style="cursor:pointer">📂 查看改版前的題組碼紀錄（舊資料，只能看）</summary>
      <div class="row" style="margin-top:8px"><input type="text" id="in-load" class="mono" placeholder="例：4TJ-6NKY" style="width:180px;text-transform:uppercase"><button class="btn dark" id="btn-load">載入舊紀錄</button><button class="btn ghost" id="btn-unload">回到目前活動</button></div></details>
  </section>

  <!-- 能力分析 -->
  <section class="paper hidden" id="t-stats">
    <div class="filters" id="st-filter"></div>
    <div id="st-body"></div>
  </section>

  <!-- 投影 -->
  <section class="paper hidden" id="t-project">
    <h2>全班共同練習題</h2>
    <p class="hint">依目前活動的難度分配，產生一組全班一起算的題目，適合上課講解。按「顯示答案」才會出現解法。</p>
    <div class="row" style="margin:12px 0">
      <button class="btn" id="btn-proj-new">🔄 換一組</button>
      <button class="btn dark" id="btn-proj-all">顯示全部答案</button>
      <button class="btn ghost" id="btn-proj-hide">全部隱藏</button>
    </div>
    <div id="proj-list"></div>
  </section>

  <!-- 列印 -->
  <section class="paper hidden" id="t-print">
    <h2>列印學習單</h2>
    <p class="hint">每位學生的題目和他用平板領到的完全一樣（同一個活動＋班級＋座號）。</p>
    <div class="row" style="margin-top:12px">
      <div><label class="l">班級</label><input type="text" id="pr-cls" style="width:110px" placeholder="例：101"></div>
      <div><label class="l">座號從</label><input type="number" id="pr-from" value="1" min="1" style="width:80px"></div>
      <div><label class="l">到</label><input type="number" id="pr-to" value="35" min="1" style="width:80px"></div>
    </div>
    <div class="opts" style="max-width:520px">
      <label class="opt"><input type="checkbox" id="pr-sheets" checked><div><b>學生學習單</b><div class="hint">每人一張小卡，含班級座號、5 題與作答欄</div></div></label>
      <label class="opt"><input type="checkbox" id="pr-key" checked><div><b>解答表（含解法）</b><div class="hint">接在學習單後面，另起一頁</div></div></label>
    </div>
    <div class="row" style="margin-top:14px"><button class="btn" id="btn-print">🖨️ 列印</button></div>
  </section>

  <div id="print-area"></div>
</div>

<!-- 開新活動時的題目設定（會被搬進「開新活動」視窗） -->
<div id="setform" class="hidden" style="color:var(--text)">
  <h3 style="margin:4px 0 8px">難度分配（每人 5 題）</h3>
  <div class="levels" id="levels"></div>
  <div class="total" id="total"></div>
  <h3 style="margin:12px 0 6px">出題方向</h3>
  <div class="opts">
    <label class="opt"><input type="radio" name="dir" value="fwd"><div><b>① 只出正向：濃度 → pH</b><div class="hint">例：[H⁺] = 1.5×10⁻⁵ M，求 pH</div></div></label>
    <label class="opt"><input type="radio" name="dir" value="rev"><div><b>② 只出反向：pH／pOH → 濃度</b><div class="hint">例：pH = 4.82，求 [H⁺]。答案寫成「係數 × 10 的次方」</div></div></label>
    <label class="opt"><input type="radio" name="dir" value="mix" checked><div><b>③ 正反混合</b><div class="hint">每一題隨機決定正向或反向</div></div></label>
  </div>
  <h3 style="margin:12px 0 6px">學生作答方式</h3>
  <div class="opts">
    <label class="opt"><input type="radio" name="mode" value="instant" checked><div><b>✅ 即時對錯</b><div class="hint">每題按「檢查」只顯示對或錯（不給答案），可以一直重算到對；能力分析看得到每題試了幾次、錯成什麼。</div></div></label>
    <label class="opt"><input type="radio" name="mode" value="graded"><div><b>📝 交卷後由老師批改</b><div class="hint">學生只填答案、按交卷，看不到對錯。</div></div></label>
  </div>
  <label class="opt" style="margin-top:8px"><input type="checkbox" id="opt-log" checked><div><b>在題目上方顯示 log 參考值</b><div class="hint">log 2 = 0.30、log 3 = 0.48、log 5 = 0.70、log 7 = 0.85</div></div></label>
</div>

<script src="ph-core.js?v=20261022a"></script>
<script src="lab223.js?v=20261022a"></script>
<script src="lab223-board.js?v=20261022a"></script>
<script type="module">
import { startTeacher } from './lab223-teacher.js?v=20261022a';
const $ = id => document.getElementById(id);
const esc = PH.escapeHtml;
const st = document.createElement('style'); st.textContent = LabBoard.CSS; document.head.appendChild(st);
let current = null, META = null, CODE = null, legacy = false, RECS = {}, ROWS = [];
const dist = [1, 2, 2, 0];
const SEL = { cls: '', use: '', q: '' };

/* ---------- 題目設定（開新活動視窗裡） ---------- */
function renderLevels() {
  $('levels').innerHTML = PH.LEVELS.map((lv, i) => `<div class="lv"><div class="stars">${lv.stars}</div><div class="name">${lv.name}</div><div class="desc">${lv.desc}</div>
    <div class="stepper"><button type="button" data-i="${i}" data-d="-1">−</button><span>${dist[i]}</span><button type="button" data-i="${i}" data-d="1">+</button></div></div>`).join('');
  $('levels').querySelectorAll('button').forEach(b => b.onclick = () => { const i = +b.dataset.i; dist[i] = Math.max(0, Math.min(5, dist[i] + +b.dataset.d)); renderLevels(); });
  const sum = dist.reduce((a, b) => a + b, 0);
  $('total').textContent = sum === 5 ? '合計 5 題 ✔' : `合計 ${sum} 題，必須剛好 5 題`;
  $('total').className = 'total' + (sum === 5 ? '' : ' bad');
}
const readSettings = () => dist.reduce((a, b) => a + b, 0) !== 5 ? null : PH.makeCode({
  dist: dist.slice(), instant: document.querySelector('input[name=mode]:checked').value === 'instant',
  dir: document.querySelector('input[name=dir]:checked').value, showLog: $('opt-log').checked });
function describe(p) {
  if (!p) return '';
  if (p.set) p = PH.parseCode(p.set); if (!p) return '';
  const parts = PH.LEVELS.map((lv, i) => p.dist[i] ? `${lv.name}${p.dist[i]}` : '').filter(Boolean).join('、');
  return `${parts}｜${{ fwd: '只正向', rev: '只反向', mix: '正反混合' }[p.dir]}｜${p.instant ? '即時對錯' : '交卷批改'}｜${p.showLog ? '顯示 log' : '不顯示 log'}`;
}

/* ---------- 活動 ---------- */
const T = await startTeacher({ sys: 'ph', gate: $('gate'), main: $('main'), panel: $('act-panel'), settings: $('setform'), readSettings, describe, onSelect });
function onSelect(meta, code) {
  legacy = false; META = meta; CODE = code; current = meta ? PH.parseCode(meta.set) : null; projSeed = 0;
  RECS = {}; renderCurrent(); refresh();
  T.listen(code, (v, err) => { if (legacy) return; if (err) { $('bd-note').textContent = '⚠️ 讀不到作答資料：' + (err.code || err.message); return; } RECS = v; refresh(); });
}
function renderCurrent() {
  $('current').classList.toggle('hidden', !legacy && !!current);   // 目前活動已經顯示在上面的活動卡，只有看舊題組碼時才顯示這一條
  $('current').innerHTML = current ? `<span>${legacy ? '📂 舊題組碼' : '目前活動'}</span><span class="code">${legacy ? PH.prettyCode(current.code) : CODE}</span><span class="meta">${legacy ? '' : esc(LAB.label(META)) + '｜'}${describe(current)}</span>`
    : '<span class="meta">還沒有選活動：在上面「我的活動」選一個，或按「➕ 開新活動」</span>';
}

/* ---------- 分頁 ---------- */
let tab = 'board';
document.querySelectorAll('#tabs button').forEach(b => b.onclick = () => { tab = b.dataset.t; document.querySelectorAll('#tabs button').forEach(x => x.classList.toggle('on', x === b));
  ['board', 'stats', 'project', 'print'].forEach(x => $('t-' + x).classList.toggle('hidden', x !== tab)); refresh(); });

/* ---------- 轉接器（給 lab223-board.js） ---------- */
const A = () => ({ N: PH.CONFIG.QUESTIONS, qs: (c, s) => PH.forStudent(current, c, s), isCorrect: PH.isCorrect, level: q => q.level, LEVELS: PH.LEVELS,
  kind: PH.kindOf, KIND: PH.KIND, diagnose: PH.diagnose, DIAG: PH.DIAG, qText: PH.concText, qHTML: PH.concHTML,
  ansText: q => PH.ansText(q).replace(/^.*?= /, ''), fmt: PH.formatAnswerStr, instant: current.instant });
function refresh() {
  if (tab === 'project') return renderProjection();
  if (tab === 'print') return;
  if (!current) { $('bd-table').innerHTML = $('st-body').innerHTML = '<p class="hint">請先選一個活動。</p>'; $('bd-note').textContent = ''; return; }
  ROWS = LabBoard.rows(RECS, A());
  const list = LabBoard.applyFilter(ROWS, SEL);
  if (tab === 'board') {
    LabBoard.filterBar('bd-filter', ROWS, SEL, refresh);
    $('bd-note').textContent = `${legacy ? '舊紀錄' : '🟢 即時更新'}：共 ${ROWS.length} 人進來，篩選後 ${list.length} 人${META && !legacy && !META.open ? '｜⏸ 活動目前停止中' : ''}　·　${new Date().toLocaleTimeString('zh-TW')}`;
    $('bd-table').innerHTML = LabBoard.boardHTML(list, A());
  } else if (tab === 'stats') {
    LabBoard.filterBar('st-filter', ROWS, SEL, refresh);
    $('st-body').innerHTML = LabBoard.statsHTML(list, A());
  }
}
$('btn-xlsx').onclick = () => {
  if (!current) return;
  const list = LabBoard.applyFilter(ROWS, SEL);
  const s3 = []; list.forEach(x => x.qs.forEach((q, i) => s3.push({ 班級: x.cls, 座號: x.seat, 題號: i + 1, 難度: PH.LEVELS[q.level].name, 題型: PH.KIND[PH.kindOf(q)], 題目: PH.concText(q), 答案: PH.ansText(q), 解法: PH.solution(q).join('；') })));
  LabBoard.xlsx(list, A(), `消失的指示劑_${legacy ? PH.prettyCode(current.code) : (META.term + '_第' + META.item + '次_' + CODE)}.xlsx`, [['題目與解法', s3]]);
};
// 改版前的舊題組碼：只讀一次，不能改
$('btn-load').onclick = async () => {
  const p = PH.parseCode($('in-load').value); if (!p) return alert('題組碼不正確，請再確認一次');
  legacy = true; current = p; renderCurrent(); $('bd-note').textContent = '讀取中…';
  try { RECS = await PH.fetchAll(p.code); } catch (e) { RECS = {}; $('bd-note').textContent = '⚠️ 讀不到舊資料'; }
  refresh();
};
$('btn-unload').onclick = () => { if (META) onSelect(META, CODE); };

/* ---------- 投影 ---------- */
let projSeed = 0;
function renderProjection() {
  if (!current) { $('proj-list').innerHTML = '<p class="hint">請先選一個活動。</p>'; return; }
  const qs = PH.generate(current, 'PROJECT|' + projSeed);
  $('proj-list').innerHTML = qs.map((q, i) => { const lv = PH.LEVELS[q.level];
    return `<div class="proj-q"><div class="top"><span>第 ${i + 1} 題</span><span>${lv.stars} ${lv.name}</span></div><div class="conc">${PH.concHTML(q)}</div>
      <button class="btn ghost" data-i="${i}">顯示答案</button><div class="sol hidden" id="sol${i}">${PH.solution(q).map(esc).join('<br>')}<div class="ans">${PH.ansHTML(q)}</div></div></div>`; }).join('');
  $('proj-list').querySelectorAll('button[data-i]').forEach(b => b.onclick = () => { const s = $('sol' + b.dataset.i); s.classList.toggle('hidden'); b.textContent = s.classList.contains('hidden') ? '顯示答案' : '隱藏答案'; });
}
$('btn-proj-new').onclick = () => { projSeed++; renderProjection(); };
$('btn-proj-all').onclick = () => document.querySelectorAll('#proj-list .sol').forEach(s => s.classList.remove('hidden'));
$('btn-proj-hide').onclick = () => document.querySelectorAll('#proj-list .sol').forEach(s => s.classList.add('hidden'));

/* ---------- 列印 ---------- */
$('btn-print').onclick = () => {
  if (!current) return alert('請先選一個活動');
  const cls = LAB.normClass($('pr-cls').value), from = parseInt($('pr-from').value, 10), to = parseInt($('pr-to').value, 10);
  if (!cls || !(from >= 1) || !(to >= from)) return alert('請填好班級和座號範圍');
  try { localStorage.setItem('ph-teacher-print', cls); } catch (e) {}
  const seats = []; for (let s = from; s <= to; s++) seats.push(s);
  const tag = legacy ? '題組碼 ' + PH.prettyCode(current.code) : '活動 ' + CODE;
  const logLine = current.showLog ? '<div class="logline">log 2 = 0.30　log 3 = 0.48　log 5 = 0.70　log 7 = 0.85</div>' : '';
  let html = '';
  if ($('pr-sheets').checked) html += seats.map(seat => { const qs = PH.forStudent(current, cls, seat);
    return `<div class="sheet"><h4>🧪 消失的指示劑（pH 值計算）　<span style="font-weight:400;font-size:10pt">${tag}</span></h4>
      <div class="who"><span>班級：${esc(cls)}</span><span>座號：${seat}</span><span>姓名：＿＿＿＿＿＿＿</span></div>${logLine}
      <ol>${qs.map(q => `<li>${PH.concHTML(q)}　　${PH.blankHTML(q)}</li>`).join('')}</ol></div>`; }).join('');
  if ($('pr-key').checked) {
    if (html) html += '<div class="pb"></div>';
    html += `<h3 style="margin-bottom:8px">解答表｜${esc(cls)} 班｜${tag}</h3><table class="keytable"><tr><th>座號</th><th>題目與解法</th></tr>` +
      seats.map(seat => `<tr><td>${seat}</td><td>${PH.forStudent(current, cls, seat).map((q, i) => `${i + 1}. ${esc(PH.concText(q))} → <b>${PH.ansHTML(q)}</b><br><span style="color:#555">${PH.solution(q).map(esc).join('；')}</span>`).join('<br>')}</td></tr>`).join('') + '</table>';
  }
  if (!html) return alert('請至少勾選一種要列印的內容');
  $('print-area').innerHTML = html; window.print();
};
try { const c = localStorage.getItem('ph-teacher-print'); if (c) $('pr-cls').value = c; } catch (e) {}
renderLevels(); renderCurrent();
</script>
</body>
</html>
