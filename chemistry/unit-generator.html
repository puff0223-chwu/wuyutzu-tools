<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>📜 失落的配方</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&family=Noto+Serif+TC:wght@700;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #2a1b14; --ink-2: #3d2a1f; --paper: #f4e8cf; --line: #dcc69c;
    --ok: #3f8f5a; --bad: #b8432f; --amber: #d9993f; --route: #1f7a73; --muted: #b8a185; --text: #3a281c;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Noto Sans TC', 'Microsoft JhengHei', sans-serif;
    background: var(--ink); color: var(--paper); min-height: 100vh; padding: 16px;
    background-image: radial-gradient(circle at 15% 0%, rgba(217,153,63,0.16), transparent 45%),
                      radial-gradient(circle at 100% 100%, rgba(140,47,57,0.25), transparent 50%),
                      repeating-linear-gradient(45deg, rgba(255,255,255,0.02) 0 2px, transparent 2px 14px);
  }
  .wrap { max-width: 760px; margin: 0 auto; }
  .hidden { display: none !important; }
  .strip { height: 12px; border-radius: 6px; margin-bottom: 18px;
    height: 8px; background: repeating-linear-gradient(90deg, var(--amber) 0 16px, transparent 16px 24px); opacity: 0.75; }
  h1 { font-family: 'Noto Serif TC', serif; font-weight: 900; font-size: clamp(1.8em, 6.5vw, 2.6em); letter-spacing: 0.04em; }
  h1 span { color: var(--amber); }
  .sub { color: var(--muted); margin: 4px 0 16px; }
  .case-no { color: var(--muted); font-size: 0.8em; letter-spacing: 0.2em; margin-bottom: 2px; }
  .story { color: #e8d9bf; line-height: 1.85; margin: 10px 0 16px; font-size: 0.97em; }
  .story b { color: var(--amber); }

  .paper { background: var(--paper); color: var(--text); border-radius: 14px; padding: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.35); }
  label { font-size: 0.8em; color: #6b6248; font-weight: 700; display: block; margin-bottom: 4px; }
  input[type=text], input[type=number] {
    width: 100%; font: inherit; font-size: 1.05em; padding: 11px 12px; border-radius: 10px;
    border: 2px solid var(--line); background: #fff; color: var(--text); outline: none;
  }
  input:focus { border-color: var(--amber); }
  input:disabled { background: #f1efe8; }
  .grid { display: grid; grid-template-columns: 1.2fr 1fr 0.7fr 1.3fr; gap: 10px; }
  .code-input { font-family: 'JetBrains Mono', monospace; letter-spacing: 0.12em; text-transform: uppercase; }

  .btn { font: inherit; font-weight: 900; font-size: 1.05em; border: none; border-radius: 12px; padding: 13px 18px; cursor: pointer;
    background: var(--amber); color: #2a1b14; box-shadow: 0 4px 0 #8a5a1c; }
  .btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #8a5a1c; }
  .btn:disabled { opacity: 0.45; cursor: default; transform: none; }
  .btn.small { font-size: 0.95em; padding: 10px 14px; white-space: nowrap; }
  .btn.dark { background: var(--ink-2); color: var(--paper); box-shadow: 0 4px 0 #160d09; }
  .err { color: var(--bad); font-size: 0.9em; min-height: 1.3em; margin-top: 8px; }

  .bar { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
  .chip { background: var(--ink-2); border: 1px solid rgba(255,255,255,0.12); border-radius: 999px; padding: 5px 12px; font-size: 0.9em; }
  .chip b { color: var(--amber); }
  .const { background: rgba(217,153,63,0.14); border: 1px dashed rgba(217,153,63,0.6); border-radius: 12px;
    padding: 9px 14px; margin-bottom: 12px; text-align: center; font-size: 0.95em; }

  details.mapbox { background: var(--paper); color: var(--text); border-radius: 14px; padding: 10px 14px; margin-bottom: 12px; }
  details.mapbox summary { cursor: pointer; font-weight: 700; }
  .umap { display: block; width: 100%; max-width: 420px; height: auto; margin: 6px auto 0; }
  .umap .edge line { stroke: #c9c1a8; stroke-width: 3; }
  .umap .edge text { font-size: 13px; fill: #8a8068; }
  .umap .edge.on line { stroke: var(--route); stroke-width: 6; }
  .umap .edge.on text { fill: var(--route); font-weight: 700; }
  .umap .node rect { fill: #fff; stroke: #c9c1a8; stroke-width: 2; }
  .umap .node text { font-size: 14px; font-weight: 700; fill: #1f2a36; }
  .umap .node.on rect { fill: var(--route); stroke: var(--route); }
  .umap .node.on text { fill: #fff; }
  .map-cap { font-size: 0.85em; color: #6b6248; margin-top: 4px; min-height: 1.2em; }

  .q { background: var(--paper); color: var(--text); border-radius: 14px; padding: 16px; margin-bottom: 12px;
    border-left: 8px solid var(--line); transition: border-color 0.3s; }
  .q.ok { border-left-color: var(--ok); }
  .q.bad { border-left-color: var(--bad); }
  .q-head { display: flex; justify-content: space-between; align-items: center; font-size: 0.85em; color: #6b6248; margin-bottom: 6px; }
  .q-text { font-size: 1.08em; line-height: 1.75; margin: 4px 0 6px; }
  .q-text .note { display: block; font-size: 0.85em; color: #7a715a; }
  .q-atomic { font-family: 'JetBrains Mono', monospace; font-size: 0.85em; color: #6b5233; background: #e9d9b6; display: inline-block; padding: 3px 10px; border-radius: 8px; margin-bottom: 10px; }
  .q-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .q-row input { font-family: 'JetBrains Mono', monospace; font-size: 1.15em; text-align: center; font-weight: 700; }
  .q-row .plain { flex: 1; min-width: 120px; }
  .q-row .mant { width: 110px; }
  .q-row .exp { width: 70px; font-size: 0.95em; padding: 6px; }
  .q-row .times { font-weight: 900; font-size: 1.15em; }
  .q-row .times sup { display: inline-block; vertical-align: super; }
  .q-row .unit { font-weight: 700; min-width: 2em; }
  .q-msg { min-height: 1.4em; margin-top: 8px; font-weight: 700; }
  .q-msg.ok { color: var(--ok); }
  .q-msg.bad { color: var(--bad); }
  .route { margin-top: 6px; font-size: 0.92em; color: var(--route); font-weight: 700; }
  .shake { animation: shake 0.35s; }
  @keyframes shake { 0%,100%{transform:translateX(0)} 25%,75%{transform:translateX(-8px)} 50%{transform:translateX(8px)} }

  .foot { background: var(--paper); color: var(--text); border-radius: 14px; padding: 16px; text-align: center; }
  .progress { height: 10px; background: #e7e2d2; border-radius: 5px; overflow: hidden; margin: 10px 0; }
  .progress div { height: 100%; background: var(--ok); width: 0; transition: width 0.4s; }
  .sync { color: var(--muted); font-size: 0.82em; text-align: center; margin-top: 10px; min-height: 1.2em; }
  .confirm { margin-top: 12px; background: #fff4dc; border-radius: 10px; padding: 12px; }
  .confirm .row { display: flex; gap: 10px; justify-content: center; margin-top: 10px; }
  .done-banner { font-size: 1.3em; font-weight: 900; color: var(--ok); }

  @media (max-width: 560px) {
    .grid { grid-template-columns: 1fr 1fr; }
    .grid .wide { grid-column: 1 / -1; }
    .q-text { font-size: 1em; }
    .q-row .mant { width: 92px; }
    .q-row .exp { width: 58px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="strip"></div>
  <div class="case-no">CASE FILE · 化學實驗室 No.307 · 第三案</div>
  <h1>失落的<span>配方</span></h1>
  <p class="story">一位老化學家留下的<b>配方筆記</b>被人動了手腳，所有份量的單位全被打亂了！<br>
  要把質量、莫耳數、分子數、濃度一一<b>換算</b>回來，才能重現這份失落的配方。輸入老師給的題組碼，領取你負責還原的 5 頁配方（可以用計算機）。</p>

  <!-- 領題 -->
  <section id="join" class="paper">
    <div class="grid">
      <div class="wide"><label for="in-code">題組碼</label><input id="in-code" class="code-input" type="text" maxlength="9" placeholder="例：66B-8TMV" autocomplete="off"></div>
      <div><label for="in-cls">班級</label><input id="in-cls" type="text" maxlength="10" placeholder="例：101"></div>
      <div><label for="in-seat">座號</label><input id="in-seat" type="number" min="1" max="99" placeholder="例：7"></div>
      <div class="wide"><label for="in-name">姓名</label><input id="in-name" type="text" maxlength="12" placeholder="你的名字"></div>
    </div>
    <div class="err" id="join-err"></div>
    <button class="btn" id="btn-join" style="width:100%;margin-top:6px">開始還原配方 📜</button>
  </section>

  <!-- 作答 -->
  <section id="work" class="hidden">
    <div class="bar" id="info"></div>
    <div class="const">亞佛加厥數 N<sub>A</sub> = 6.02 × 10<sup>23</sup>　｜　答案算到小數點後第二位（第三位四捨五入）</div>
    <details class="mapbox hidden" id="mapbox" open>
      <summary>🗺️ 單位換算地圖</summary>
      <div id="map"></div>
      <div class="map-cap" id="map-cap">答錯時，這張地圖會亮出該題要走的路線。</div>
    </details>
    <div id="questions"></div>
    <div class="foot" id="foot"></div>
    <div class="sync" id="sync"></div>
  </section>
</div>

<script src="unit-core.js?v=20261003b"></script>
<script>
const $ = id => document.getElementById(id);
let S = null;

/* ---------- 領題 ---------- */
const urlCode = new URLSearchParams(location.search).get('code');
if (urlCode) $('in-code').value = UC.prettyCode(UC.normalizeCode(urlCode));
try {
  const saved = JSON.parse(localStorage.getItem('unit-student') || 'null');
  if (saved) { $('in-cls').value = saved.cls || ''; $('in-seat').value = saved.seat || ''; $('in-name').value = saved.name || ''; }
} catch (e) {}

$('btn-join').onclick = join;
async function join() {
  const parsed = UC.parseCode($('in-code').value);
  const cls = UC.normalizeClass($('in-cls').value);
  const seat = parseInt($('in-seat').value, 10);
  const name = $('in-name').value.trim();
  if (!parsed) return showErr('題組碼不正確，請再確認一次（共 7 個字）');
  if (!cls || !seat || seat < 1 || !name) return showErr('請把班級、座號、姓名都填好喔！');
  showErr('');
  try { localStorage.setItem('unit-student', JSON.stringify({ cls, seat, name })); } catch (e) {}

  const n = UC.CONFIG.QUESTIONS;
  S = { parsed, cls, seat, name, sid: UC.studentId(cls, seat), qs: UC.forStudent(parsed, cls, seat),
        answers: Array(n).fill(''), attempts: Array(n).fill(0), solved: Array(n).fill(false),
        history: [], submitted: false, firstTs: Date.now() };

  $('btn-join').disabled = true; $('btn-join').textContent = '領取中…';
  try {
    const rec = await UC.fetchRecord(parsed.code, S.sid);
    if (rec) {
      S.answers = UC.toArray(rec.answers, n, '').map(String);
      S.attempts = UC.toArray(rec.attempts, n, 0).map(Number);
      S.history = Array.isArray(rec.history) ? rec.history : Object.values(rec.history || {});
      S.submitted = !!rec.submitted;
      S.firstTs = rec.firstTs || S.firstTs;
      if (parsed.instant) S.solved = S.qs.map((q, i) => UC.isCorrect(q, S.answers[i]));
    }
    setSync('');
  } catch (e) {
    console.error(e);
    setSync('⚠️ 目前連不上伺服器，仍可作答，下次作答時會再送出');
  }
  $('btn-join').disabled = false; $('btn-join').textContent = '開始還原配方 📜';
  render();
}
function showErr(msg) { $('join-err').textContent = msg; }

/* ---------- 畫題目 ---------- */
function answerInputs(q, i) {
  if (q.kind === 'sci') {
    return `<input type="text" inputmode="decimal" class="mant" id="m${i}" autocomplete="off" placeholder="係數">
      <span class="times">× 10</span><input type="text" inputmode="numeric" class="exp" id="e${i}" autocomplete="off" placeholder="次方">
      <span class="unit">${q.unit}</span>`;
  }
  return `<input type="text" inputmode="decimal" class="plain" id="v${i}" autocomplete="off" placeholder="小數點後兩位">
    <span class="unit">${q.unit}</span>`;
}
function getAnswer(i) {
  const q = S.qs[i];
  if (q.kind === 'sci') {
    const m = $('m' + i).value.trim(), e = $('e' + i).value.trim().replace(/[−–]/g, '-');
    return m || e ? `${m}e${e}` : '';
  }
  return $('v' + i).value.trim();
}
function setAnswer(i, str) {
  const q = S.qs[i];
  if (q.kind === 'sci') {
    const parts = String(str || '').split(/e/i);
    $('m' + i).value = parts[0] || ''; $('e' + i).value = parts[1] || '';
  } else $('v' + i).value = str || '';
}
const inputsOf = i => S.qs[i].kind === 'sci' ? [$('m' + i), $('e' + i)] : [$('v' + i)];

function render() {
  $('join').classList.add('hidden');
  $('work').classList.remove('hidden');
  const p = S.parsed;
  $('info').innerHTML =
    `<span class="chip">${UC.escapeHtml(S.cls)} 班 ${S.seat} 號 <b>${UC.escapeHtml(S.name)}</b></span>` +
    `<span class="chip">題組碼 ${UC.prettyCode(p.code)}</span>` +
    `<span class="chip">${p.instant ? '✅ 即時對錯' : '📝 交卷後由老師批改'}</span>`;
  $('mapbox').classList.toggle('hidden', !p.hint);
  if (p.hint) {
    $('map').innerHTML = UC.mapSVG([], p.formula);
    if (!p.instant) $('map-cap').textContent = '先想清楚要從哪個單位走到哪個單位，再動手計算。';
  }

  $('questions').innerHTML = S.qs.map((q, i) => {
    const lv = UC.LEVELS[q.level], atomic = UC.atomicHTML(q);
    return `<div class="q" id="q${i}">
      <div class="q-head"><span>📜 配方 第 ${i + 1} 頁</span><span>${lv.stars} ${lv.name}</span></div>
      <div class="q-text">${q.html}</div>
      ${atomic ? `<div class="q-atomic">原子量：${atomic}</div>` : ''}
      <div class="q-row">${answerInputs(q, i)}${p.instant ? `<button class="btn small" id="c${i}">檢查</button>` : ''}</div>
      <div class="q-msg" id="msg${i}"></div>
      <div class="route hidden" id="rt${i}"></div>
    </div>`;
  }).join('');

  S.qs.forEach((q, i) => {
    setAnswer(i, S.answers[i]);
    const ins = inputsOf(i);
    if (p.instant) {
      $('c' + i).onclick = () => check(i);
      ins.forEach(el => el.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.isComposing) check(i); }));
    } else {
      ins.forEach(el => el.addEventListener('input', () => { S.answers[i] = getAnswer(i); scheduleSave(); }));
    }
    paintQuestion(i);
  });
  renderFoot();
}

function paintQuestion(i) {
  const q = S.qs[i], box = $('q' + i), msg = $('msg' + i);
  box.classList.remove('ok', 'bad');
  if (S.parsed.instant) {
    if (S.solved[i]) {
      box.classList.add('ok'); inputsOf(i).forEach(el => el.disabled = true); $('c' + i).disabled = true;
      msg.className = 'q-msg ok';
      msg.textContent = `✅ 答對了！${S.attempts[i] > 1 ? `（第 ${S.attempts[i]} 次）` : ''}`;
      $('rt' + i).classList.add('hidden');
    } else if (S.attempts[i] > 0) {
      msg.className = 'q-msg bad';
      msg.textContent = `❌ 還不對，再算一次（已試 ${S.attempts[i]} 次）`;
      showRoute(i);
    }
  } else if (S.submitted) {
    inputsOf(i).forEach(el => el.disabled = true);
  }
}

function showRoute(i) {
  if (!S.parsed.hint) return;
  const q = S.qs[i];
  $('rt' + i).classList.remove('hidden');
  $('rt' + i).textContent = `🗺️ 路線提示：${UC.routeText(q.route)}`;
  $('map').innerHTML = UC.mapSVG(q.route, S.parsed.formula);
  $('map-cap').textContent = `第 ${i + 1} 頁的路線：${UC.routeText(q.route)}`;
}

/* ---------- 即時對錯 ---------- */
function check(i) {
  if (S.solved[i]) return;
  const q = S.qs[i], val = getAnswer(i);
  const msg = $('msg' + i);
  if (!val || (q.kind === 'sci' && (!$('m' + i).value.trim() || !$('e' + i).value.trim()))) {
    msg.className = 'q-msg bad'; msg.textContent = q.kind === 'sci' ? '係數和次方都要填喔' : '請先填答案';
    return;
  }
  if (UC.parseAnswer(val) === null) {
    msg.className = 'q-msg bad'; msg.textContent = '請輸入數字，例如 3.01 和 23'; return;
  }
  const ok = UC.isCorrect(q, val);
  S.answers[i] = val; S.attempts[i]++; S.solved[i] = ok;
  S.history.push([i, val, ok ? 1 : 0, Date.now()]);
  if (S.history.length > 100) S.history = S.history.slice(-100);
  if (!ok) { const box = $('q' + i); box.classList.add('bad'); box.classList.remove('shake'); void box.offsetWidth; box.classList.add('shake'); }
  paintQuestion(i);
  if (ok && S.parsed.hint) { $('map').innerHTML = UC.mapSVG([], S.parsed.formula); $('map-cap').textContent = '答錯時，這張地圖會亮出該題要走的路線。'; }
  renderFoot();
  save();
}

/* ---------- 底部 ---------- */
function renderFoot() {
  const n = S.qs.length;
  if (S.parsed.instant) {
    const done = S.solved.filter(Boolean).length;
    $('foot').innerHTML = done === n
      ? `<div class="done-banner">🎉 5 頁配方全部還原！</div><p style="margin-top:6px">老師已經收到你的還原紀錄。</p>`
      : `<div>已還原 <b>${done}</b> / ${n} 頁</div><div class="progress"><div style="width:${done / n * 100}%"></div></div>`;
  } else if (S.submitted) {
    $('foot').innerHTML = `<div class="done-banner">📮 已交卷</div><p style="margin-top:6px">答案已送給老師，等待老師批改。</p>`;
  } else {
    const filled = S.answers.filter(a => String(a).trim()).length;
    $('foot').innerHTML = `<div>已填寫 <b>${filled}</b> / ${n} 題</div>
      <button class="btn" id="btn-submit" style="margin-top:10px;width:100%">交卷 📮</button>
      <div class="confirm hidden" id="confirm">交卷後就不能再修改答案囉，確定要交卷嗎？
        <div class="row"><button class="btn small" id="btn-yes">確定交卷</button><button class="btn small dark" id="btn-no">再檢查一下</button></div>
      </div>`;
    $('btn-submit').onclick = () => { $('confirm').classList.remove('hidden'); $('btn-submit').classList.add('hidden'); };
    $('btn-no').onclick = () => { $('confirm').classList.add('hidden'); $('btn-submit').classList.remove('hidden'); };
    $('btn-yes').onclick = submit;
  }
}

async function submit() {
  S.qs.forEach((q, i) => { S.answers[i] = getAnswer(i); });
  S.submitted = true;
  const ok = await save();
  if (!ok) { S.submitted = false; renderFoot(); return; }
  S.qs.forEach((q, i) => paintQuestion(i));
  renderFoot();
}

/* ---------- 存到 Firebase ---------- */
let saveTimer = null;
function scheduleSave() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    save();
    const b = document.querySelector('#foot b');
    if (b && !S.parsed.instant && !S.submitted) b.textContent = S.answers.filter(a => String(a).trim()).length;
  }, 800);
}
async function save() {
  const rec = {
    cls: S.cls, seat: S.seat, name: S.name,
    answers: S.answers, attempts: S.attempts, history: S.history,
    submitted: S.submitted, firstTs: S.firstTs, ts: Date.now()
  };
  try {
    await UC.saveRecord(S.parsed.code, S.sid, rec);
    setSync('✔ 已同步給老師 ' + new Date().toLocaleTimeString('zh-TW', { hour: '2-digit', minute: '2-digit' }));
    return true;
  } catch (e) {
    console.error(e);
    setSync('⚠️ 送出失敗，請檢查網路後再試一次');
    return false;
  }
}
function setSync(msg) { $('sync').textContent = msg; }
</script>
</body>
</html>
