<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>隱秘的鍵結社：全班連線控制台</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&family=Noto+Serif+TC:wght@700;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<link rel="stylesheet" href="mp.css?v=20261016a">
<style>
  /* 老師控制台（投影用）：開房 → 大廳 → 分配 → 回合（行動、結算、市場、事件）→ 揭曉 */
  header { display: flex; align-items: center; gap: 12px; padding: 10px 18px; background: #0d0b12cc; border-bottom: 1px solid var(--night-3); position: sticky; top: 0; z-index: 20; flex-wrap: wrap; }
  header h1 { font-family: 'Noto Serif TC', serif; font-size: 1.25em; color: var(--candle); flex: 1; }
  .clock { font-family: 'Noto Serif TC', serif; font-size: 2.2em; font-weight: 900; color: var(--candle); min-width: 110px; text-align: center; }
  .clock.low { color: #ff8a70; animation: blink 1s infinite; } @keyframes blink { 50% { opacity: .5; } }
  main { max-width: 1500px; margin: 0 auto; padding: 14px 14px 100px; }
  .setup { max-width: 760px; margin: 30px auto; display: grid; gap: 14px; }
  .lobby { display: grid; grid-template-columns: 340px 1fr; gap: 16px; align-items: start; }
  #qr { background: #fff; padding: 12px; border-radius: 14px; width: 300px; height: 300px; } #qr img, #qr canvas { width: 100% !important; height: 100% !important; }
  .names { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; } .names span { background: var(--night-3); border-radius: 8px; padding: 4px 10px; font-weight: 700; }
  .game { display: grid; grid-template-columns: 1.1fr 1fr; gap: 14px; align-items: start; }
  .facs { display: grid; gap: 8px; }
  .fac { border-left: 8px solid; border-radius: 12px; background: var(--night-2); padding: 10px 12px; }
  .fac h3 { display: flex; justify-content: space-between; align-items: baseline; font-size: 1.15em; }
  .fac .pct { font-size: 1.5em; font-weight: 900; }
  .fac .meta { color: var(--soft); font-size: .88em; display: flex; gap: 12px; flex-wrap: wrap; }
  .parts { margin-top: 6px; display: grid; gap: 3px; font-size: .85em; }
  .parts > div { display: grid; grid-template-columns: 1fr 90px; gap: 8px; align-items: center; }
  .feed { max-height: 170px; overflow: auto; font-size: .9em; color: var(--soft); } .feed div { padding: 3px 0; border-bottom: 1px dashed #ffffff14; }
  .ctrl { position: sticky; bottom: 0; background: #0d0b12ee; border-top: 1px solid var(--night-3); padding: 10px 18px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; z-index: 20; }
  .stage { margin-top: 14px; }
  .news-g { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 10px; }
  .eff { display: inline-block; border-radius: 8px; padding: 2px 8px; font-weight: 900; } .eff.up { background: #1d4a2e; color: #9ff0bb; } .eff.dn { background: #4a1d1d; color: #ffb3a3; }
  .mk { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 6px; }
  .mk div { background: var(--night-2); border-radius: 10px; padding: 6px 8px; display: flex; align-items: center; justify-content: space-between; gap: 4px; }
  .mk b { font-size: 1.1em; } .mk button { border: 0; border-radius: 6px; background: var(--night-3); color: #fff; width: 26px; height: 26px; }
  .evq { font-size: 1.6em; font-weight: 900; line-height: 1.5; } .evq sub { font-size: .65em; } .evq sup { font-size: .6em; }
  .evo { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; } .evo div { background: var(--night-2); border-radius: 12px; padding: 12px 16px; font-size: 1.25em; font-weight: 700; } .evo div.right { background: #1d4a2e; }
  .end-h { text-align: center; font-family: 'Noto Serif TC', serif; font-size: 2.2em; color: var(--candle); margin: 10px 0; }
  table.t { width: 100%; border-collapse: collapse; } table.t th, table.t td { padding: 6px 8px; border-bottom: 1px dashed #ffffff1f; text-align: left; } table.t th { color: var(--soft); font-weight: 700; }
  .fstrip { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 8px; margin-bottom: 12px; }
  .fstrip .fac { padding: 8px 10px; } .fh { display: flex; justify-content: space-between; align-items: baseline; font-size: 1.08em; } .fh .pct { font-size: 1.45em; font-weight: 900; }
  .stage { margin-top: 0 !important; } .stage > .card + .card { margin-top: 12px; }
  @media (max-width: 1000px) { .game, .lobby { grid-template-columns: 1fr; } }
</style>

<body>
<header><h1>🕯️ 隱秘的鍵結社・全班連線</h1><span class="chip" id="h-room"></span><span class="chip" id="h-round"></span><span class="chip gold" id="h-phase"></span><span class="clock" id="h-clock"></span></header>
<main id="main"></main>
<div class="ctrl hidden" id="ctrl"></div>
<div class="modal hidden" id="modal"><div class="mcard" id="mcard"></div></div>
<div class="toast" id="toast"></div>

<script src="data.js?v=20261016a"></script>
<script src="facts.js?v=20261016a"></script>
<script src="bank.js?v=20261016a"></script>
<script src="quiz.js?v=20261016a"></script>
<script src="world.js?v=20261016a"></script>
<script src="cloud.js?v=20261016a"></script>
<script src="mp-data.js?v=20261016a"></script>
<script src="mp-engine.js?v=20261016a"></script>
<script src="mp-cloud.js?v=20261016a"></script>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const F = WORLD.FACTIONS, RL = MPE.ROLE;
const HKEY = 'bond-mp-host';
const PH = { lobby: '大廳', intro: '分配完成', act: '行動中', settle: '結算', market: '市場', event: '隨機事件', end: '揭曉' };
let R = null, ROOM = null, LV = {}, dirty = false, lastHost = 0, flash = [], peek = false;
const toast = t => { const el = $('toast'); el.textContent = t; el.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove('on'), 2400); };
const modal = h => { $('mcard').innerHTML = h; $('modal').classList.remove('hidden'); return $('mcard'); };
const closeModal = () => $('modal').classList.add('hidden');
const fx = f => `<b style="color:${F[f].color}">${F[f].icon} ${F[f].name}</b>`;
const studentUrl = () => location.href.replace(/mp-host\.html.*$/, 'mp.html') + '?room=' + ROOM + (QS.get('fb') ? '&fb=' + encodeURIComponent(QS.get('fb')) : '');

/* ---------- 開房 ---------- */
function setup() {
  let lv = 'g11', df = 'normal';
  const last = localStorage.getItem(HKEY);
  $('main').innerHTML = `<div class="setup">
    <div class="card"><h2 class="serif" style="color:var(--candle)">👥 開一個連線房間</h2>
      <p class="soft" style="margin:6px 0 12px">學生用手機或平板掃 QR 進大廳，人到齊後按「開始分配」，系統會依人數自動分勢力、角色、雙面人，並查表決定勝利條件。</p>
      <div class="row" style="margin-bottom:10px"><b style="width:56px">版本</b><div class="seg" id="s-lv"><button data-v="g10">高一版</button><button data-v="g11" class="on">高二高三版</button></div></div>
      <div class="row" style="margin-bottom:10px"><b style="width:56px">難度</b><div class="seg" id="s-df"><button data-v="easy">簡單</button><button data-v="normal" class="on">標準</button><button data-v="hard">困難</button></div><span class="soft small">全班答對率約 6 成選簡單、7 成標準、8 成困難</span></div>
      <p class="soft small">高二高三版要 22 人以上才會開五勢力，人少時自動改三大國（題庫不變）。</p>
      <div class="row" style="margin-top:12px"><button class="btn big" id="create">🕯️ 建立房間</button>${last ? `<button class="btn ghost" id="resume">↩ 繼續主持房間 ${esc(last)}</button>` : ''}</div>
    </div></div>`;
  const seg = (id, set) => $(id).querySelectorAll('button').forEach(b => b.onclick = () => { $(id).querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b)); set(b.dataset.v); });
  seg('s-lv', v => lv = v); seg('s-df', v => df = v);
  $('create').onclick = async () => {
    if (last) MPC.del(last).catch(() => {});   // 開新房間時順手清掉上一間（學生的成績已經存在各自的紀錄裡）
    ROOM = MPC.roomCode(); R = MPE.newRoom({ room: ROOM, level: lv, diff: df });
    try { await MPC.put(ROOM, { host: R }); } catch (e) { return toast('連不上雲端：' + e.message); }
    localStorage.setItem(HKEY, ROOM); attach();
  };
  if (last) $('resume').onclick = () => resume(last);
}
// Firebase 會拿掉空物件、把有洞的陣列變物件：讀回來補齊
function fixR(R) {
  const arr = (o, n) => { if (Array.isArray(o)) return o; const a = Array(n || 0).fill(null); Object.entries(o || {}).forEach(([k, v]) => { a[+k] = v; }); return a; };
  ['lobby', 'players'].forEach(k => R[k] = R[k] || {});
  ['feed', 'history', 'covert', 'bs', 'facs'].forEach(k => R[k] = Array.isArray(R[k]) ? R[k] : Object.values(R[k] || {}));
  R.board = Array.isArray(R.board) ? R.board : Object.values(R.board || {});
  if (R.facs.length) { const M = WORLD.makeMap(R.seed, R.facs); R.owner = arr(R.owner, M.cells.length); }
  Object.values(R.F || {}).forEach(x => {
    ['inv', 'mols', 'sellTo', 'fr', 'frStart'].forEach(k => x[k] = x[k] || {});
    x.made = Object.assign({ hb: 0, vw: 0, H2O: 0, NH3: 0, HF: 0, comp: 0 }, x.made || {});
    ['sabs', 'log', 'mem', 'spiesIn', 'spiesOut', 'parts'].forEach(k => x[k] = Array.isArray(x[k]) ? x[k] : Object.values(x[k] || {}));
    x.team = x.team || { type: 'correct', thr: 1, prog: 0, done: false, text: '' };
  });
  Object.values(R.players).forEach(p => {
    p.stash = p.stash || {}; p.msgs = Array.isArray(p.msgs) ? p.msgs : Object.values(p.msgs || {}); p.ack = p.ack || {};
    p.cnt = Object.assign({ mined: {}, comp: 0, mol: 0, walls: 0, intel: 0, intelTok: 0, attacks: 0, issued: 0, repairs: 0, friend: 0, bsDone: 0, quick: 0, quickOk: 0, roleOk: 0 }, p.cnt || {}); p.cnt.mined = p.cnt.mined || {};
  });
  if (R.event) R.event.ans = R.event.ans || {};
  return R;
}
async function resume(room) {
  try { const h = await MPC.get(room + '/host'); if (!h) { localStorage.removeItem(HKEY); return toast('找不到這個房間'); } R = fixR(h); ROOM = room; attach(); }
  catch (e) { toast('連不上雲端：' + e.message); }
}

/* ---------- 連線：大廳與學生動作 ---------- */
// 穩定性設計（2026-10-15 崩潰測試後）：
// ・學生動作一到就處理、處理完立刻同步（不靠計時器，分頁在背景也不會卡住）
// ・同步一次只送一批，送完才送下一批（避免舊資料蓋過新資料）；失敗自動重試，成功才記錄「已送出」
// ・每位學生只寫「有變的欄位」：v/<sid>/g|f|p/<欄位>
// ・處理過的動作和畫面資料一起刪掉，少一次連線
const DONE = new Set(); let DEL = {}, flushing = false, again = false, saving = false, failN = 0, listeners = [];
async function attach() {
  try { MPE.setOffset(await MPC.serverOffset(ROOM)); } catch (e) {}
  listeners.push(MPC.listen(ROOM + '/lobby', d => { let n = 0; Object.values(d || {}).forEach(l => { if (l && typeof l.sid === 'string' && !R.lobby[l.sid]) { MPE.join(R, l); n++; } }); if (n) changed(); }));
  listeners.push(MPC.listen(ROOM + '/act', d => {
    if (!d || typeof d !== 'object') return; const ks = Object.keys(d).sort(); let n = 0;
    ks.forEach(k => { DEL['act/' + k] = null; if (DONE.has(k)) return; DONE.add(k); n++; try { const res = MPE.act(R, d[k]); if (res && res.cell != null) flash.push(res.cell); } catch (e) { console.warn('act error', e, d[k]); } });
    if (ks.length) changed(n > 0);
  }));
  setInterval(tick, 1000);
  setInterval(() => { if (!flushing && (dirty || Object.keys(DEL).length)) kick(); }, 2000);   // 保險：漏掉的同步補送
  setInterval(saveHost, 5000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) listeners.forEach(l => l.refresh()); });
  window.addEventListener('beforeunload', e => { if (R && R.phase !== 'lobby' && R.phase !== 'end') { e.preventDefault(); e.returnValue = ''; } });
  dirty = true; kick(); saveHost(true); render();
}
function changed(redraw = true) { dirty = true; kick(); if (redraw) scheduleRender(); }
let rq = false;
function scheduleRender() { if (rq) return; rq = true; setTimeout(() => { rq = false; render(); }, 60); }
async function kick() {
  if (flushing) { again = true; return; }
  flushing = true;
  try { do { again = false; await flushOnce(); } while (again); failN = 0; }
  catch (e) { failN++; if (failN === 3) toast('⚠️ 網路不穩，正在重試同步……'); setTimeout(kick, Math.min(5000, 500 * failN)); }
  finally { flushing = false; }
}
async function flushOnce() {
  dirty = false;
  const { out } = MPE.studentViews(R), up = { ...DEL }, sent = {};
  Object.entries(out).forEach(([sid, v]) => ['g', 'f', 'p'].forEach(sec => {
    const val = v[sec];
    if (val == null) return;
    Object.entries(val).forEach(([k, x]) => { const key = `v/${sid}/${sec}/${k}`, str = JSON.stringify(x === undefined ? null : x); if (LV[key] !== str) { up[key] = x === undefined ? null : x; sent[key] = str; } });
    // 這一節少掉的欄位要刪掉
    Object.keys(LV).forEach(key => { if (key.startsWith(`v/${sid}/${sec}/`) && !(key.slice(`v/${sid}/${sec}/`.length) in val)) { up[key] = null; sent[key] = 'null'; } });
  }));
  const dels = Object.keys(DEL);
  if (!Object.keys(up).length) return;
  await MPC.patch(ROOM, up);
  Object.assign(LV, sent); dels.forEach(k => delete DEL[k]);
}
async function saveHost(force) {
  if (!R || saving || (!force && !hostDirty())) return; saving = true;
  try { await MPC.put(ROOM + '/host', R); lastHost = JSON.stringify(R).length; } catch (e) {} finally { saving = false; }
}
let hostSig = '';
function hostDirty() { const s = String(R.round) + R.phase + Object.keys(R.players || {}).length + DONE.size + (R.feed[0] ? R.feed[0].at : 0); if (s === hostSig) return false; hostSig = s; return true; }
function tick() {
  const el = $('h-clock'), now = MPE.now();
  if (R && R.phase === 'act') {
    const left = R.paused ? R.pauseLeft : Math.max(0, R.tEnd - now), s = Math.ceil(left / 1000);
    el.textContent = R.paused ? '⏸ ' + fmt(s) : fmt(s); el.classList.toggle('low', !R.paused && s <= 30);
    if (!R.paused && s === 0 && !tick.warned) { tick.warned = true; toast('⏰ 時間到！可以按「結束本回合並結算」'); renderCtrl(); }
  } else if (R && R.phase === 'event' && R.event && !R.event.reveal) { const s = Math.max(0, Math.ceil((R.event.endAt - now) / 1000)); el.textContent = fmt(s); }
  else el.textContent = '';
}
const fmt = s => `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;

/* ---------- 畫面 ---------- */
function render() {
  if (!R) return;
  $('h-room').textContent = `房間 ${ROOM}`; $('h-round').textContent = R.round ? `第 ${R.round}／8 回合` : `${Object.keys(R.lobby).length} 人在大廳`;
  $('h-phase').textContent = PH[R.phase] || R.phase;
  if (R.phase === 'lobby') return renderLobby();
  if (R.phase === 'end') return renderEnd();
  renderGame(); renderCtrl();
}
function renderLobby() {
  const L = Object.values(R.lobby).sort((a, b) => String(a.cls).localeCompare(b.cls) || a.seat - b.seat), N = L.length, lay = N >= 3 ? MPE.layout(R.level, N) : null;
  if (!$('qr') || renderLobby.room !== ROOM) {
    $('main').innerHTML = `<div class="lobby"><div class="card" style="text-align:center"><div id="qr" style="margin:0 auto"></div><div class="serif" style="font-size:2.4em;color:var(--candle);margin-top:8px">房間 ${ROOM}</div><div class="soft small" style="word-break:break-all">${esc(studentUrl())}</div></div><div class="card" id="lb"></div></div>`;
    try { new QRCode($('qr'), { text: studentUrl(), width: 600, height: 600 }); } catch (e) {}
    renderLobby.room = ROOM;
  }
  $('lb').innerHTML = `<h2 class="serif" style="color:var(--candle)">👥 大廳：${N} 人</h2>
    <p class="soft">${R.level === 'g11' ? '高二高三版' : '高一版'}・難度${{ easy: '簡單', normal: '標準', hard: '困難' }[R.diff]}${lay ? `・預計：${lay.facs.map(f => `${F[f].name} ${lay.size[f]}`).join('、')}${lay.nb ? `、鍵結社 ${lay.nb}` : ''}${R.level === 'g11' && !lay.g11 ? '（人數不到 22，改三大國）' : ''}` : ''}</p>
    <div class="names">${L.map(l => `<span>${esc(l.cls)}-${l.seat} ${esc(l.name)}</span>`).join('') || '<span class="soft">等學生掃 QR 進來……</span>'}</div>`;
  $('ctrl').classList.remove('hidden');
  $('ctrl').innerHTML = `<button class="btn big" id="go" ${N >= 3 ? '' : 'disabled'}>🎲 開始分配（${N} 人）</button><span class="soft">至少 3 人；開始後才進來的同學會加入人數最少的勢力。</span>`;
  $('go').onclick = () => { if (!confirm(`用目前 ${N} 人開始分配？`)) return; MPE.start(R); changed(); saveHost(true); };
}
function facCard(f) {
  const x = R.F[f], terr = MPMAP.territory(R.owner, f), pr = MPE.progress(R, f);
  return `<div class="fac" style="border-color:${F[f].color}"><div class="fh"><span>${fx(f)} <span class="soft small">${x.mem.length}人</span></span><span class="pct" style="color:${F[f].light}">${Math.round(x.rel)}%</span></div>
    <div class="bar" style="margin:4px 0"><i style="width:${Math.min(100, x.rel / 1.6)}%;background:${F[f].color}"></i></div>
    <div class="meta"><span>🗺️${terr}</span><span>🎯${x.teamOk}/${x.teamN}${R.phase === 'act' && x.team.done ? '✅' : ''}</span>${x.walls ? `<span>🧱${x.walls}</span>` : ''}${peek ? `<span>💰${x.tre}</span>` : ''}</div>
    ${peek ? `<div class="parts">${pr.parts.map(q => `<div><span>${esc(q.l)} ${q.have}/${q.need}</span><div class="bar"><i style="width:${Math.min(100, q.have / q.need * 100)}%;background:${q.have >= q.need ? '#4cd383' : F[f].color}"></i></div></div>`).join('')}</div>` : ''}</div>`;
}
let mapSig = '';
function renderGame() {
  if (!$('map') || renderGame.room !== ROOM) {
    $('main').innerHTML = `<div class="fstrip" id="facs"></div><div class="game"><div><div class="mapbox"><svg id="map"></svg></div><div class="card" style="margin-top:12px"><div class="row" style="justify-content:space-between"><b>📜 戰報</b><button class="btn ghost sm" id="peek">👁 勝利進度（只給老師看）</button></div><div class="feed" id="feed"></div></div></div><div class="stage" id="stage"></div></div>`;
    renderGame.room = ROOM; mapSig = '';
    $('peek').onclick = () => { peek = !peek; $('peek').textContent = peek ? '🙈 收起勝利進度' : '👁 勝利進度（只給老師看）'; render(); };
  }
  const rel = Object.fromEntries(R.facs.map(f => [f, R.F[f].rel])), sig = JSON.stringify([R.owner, rel, flash]);
  if (sig !== mapSig) { mapSig = sig; MPMAP.draw($('map'), { seed: R.seed, facs: R.facs, owner: R.owner, rel }, flash); } flash = [];
  $('facs').innerHTML = R.facs.map(facCard).join('') + (R.bs.length ? `<div class="fac" style="border-color:#c9a24a"><div class="fh"><span>🕯️ 鍵結社 <span class="soft small">${R.bs.length}人</span></span></div><div class="meta" style="margin-top:6px"><span>均勢 ${R.T.BS.lo}～${R.T.BS.hi}%・差 ≤${R.T.BS.spread}%</span>${R.board ? `<span>委託 ${R.board.filter(b => b.done).length}/${R.board.length}</span>` : ''}</div></div>` : '');
  $('feed').innerHTML = R.feed.slice(0, 30).map(e => `<div>${esc(e.t)}</div>`).join('');
  const st = $('stage');
  if (R.phase === 'intro') st.innerHTML = `<div class="card"><h3 class="serif" style="color:var(--candle)">📜 分配完成</h3><p class="soft" style="margin:6px 0">請同學看自己的手機：勢力、角色、任務都在上面。<b>雙面人的身分只有自己和母國的大煉金師知道，請保密！</b></p>
    <table class="t">${R.facs.map(f => `<tr><td>${fx(f)}</td><td>${R.F[f].mem.map(s => { const p = R.players[s]; return `${esc(p.name)}<span class="soft small">（${RL[p.role].icon}${p.leader && p.role !== 'leader' ? '👑' : ''}）</span>`; }).join('、')}</td></tr>`).join('')}${R.bs.length ? `<tr><td>🕯️ 鍵結社</td><td>${R.bs.map(s => esc(R.players[s].name)).join('、')}</td></tr>` : ''}</table>
    <p class="soft small" style="margin-top:6px">勝利條件（${R.N} 人、難度${{ easy: '簡單', normal: '標準', hard: '困難' }[R.diff]}）已依人數查表設定；每個勢力的手機上都看得到自己的條件。</p></div>`;
  else if (R.phase === 'settle' || R.phase === 'market') st.innerHTML = renderNews() + (R.phase === 'market' ? renderMarket() : '');
  else if (R.phase === 'event') st.innerHTML = renderEvent();
  else st.innerHTML = R.phase === 'act' ? `<div class="card"><b>🎯 本回合各勢力的團隊任務</b><table class="t" style="margin-top:6px">${R.facs.map(f => { const t = R.F[f].team; return `<tr><td>${fx(f)}</td><td>${esc(t.text)}</td><td>${t.type === 'quick' ? '' : `${Math.min(t.prog, t.thr)}/${t.thr}`} ${t.done ? '✅' : ''}</td></tr>`; }).join('')}</table></div>` : '';
  if (R.phase === 'market') st.querySelectorAll('[data-mk]').forEach(b => b.onclick = () => { const [el, d] = b.dataset.mk.split('|'); MPE.nudge(R, el, +d); changed(); });
}
function renderNews() {
  const n = R.news; if (!n) return '';
  return `<div class="card"><h3 class="serif" style="color:var(--candle)">📰 第 ${n.round} 回合結算</h3><div class="news-g" style="margin-top:8px">${R.facs.map(f => {
    const d = n.delta[f], s = n.sab[f] || { hit: [], blocked: 0 };
    return `<div class="fac" style="border-color:${F[f].color}"><b>${fx(f)}</b> <span class="eff ${d >= 0 ? 'up' : 'dn'}">${d >= 0 ? '+' : ''}${d}%</span>
      <div class="small" style="margin-top:4px">${n.team[f] ? '🎯 團隊任務完成 ✅' : '🎯 團隊任務沒完成'}</div>
      ${s.hit.length ? `<div class="small" style="color:#ffb3a3">⚠️ 有內鬼！${s.hit.map(esc).join('；')}</div>` : ''}${s.blocked ? `<div class="small" style="color:#9ff0bb">⚙️ 機巧師擋下 ${s.blocked} 次破壞</div>` : ''}</div>`; }).join('')}</div>
    ${n.moves && n.moves.length ? `<p class="small" style="margin-top:8px">🏴 領土變化：${n.moves.map(m => `${F[m.to].name}從${F[m.from].name}奪得 ${m.n} 格`).join('；')}</p>` : ''}
    ${R.winner ? `<div class="end-h" style="font-size:1.6em">${R.winner === 'none' ? '8 回合結束，沒有勢力達成勝利條件' : R.winner === 'bs' ? '🕯️ 天下均勢！鍵結社勝利' : `🏆 ${F[R.winner].name}達成勝利條件！`}</div>` : ''}</div>`;
}
function renderMarket() {
  const els = MPE.ALL.filter(e => e !== 'He' || true);
  return `<div class="card" style="margin-top:10px"><h3 class="serif" style="color:var(--candle)">📈 採礦國市場（系統已依買賣量調整，可再微調）</h3><div class="mk" style="margin-top:8px">${els.map(e => `<div><b>${e}</b><span>💰${R.market[e].p}</span><span><button data-mk="${e}|-2">▼</button> <button data-mk="${e}|2">▲</button></span></div>`).join('')}</div></div>`;
}
function renderEvent() {
  const E = R.event; if (!E) return '';
  const n = Object.keys(E.ans).length, tot = Object.keys(R.players).length, cnt = o => Object.values(E.ans).filter(a => a === o).length;
  return `<div class="card"><h3 class="serif" style="color:var(--candle)">🎲 隨機事件：全班一起答</h3><div class="evq" style="margin-top:8px">${E.q}</div>
    <div class="evo">${E.opts.map((o, i) => `<div class="${E.reveal && o === E.right ? 'right' : ''}">${'ABCD'[i]}. ${o}${E.reveal ? `<span style="float:right;opacity:.8">${cnt(o)} 人</span>` : ''}</div>`).join('')}</div>
    <p style="margin-top:10px">已作答 <b>${n}</b>／${tot} 人${E.reveal ? '' : '（勢力答對率 ≥ 70%，下回合國力推進 +2）'}</p>
    ${E.reveal && E.res ? `<div class="row" style="margin-top:6px">${R.facs.map(f => `<span class="chip" style="border:2px solid ${F[f].color}">${F[f].name} ${E.res[f]}%${E.res[f] >= 70 ? ' 🎉+2' : ''}</span>`).join('')}</div>` : ''}</div>`;
}
function renderCtrl() {
  const c = $('ctrl'); c.classList.remove('hidden'); let h = '';
  if (R.phase === 'intro') h = `<button class="btn big" id="b-round">▶ 開始第 1 回合（4 分鐘）</button>`;
  if (R.phase === 'act') h = `<button class="btn" id="b-pause">${R.paused ? '▶ 繼續' : '⏸ 暫停講解'}</button><button class="btn ghost" id="b-add">＋1 分鐘</button><button class="btn red big" id="b-settle">⏹ 結束本回合並結算</button>`;
  if (R.phase === 'settle') h = R.winner ? `<button class="btn big" id="b-end">🏁 揭曉結果</button>` : `<button class="btn big" id="b-market">📈 市場調整</button>`;
  if (R.phase === 'market') h = `<button class="btn big" id="b-event">🎲 隨機事件（全班一起答）</button><button class="btn ghost" id="b-skip">略過事件，直接下一回合</button>`;
  if (R.phase === 'event') h = R.event.reveal ? `<button class="btn big" id="b-round">▶ 開始第 ${R.round + 1} 回合</button>` : `<button class="btn big" id="b-reveal">💡 公布答案</button>`;
  h += `<span style="flex:1"></span><button class="btn ghost sm" id="b-menu">☰</button>`;
  c.innerHTML = h;
  const on = (id, fn) => { const b = $(id); if (b) b.onclick = fn; };
  on('b-round', () => { MPE.beginRound(R); tick.warned = false; changed(); saveHost(true); });
  on('b-pause', () => { if (R.paused) { R.tEnd = MPE.now() + R.pauseLeft; R.paused = false; } else { R.pauseLeft = Math.max(0, R.tEnd - MPE.now()); R.paused = true; } changed(); });
  on('b-add', () => { if (R.paused) R.pauseLeft += 60000; else R.tEnd = Math.max(R.tEnd, MPE.now()) + 60000; tick.warned = false; changed(); });
  on('b-settle', () => { if (!confirm('結束本回合並結算？')) return; R.phase = 'act'; const n = MPE.settle(R); flash = n.cells || []; changed(); saveHost(true); });
  on('b-market', () => { R.phase = 'market'; changed(); });
  on('b-event', () => { const q = QUIZ.make(Math.random, R.level); MPE.setEvent(R, q); changed(); saveHost(true); });
  on('b-skip', () => { MPE.beginRound(R); tick.warned = false; changed(); saveHost(true); });
  on('b-reveal', () => { MPE.revealEvent(R); changed(); });
  on('b-end', () => { MPE.finish(R); changed(); saveHost(true); });
  on('b-menu', () => {
    const m = modal(`<h2>☰ 選單</h2><p>房間 <b>${ROOM}</b>・學生連結：<br><small style="word-break:break-all">${esc(studentUrl())}</small></p>
      <div class="row" style="margin-top:10px"><button class="btn" id="m-qr">🔳 再顯示 QR（晚到的同學）</button><button class="btn red" id="m-stop">🏁 提前結束並揭曉</button><button class="btn ghost" id="m-x" style="color:var(--ink);border-color:#ccc">關閉</button></div>`);
    m.querySelector('#m-x').onclick = closeModal;
    m.querySelector('#m-qr').onclick = () => { const mm = modal(`<div id="qr2" style="width:min(70vh,90%);margin:0 auto"></div><p style="text-align:center;font-size:1.6em;font-weight:900">房間 ${ROOM}</p><div style="text-align:center"><button class="btn" id="q-x">關閉</button></div>`); try { new QRCode(mm.querySelector('#qr2'), { text: studentUrl(), width: 600, height: 600 }); mm.querySelectorAll('#qr2 img,#qr2 canvas').forEach(x => { x.style.width = '100%'; x.style.height = 'auto'; }); } catch (e) {} mm.querySelector('#q-x').onclick = closeModal; };
    m.querySelector('#m-stop').onclick = () => { if (!confirm('提前結束這一局並揭曉結果？')) return; R.winner = R.winner || 'none'; MPE.finish(R); closeModal(); changed(); saveHost(true); };
  });
}
function renderEnd() {
  const fin = R.final; $('ctrl').classList.add('hidden');
  const SC = MPE.SECRET;
  $('main').innerHTML = `<div class="end-h">${fin.winner === 'none' ? '⚖️ 沒有勢力達成勝利條件' : fin.winner === 'bs' ? '🕯️ 天下均勢・鍵結社勝利' : `🏆 ${F[fin.winner].name}勝利！`}</div>
    <div class="game"><div>
      <div class="card"><h3 class="serif" style="color:var(--candle)">🏰 勢力排名</h3><table class="t">${fin.rank.map((f, i) => `<tr><td>${i + 1}</td><td>${fx(f)}${fin.winner === f ? ' 🏆' : ''}</td><td>國力 ${Math.round(R.F[f].rel)}%</td><td><b>${fin.fscore[f]}</b> 分</td></tr>`).join('')}${fin.bsScore != null ? `<tr><td>—</td><td>🕯️ 鍵結社${fin.winner === 'bs' ? ' 🏆' : ''}</td><td></td><td><b>${fin.bsScore}</b> 分</td></tr>` : ''}</table>
        <p class="soft small" style="margin-top:6px">勢力分＝（相對國力−100）×${R.T.PW}＋成員平均（個人任務、團隊任務、答對題數、秘密任務）＋勝利分 ${R.T.V}</p></div>
      <div class="card" style="margin-top:12px"><h3 class="serif" style="color:var(--candle)">🎭 雙面人揭曉</h3>${fin.spies.length ? `<table class="t">${fin.spies.map(s => `<tr><td><b>${esc(s.name)}</b></td><td>潛伏在 ${fx(s.host)}</td><td>其實是 ${fx(s.origin)} 的人</td><td>${SC[s.sec].name}：${esc(s.secText)}</td><td>${s.ok ? '✅ 成功' : '❌ 失敗'}</td></tr>`).join('')}</table>` : '<p class="soft">這一局沒有雙面人（每國人數太少）。</p>'}</div>
    </div><div>
      <div class="card"><h3 class="serif" style="color:var(--candle)">⭐ 個人 MVP</h3><table class="t">${fin.mvp.map((p, i) => `<tr><td>${i + 1}</td><td>${esc(p.name)}</td><td>${p.fac === 'bs' ? '🕯️ 鍵結社' : fx(p.origin)}${p.spy ? ' 🎭' : ''}</td><td>${RL[p.role].icon} ${RL[p.role].name}</td><td><b>${p.pts}</b></td></tr>`).join('')}</table></div>
      <div class="mapbox" style="margin-top:12px"><svg id="map"></svg></div>
    </div></div>
    <div style="text-align:center;margin:16px"><button class="btn ghost" id="again">🕯️ 開新的一局</button></div>`;
  MPMAP.draw($('map'), { seed: R.seed, facs: R.facs, owner: R.owner, rel: Object.fromEntries(R.facs.map(f => [f, R.F[f].rel])) });
  $('again').onclick = () => { localStorage.removeItem(HKEY); location.href = location.pathname; };
  renderGame.room = null;
}
$('modal').onclick = e => { if (e.target.id === 'modal') closeModal(); };
const QS = new URLSearchParams(location.search);
if (QS.get('fb')) { MPC.setBase(QS.get('fb') + '/bond-mp'); BSC.CONFIG.FIREBASE_URL = QS.get('fb'); }   // 只給測試用：連到本機模擬的 Firebase
const qRoom = QS.get('room');
if (qRoom) resume(qRoom.toUpperCase()); else setup();
</script>
</body>
</html>
