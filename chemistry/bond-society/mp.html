<!DOCTYPE html>
<html lang="zh-Hant">

<title>隱秘的鍵結社：全班連線</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&family=Noto+Serif+TC:wght@700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="mp.css?v=20261016a">
<style>
  /* 學生連線頁（手機優先）：登入 → 大廳 → 角色卡 → 工作、勢力、交易所、秘密、我的任務 → 揭曉 */
  .top { position: sticky; top: 0; z-index: 30; background: #0d0b12f2; border-bottom: 1px solid var(--night-3); padding: 8px 12px; }
  .top .row { gap: 6px; }
  .wrap { max-width: 760px; margin: 0 auto; padding: 12px 12px 90px; }
  .login { max-width: 420px; margin: 40px auto; display: grid; gap: 10px; }
  .login label { display: grid; gap: 4px; font-weight: 700; } .login input { width: 100%; }
  .rolecard { border-radius: 16px; padding: 14px; color: var(--ink); background: var(--paper); border-left: 10px solid; }
  .rolecard h2 { font-family: 'Noto Serif TC', serif; font-size: 1.35em; }
  .tabs { position: fixed; bottom: 0; left: 0; right: 0; display: flex; background: #0d0b12f5; border-top: 1px solid var(--night-3); z-index: 30; }
  .tabs button { flex: 1; border: 0; background: transparent; color: var(--soft); padding: 8px 2px 10px; font-weight: 700; font-size: .82em; }
  .tabs button.on { color: var(--candle); } .tabs button b { display: block; font-size: 1.4em; }
  .choice { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
  .choice button { border: 2px solid #4a4266; background: var(--night-3); color: #fff; border-radius: 10px; padding: 7px 11px; font-weight: 700; }
  .choice button.on { border-color: var(--candle); background: #4a3a12; color: var(--candle); }
  .q { font-size: 1.12em; font-weight: 700; margin: 6px 0; line-height: 1.6; }
  .inv { display: flex; flex-wrap: wrap; gap: 5px; } .inv span { background: var(--night-3); border-radius: 8px; padding: 2px 8px; font-weight: 700; }
  .parts > div { display: grid; grid-template-columns: 1fr 110px; gap: 8px; align-items: center; font-size: .9em; margin: 3px 0; }
  .log div { font-size: .86em; color: var(--soft); padding: 3px 0; border-bottom: 1px dashed #ffffff14; }
  .secret { background: #2a1430; border: 2px dashed #a35bd1; border-radius: 14px; padding: 12px; }
  .secret.blur > *:not(.keep) { filter: blur(8px); pointer-events: none; user-select: none; }
  .ov { position: fixed; inset: 0; background: #000c; display: flex; align-items: center; justify-content: center; padding: 14px; z-index: 70; }
  .ovc { background: #fff8e6; color: var(--ink); border: 4px solid var(--candle); border-radius: 16px; width: min(560px, 100%); padding: 16px; max-height: 92vh; overflow: auto; }
  .mats { width: 100%; border-collapse: collapse; font-size: .82em; } .mats th, .mats td { border-bottom: 1px dashed #ccc; padding: 4px 6px; text-align: left; white-space: nowrap; }
  .mats-w { overflow: auto; max-height: 50vh; }
  .top .hrow { display: flex; gap: 5px; align-items: center; flex-wrap: nowrap; overflow: hidden; } .top .chip { padding: 3px 9px; font-size: .86em; }
  .toast { bottom: auto; top: 54px; box-shadow: 0 6px 18px #0008; }
  .sec { margin-top: 12px; } .sec-h { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; padding-bottom: 6px; border-bottom: 1px solid #ffffff14; }
  .sec.ability { border-left: 5px solid var(--gold); } .sec.wait { border: 2px dashed #6b5fa0; text-align: center; } .sec.permit { border-left: 5px solid var(--candle); }
  .step-l { font-weight: 900; color: var(--candle); margin: 10px 0 4px; } .step-l:first-child { margin-top: 0; }
  .sub-h { font-weight: 900; margin: 14px 0 6px; padding-top: 10px; border-top: 1px dashed #a35bd1; }
  .choice button { min-height: 42px; display: inline-flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.25; }
  .choice button small { font-weight: 400; font-size: .75em; opacity: .85; } .choice button.dim { opacity: .45; }
  .choice.col { display: grid; grid-template-columns: 1fr; } .choice.col button { align-items: flex-start; }
  .abl + .abl { margin-top: 10px; padding-top: 10px; border-top: 1px dashed #ffffff1f; }
  .qcard { margin-top: 12px; } .qhead { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding-bottom: 6px; border-bottom: 1px solid #d8c69c; margin-bottom: 6px; }
  .opts button { display: flex; gap: 10px; align-items: center; min-height: 48px; }
  .opts .ol { flex: none; width: 26px; height: 26px; border-radius: 50%; background: #efe3c4; display: inline-flex; align-items: center; justify-content: center; font-size: .85em; font-weight: 900; }
  .opts button.on .ol { background: var(--red); color: #fff; }
  .qact { display: grid; gap: 6px; margin-top: 14px; } .qact .btn { width: 100%; }
  .linkbtn { background: none; border: 0; color: #8a7a5a; text-decoration: underline; font-size: .9em; padding: 8px; }
  .cons { background: #fff; border-radius: 10px; padding: 6px 10px; margin: 6px 0; font-size: .92em; } .cons ul { margin: 2px 0 0 20px; }
  .frow { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; } .frow select { flex: 1; min-width: 120px; }
  select.in, input.in { font-size: 16px; min-height: 44px; }
  .kv { display: grid; grid-template-columns: auto 1fr auto 1fr; gap: 4px 10px; font-size: .92em; } .kv span { color: var(--soft); }
  details.card > summary { cursor: pointer; list-style: none; } details.card > summary::-webkit-details-marker { display: none; } details.card > summary::after { content: ' ▾'; color: var(--soft); } details[open].card > summary::after { content: ' ▴'; }
  .bitem { display: flex; justify-content: space-between; align-items: center; gap: 8px; background: var(--night-3); border-radius: 10px; padding: 8px 10px; margin: 6px 0; }
  .covg { display: grid; grid-template-columns: 1fr auto auto; gap: 6px 8px; align-items: center; }
  .abrow { display: grid; grid-template-columns: 96px 1fr; gap: 10px; align-items: center; margin: 8px 0; } .abrow .btn { line-height: 1.3; }
  body.busy .act { opacity: .45; pointer-events: none; }
  .board div.c { display: flex; justify-content: space-between; align-items: center; gap: 8px; background: var(--night-3); border-radius: 10px; padding: 8px 10px; margin: 6px 0; }
</style>

<body>
<div class="top hidden" id="top"><div class="hrow"><span class="chip" id="t-round"></span><span class="chip gold" id="t-clock"></span><span style="flex:1"></span><span class="chip" id="t-money"></span><span class="chip" id="t-permit"></span><span class="chip warn" id="t-quick"></span><span id="t-room" class="hidden"></span></div></div>
<div class="wrap" id="app"></div>
<div class="tabs hidden" id="tabs"></div>
<div class="ov hidden" id="ov"><div class="ovc" id="ovc"></div></div>
<div class="modal hidden" id="modal"><div class="mcard" id="mcard"></div></div>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const F = WORLD.FACTIONS, RL = MPE.ROLE, C = CHEM;
const toast = t => { const el = $('toast'); el.innerHTML = t; el.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove('on'), 3200); };
const modal = h => { $('mcard').innerHTML = h; $('modal').classList.remove('hidden'); return $('mcard'); };
const closeModal = () => $('modal').classList.add('hidden');
const fx = f => f === 'bs' ? '🕯️ 鍵結社' : `<b style="color:${F[f].light}">${F[f].icon} ${F[f].name}</b>`;
const ROOM = (new URLSearchParams(location.search).get('room') || '').toUpperCase();
const QS = new URLSearchParams(location.search);
if (QS.get('fb')) { MPC.setBase(QS.get('fb') + '/bond-mp'); BSC.CONFIG.FIREBASE_URL = QS.get('fb'); }   // 只給測試用
let PROF = null, SID = null, P = null, PUB = null, PRIV = null, FAC = null, facL = null, facOf = null, tab = 'work', Q = null, CH = {}, hideSecret = true, ansLog = [], saved = false, nextQuick = 0, QK = null, evPicked = null, evKey = '';
const SKEY = 'bond-mp-student';

/* ---------- 登入 ---------- */
async function loginScreen() {
  const last = BSC.lastProfile() || {};
  $('app').innerHTML = `<div class="login card"><h2 class="serif" style="color:var(--candle);text-align:center">🕯️ 隱秘的鍵結社・全班連線</h2>
    ${ROOM ? `<p style="text-align:center">房間 <b style="font-size:1.4em;color:var(--candle)">${esc(ROOM)}</b></p>` : `<label>房間代碼<input class="in" id="i-room" maxlength="4" style="text-transform:uppercase"></label>`}
    <label>班級<input class="in" id="i-cls" maxlength="10" value="${esc(last.cls || '')}"></label>
    <label>座號<input class="in" id="i-seat" type="number" min="1" max="60" value="${esc(last.seat || '')}"></label>
    <label>姓名<input class="in" id="i-name" maxlength="12" value="${esc(last.name || '')}"></label>
    <label>學號<input class="in" id="i-no" maxlength="12" value="${esc(last.stuNo || '')}"></label>
    <button class="btn big" id="go">進入大廳</button><p class="soft small">用和單機版一樣的班級座號，成績會記在同一個帳號。斷線時用同樣的資料再進來，就會回到原本的身分。</p></div>`;
  $('go').onclick = async () => {
    const room = ROOM || ($('i-room').value || '').trim().toUpperCase();
    const cls = BSC.toHalf($('i-cls').value), seat = +$('i-seat').value, name = $('i-name').value.trim(), stuNo = BSC.toHalf($('i-no').value);
    if (!room || !cls || !seat || !name) return toast('請填好房間、班級、座號、姓名');
    $('go').disabled = true; $('go').textContent = '連線中……';
    const cfg = await BSC.loadConfig(), term = cfg.current, sid = BSC.makeSid(term, cls, seat);
    PROF = { cls, seat, name, stuNo, purpose: '正式進度', term, sid };
    try { const r = await BSC.login(PROF); P = r.player; } catch (e) {}
    SID = sid;
    if (!ROOM) { location.search = '?room=' + room + (QS.get('fb') ? '&fb=' + encodeURIComponent(QS.get('fb')) : ''); return; }
    try { await MPC.retry(() => MPC.put(`${ROOM}/lobby/${SID}`, { sid: SID, name, cls, seat, at: Date.now() })); } catch (e) { $('go').disabled = false; $('go').textContent = '進入大廳'; return toast('連不上雲端，請再試一次'); }
    try { localStorage.setItem(SKEY, JSON.stringify({ room: ROOM, sid: SID })); } catch (e) {}
    connect();
  };
}
// 連線（2026-10-15 崩潰測試後）：每人只開 1 條串流 v/<sid>；切回分頁、網路恢復時重連；時間用伺服器時間
let OFF = 0, VL = null, lastData = 0;
const now = () => Date.now() + OFF;
async function connect() {
  $('top').classList.remove('hidden'); render();
  try { OFF = await MPC.serverOffset(ROOM); } catch (e) {}
  VL = MPC.listen(`${ROOM}/v/${SID}`, onView);
  setInterval(clock, 1000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden && VL) VL.refresh(); });
  window.addEventListener('online', () => { if (VL) VL.refresh(); toast('🔌 網路恢復，重新連線'); });
  $('app').addEventListener('focusout', () => { if (pendingRender) setTimeout(scheduleRender, 50); });
}
function onView(d) {
  d = d || {}; lastData = Date.now();
  const p = d.p || null;
  if (p && p.ack) Object.entries(p.ack).forEach(([id, r]) => { if (PEND[id]) { delete PEND[id]; if (r && (r.t || !r.ok)) toast((r.ok ? '' : '⚠️ ') + esc(r.t || '沒有成功')); } });
  PUB = d.g || null; FAC = d.f || null; PRIV = p;
  if (!Object.values(PEND).some(x => x.busy)) setBusy(false);
  scheduleRender();
}
const PEND = {};
const BUSY_T = ['buy', 'sell', 'donate', 'attack', 'issue', 'intel', 'spy', 'send', 'bscovert'];
function setBusy(on) { document.body.classList.toggle('busy', !!on); }
async function send(a) {
  const id = Math.random().toString(36).slice(2, 10), busy = BUSY_T.includes(a.type);
  PEND[id] = { busy, at: Date.now() }; if (busy) setBusy(true);
  try { await MPC.retry(() => MPC.post(ROOM + '/act', { ...a, sid: SID, id, t: now() })); }
  catch (e) { delete PEND[id]; setBusy(false); toast('📶 送不出去：請確認網路後再試一次'); return; }
  setTimeout(() => { if (PEND[id]) { delete PEND[id]; if (busy) { setBusy(false); toast('⏳ 老師端還在處理，結果稍後會更新'); } } }, 8000);
}

/* ---------- 時鐘、干擾快問 ---------- */
const fmt = s => `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
function actLeft() { if (!PUB || PUB.phase !== 'act') return 0; return PUB.paused ? PUB.pauseLeft : Math.max(0, PUB.tEnd - now()); }
const canAct = () => PUB && PUB.phase === 'act' && !PUB.paused && actLeft() > 0 && PRIV;
function clock() {
  if (!PUB) return;
  const s = Math.ceil(actLeft() / 1000);
  $('t-clock').textContent = PUB.phase === 'act' ? (PUB.paused ? '⏸ 暫停' : `⏱️ ${fmt(s)}`) : ({ lobby: '大廳', intro: '準備', settle: '結算', market: '市場', event: '事件', end: '揭曉' }[PUB.phase] || '');
  // 干擾快問：行動時間內，每 90 秒一題
  if (canAct() && PRIV.fac !== 'bs') {
    if (!nextQuick) nextQuick = Date.now() + 90000;
    const q = Math.max(0, Math.ceil((nextQuick - Date.now()) / 1000));
    $('t-quick').textContent = `⚡ ${q}`;
    if (q === 0 && !QK && !Q) openQuick();
  } else $('t-quick').textContent = '';
  if (QK) { const l = Math.max(0, Math.ceil((QK.end - Date.now()) / 1000)); const el = $('qk-t'); if (el) el.textContent = l; if (l === 0) closeQuick(null); }
  if (PUB.phase === 'event' && PUB.event && !PUB.event.reveal) { const el = $('ev-t'); if (el) el.textContent = Math.max(0, Math.ceil((PUB.event.endAt - now()) / 1000)); }
}
function openQuick() {
  const q = QUIZ.make(Math.random, PUB.level); QK = { q, end: Date.now() + 20000, pick: null };
  const draw = () => { $('ovc').innerHTML = `<div class="row" style="justify-content:space-between"><b>⚡ 干擾快問</b><span class="chip warn">⏱️ <span id="qk-t">20</span></span></div><div class="q">${q.q}</div><div class="opts">${q.opts.map((o, i) => `<button data-i="${i}" class="${QK.pick === i ? 'on' : ''}">${o}</button>`).join('')}</div><button class="btn" id="qk-ok" ${QK.pick == null ? 'disabled' : ''}>送出</button>`;
    $('ovc').querySelectorAll('[data-i]').forEach(b => b.onclick = () => { QK.pick = +b.dataset.i; draw(); }); $('qk-ok').onclick = () => closeQuick(QK.pick); };
  draw(); $('ov').classList.remove('hidden');
}
function closeQuick(i) {
  if (!QK) return; const q = QK.q, ok = i != null && q.opts[i] === q.ans; QK = null; nextQuick = Date.now() + 90000;
  $('ov').classList.add('hidden');
  record({ src: 'quick', tag: q.tag, id: q.id, q: q.q, pick: i != null ? q.opts[i] : '（沒作答）', ans: q.ans, ok });
  send({ type: 'quick', ok, timeout: i == null });
}
function record(r) { ansLog.push({ ...r, rd: PUB ? PUB.round : 0 }); }

/* ---------- 出題 ---------- */
const rnd = Math.random, pick = a => a[Math.floor(rnd() * a.length)], shuf = a => a.map(v => [rnd(), v]).sort((x, y) => x[0] - y[0]).map(p => p[1]);
function balanceQ() {
  const e = pick(FACTS.EQUATIONS), all = [...e.l, ...e.r], right = e.ans.join('、'), wr = new Set();
  for (let g = 0; wr.size < 3 && g < 40; g++) { const a = e.ans.slice(); const k = Math.floor(rnd() * a.length); a[k] = Math.max(1, a[k] + (rnd() < 0.5 ? 1 : -1) * (1 + Math.floor(rnd() * 2))); if (a.join('、') !== right) wr.add(a.join('、')); }
  return { tag: 'balance', id: 'bal:' + all.join('+'), q: `配平：${e.l.map(C.html).join(' ＋ ')} → ${e.r.map(C.html).join(' ＋ ')}<br><small>（係數依序，最簡整數比）</small>`, opts: shuf([right, ...wr]), ans: right };
}
function structQ() {
  const m = pick(BANK.STRUCT), bp = m.bonds.reduce((a, b) => a + b[2], 0), lp = m.lp.reduce((a, b) => a + b, 0), ask = rnd() < 0.5 ? 'bp' : 'lp', right = ask === 'bp' ? bp : lp;
  const wr = [right + 1, right + 2, Math.max(0, right - 1), right + 3].filter(v => v !== right).slice(0, 3);
  return { tag: 'struct', id: `st:${m.f}:${ask}`, q: `${m.f}（${m.zh}）的路易斯結構中，一共有幾對${ask === 'bp' ? '「共用電子對（鍵結電子對）」' : '「孤對電子」'}？`, opts: shuf([right, ...wr].map(String)), ans: String(right) };
}
function genQ(tags) {
  for (let g = 0; g < 10; g++) {
    const t = pick(tags);
    try {
      const q = t === 'balance' ? balanceQ() : t === 'struct' ? structQ() : QUIZ.GEN[t] ? QUIZ.GEN[t](rnd) : null;
      if (q && q.opts && q.opts.length === 4) { q.id = q.id || 'g:' + t + ':' + String(q.q).replace(/<[^>]+>/g, '').slice(0, 60); q.tag = q.tag || t; return q; }
    } catch (e) {}
  }
  return QUIZ.make(rnd, PUB.level);
}
// 機巧師：材料圖鑑版工程題（兩步都對才算對）
function engQ() {
  const all = [...MATS.PICK.map(x => ['pick', x]), ...MATS.FAIL.map(x => ['fail', x])], [mode, x] = pick(all);
  const r = { rq: x.r[0], ropts: shuf([x.r[1], ...x.r[2]]), rok: x.r[1] };
  if (mode === 'pick') return { eng: true, mode, key: x.id, need: x.need, cons: x.cons, cands: shuf(x.cands.slice()), right: MATS.answerOf(x), step: 0, ...r, tag: 'eng' };
  return { eng: true, mode, key: x.id, story: x.story, q: x.q, opts: shuf([x.ok, ...x.no]), right: x.ok, step: 0, ...r, tag: 'eng' };
}

/* ---------- 畫面 ---------- */
let pendingRender = false, rq = false, lastHTML = '';
function scheduleRender() { if (rq) return; rq = true; requestAnimationFrame(() => { rq = false; render(); }); }
function render() {
  // 正在輸入或選選單時先不要重畫（手機的選單會被關掉）
  const ae = document.activeElement;
  if (ae && $('app').contains(ae) && (ae.tagName === 'INPUT' || ae.tagName === 'SELECT' || ae.tagName === 'TEXTAREA') && PUB && PRIV) { pendingRender = true; headerOnly(); return; }
  pendingRender = false;
  if (!PUB) { $('app').innerHTML = '<p class="soft" style="text-align:center;margin-top:40px">連線中……</p>'; return; }
  headerOnly();
  if (PUB.phase === 'lobby' || !PRIV) { lastHTML = ''; $('tabs').classList.add('hidden'); $('app').innerHTML = `<div class="card" style="text-align:center;margin-top:30px"><div style="font-size:3em">🕯️</div><h2 class="serif" style="color:var(--candle)">已進入大廳</h2><p>${esc(PROF ? PROF.name : '')}，請等老師開始分配。</p><p class="soft">大廳目前 ${PUB.lobbyN || 0} 人</p>${PUB.phase !== 'lobby' ? '<p class="soft small">遊戲已經開始，老師那邊會把你加入人數最少的勢力，請稍等……</p>' : ''}</div>`; return; }
  // 資料還沒同步完整（串流一個欄位一個欄位到）就先等一下
  if (!PRIV.fac || !PRIV.role || !RL[PRIV.role] || !Array.isArray(PUB.facs) || !PUB.facs.length || (PRIV.fac !== 'bs' && !F[PRIV.fac])) { $('app').innerHTML = '<p class="soft" style="text-align:center;margin-top:40px">⏳ 同步中……</p>'; lastHTML = ''; return; }
  if (PUB.phase === 'end') { lastHTML = ''; return renderEnd(); }
  if (PUB.phase === 'event') { lastHTML = ''; return renderEvent(); }
  renderTabs();
  const v = tab === 'fac' ? facView() : tab === 'trade' ? tradeView() : tab === 'secret' ? secretView() : tab === 'me' ? meView() : workView();
  const html = (PUB.phase === 'intro' ? introBanner() : '') + (PUB.phase === 'settle' || PUB.phase === 'market' ? newsView() : '') + v;
  if (html === lastHTML) return;   // 沒變就不重畫（不會閃、不會跳回頂端）
  lastHTML = html; $('app').innerHTML = html;
  bind();
}
function headerOnly() {

  h += sec('📤 賣給其他勢力', inv.length ? `<div class="frow"><select id="sell-el" class="in">${inv.map(e => `<option value="${e}" ${CH.sell === e ? 'selected' : ''}>${e}（有 ${x.inv[e]}）</option>`).join('')}</select><span class="soft">→</span><select id="sell-to" class="in">${others.map(f => `<option value="${f}" ${CH.sellTo === f ? 'selected' : ''}>${F[f].name}</option>`).join('')}</select></div><button class="btn act" id="sell" style="width:100%;margin-top:8px" ${can ? '' : 'disabled'}>賣出 1 份</button><p class="soft small" style="margin-top:6px">賣價＝市價＋友好度加成；元素會送到對方倉庫，友好度 +1。</p>` : '<span class="soft">勢力倉庫是空的</span>');
  h += sec('🏛️ 捐進國庫', `<div class="frow"><input class="in" id="don-n" type="number" min="1" inputmode="numeric" value="${CH.don || Math.min(10, me.wallet)}" style="width:110px"><button class="btn act" id="don" ${canAct() && me.wallet > 0 ? '' : 'disabled'}>捐出</button><button class="btn ghost act" id="don-all" ${canAct() && me.wallet > 0 ? '' : 'disabled'}>全部捐</button></div>`, '', `錢包 💰${me.wallet}・出兵、金國勝利都靠國庫`);

/* 秘密 */
function secretView() {
  const me = PRIV; let h = '';
  const shBtn = `<button class="btn sm keep" id="sh">${hideSecret ? '👁 顯示' : '🙈 隱藏'}</button>`;
  if (me.mySpies && me.mySpies.length) h += `<div class="card secret ${hideSecret ? 'blur' : ''}"><div class="row keep" style="justify-content:space-between"><b>🎭 秘密資訊</b>${shBtn}</div><div style="margin-top:6px"><b>👑 我方派出去的雙面人</b><div class="inv" style="margin-top:4px">${me.mySpies.map(s => `<span>${esc(s.name)}・潛伏在${F[s.host].name}</span>`).join('')}</div></div><p class="small soft" style="margin-top:6px">他們會暗中幫我們，也可能傳情報給你。請保密，別讓別人看到你的螢幕！</p></div>`;
  if (!me.spy) return h || sec('🎭 秘密資訊', `<p class="soft">你沒有秘密任務，是${F[me.fac].name}忠心的成員。<br>不過要小心：勢力裡可能藏著其他國家派來的雙面人！倉庫突然少了東西、國庫被挪用……都可能是他們做的。</p>`);
  const S = me.spy, A = MPE.ABIL, strongOK = me.correct >= MPE.K.SP_UNLOCK && (PUB.round - S.lastStrong >= 3), left = Math.max(0, (me.permits || 0) - (me.trades || 0));
  CH.rumor = CH.rumor || S.target;
  h += `<div class="card secret ${hideSecret ? 'blur' : ''}"><div class="row keep" style="justify-content:space-between"><b>🎭 秘密資訊</b>${shBtn}</div>
    <p style="margin-top:6px"><b>你是雙面人！</b>表面上是${F[me.fac].name}的${RL[me.role].name}，其實是 ${fx(S.origin)} 派來的。母國的大煉金師：${(S.leader || []).map(esc).join('、') || '—'}。</p><p class="small soft">分數算回母國；遊戲中不會被抓，結束時才揭曉。</p>
    <div class="fb hint"><b>秘密任務 ${S.secName}</b><br>${esc(S.secText)}</div>
    <div class="sub-h">🃏 秘密能力 <span class="soft small">花自己的錢・每回合最多 1 個${me.abilUsed ? '・本回合已用' : ''}</span></div>
    ${Object.entries(A).map(([k, a]) => { const dis = !canAct() || me.abilUsed || me.wallet < a.cost || (a.strong && !strongOK); return `<div class="abrow"><button class="btn sm act ${a.strong ? 'red' : ''}" data-ab="${k}" ${dis ? 'disabled' : ''}>${a.name}<br><small>💰${a.cost}</small></button><span class="small">${esc(a.text)}${a.strong ? `<br><span class="soft">每 3 回合 1 次・累積答對 ${MPE.K.SP_UNLOCK} 題解鎖（你答對 ${me.correct} 題）</span>` : ''}</span></div>`; }).join('')}
    <div class="small" style="margin-top:6px">造謠對象：</div><div class="choice">${PUB.facs.filter(f => f !== me.fac).map(f => `<button class="${CH.rumor === f ? 'on' : ''}" data-rt="${f}">${F[f].name}</button>`).join('')}</div>
    <p class="small soft">如果對方的機巧師有盾牌，破壞會被擋下（錢照扣）。</p>
    <div class="sub-h">📦 私藏與搬運 <span class="soft small">用交易許可・還有 ${left} 張</span></div>
    <div class="inv" style="margin:6px 0">${Object.keys(S.stash || {}).length ? Object.entries(S.stash).map(([e, n]) => `<span>${e}×${n}</span>`).join('') : '<span class="soft">私藏是空的</span>'}</div>
    <div class="frow">${elSelect('st-el', CH.stBuy || 'H', PUB.market)}<button class="btn sm act" id="st-buy" ${canAct() && left ? '' : 'disabled'}>偷偷買進私藏</button></div>
    ${Object.keys(S.stash || {}).length ? `<div class="frow" style="margin-top:6px"><select id="send-el" class="in">${Object.keys(S.stash).map(e => `<option>${e}</option>`).join('')}</select><button class="btn sm act" id="send" ${canAct() && left ? '' : 'disabled'}>送回${F[S.origin].name}</button></div>` : ''}
    <p class="small soft">已送回 ${S.sent || 0} 份。</p><label class="small" style="display:flex;gap:6px;align-items:center"><input type="checkbox" id="hide" ${CH.hide ? 'checked' : ''}> 挖礦時，挖到的元素自動藏進私藏</label></div>`;
  return h;
}
/* 我的任務 */
function personalText(role) {
  const need = MPE.K.PERSONAL_N;
  const t2 = { leader: '勢力國力排名在前半', flex: '勢力國力排名在前半', knight: '成功出兵至少 1 次', sage: '多發委託至少 1 件', miner: '挖到至少 5 種不同元素', forger: '鑄造至少 4 個化合物', assayer: '情報偵察至少 2 次', builder: '做出至少 3 個分子＋建 1 道城牆', envoy: '2 個勢力和我方友好度 ≥ 60', mechanic: '成功擋下破壞至少 1 次', mystic: '聯邦之間友好度 ≥ 60', bs: '鍵結社達成天下均勢' }[role];
  return [PRIV.fac === 'bs' ? `完成委託 8 件（目前 ${PRIV.cnt.bsDone}）` : `答對 ${need} 題（目前 ${PRIV.correct} 題）`, t2];
}
function meView() {
  const [a, b] = personalText(PRIV.role), c = PRIV.cnt || {};
  return roleCard() + sec('📋 個人任務', `<ol style="margin:4px 0 0 20px;line-height:1.9"><li>${esc(a)}</li><li>${esc(b)}</li></ol><p class="soft small" style="margin:6px 0 0">老師提早結束遊戲時，題數目標會照玩過的回合比例降低。</p>`, '', `結束時結算：完成 +${MPE.K.PT_OK}、沒完成 −${MPE.K.PT_NO}`)
    + sec('📊 我的數據', `<div class="kv"><span>答對</span><b>${PRIV.correct} 題</b><span>挖到元素</span><b>${Object.keys(c.mined || {}).length} 種</b><span>化合物</span><b>${c.comp || 0}</b><span>分子</span><b>${c.mol || 0}</b><span>城牆</span><b>${c.walls || 0}</b><span>出兵</span><b>${c.attacks || 0}</b><span>發委託</span><b>${c.issued || 0}</b><span>情報</span><b>${c.intel || 0}</b><span>擋下破壞</span><b>${c.repairs || 0}</b><span>干擾快問</span><b>${c.quickOk || 0}／${c.quick || 0}</b></div>`)
    + `<p class="soft small" style="text-align:center;margin-top:10px">房間 ${esc(ROOM)}・${esc(PRIV.name)}</p>`;
}
/* 隨機事件 */
function renderEvent() {
  $('tabs').classList.add('hidden');
  const E = PUB.event; if (!E) return;
  const key = E.id + E.q; if (evKey !== key) { evKey = key; evPicked = null; }
  $('app').innerHTML = `<div class="card paper"><b>🎲 隨機事件：全班一起答</b>${E.reveal ? '' : `<span class="chip warn" style="float:right">⏱️ <span id="ev-t"></span></span>`}<div class="q" style="margin-top:8px">${E.q}</div>
    <div class="opts">${E.opts.map((o, i) => `<button data-ev="${i}" class="${E.reveal && o === E.right ? 'right' : evPicked === i ? 'on' : ''}" ${E.reveal || evPicked != null ? 'disabled' : ''}>${o}</button>`).join('')}</div>
    ${E.reveal ? `<div class="fb ${PUB.event.right === E.opts[evPicked] ? 'ok' : 'bad'}">${evPicked == null ? '你沒有作答' : E.opts[evPicked] === E.right ? '✅ 答對了！' : '❌ 答錯了'}</div>` : evPicked != null ? '<p style="color:#6b5a3a;font-weight:700;margin-top:8px">✅ 已作答，等老師公布答案……</p>' : '<p style="color:#6b5a3a;margin-top:8px" class="small">你的勢力答對率 ≥ 70%，下回合國力推進 +2！</p>'}</div>`;
  $('app').querySelectorAll('[data-ev]').forEach(b => b.onclick = () => { evPicked = +b.dataset.ev; send({ type: 'evans', pick: E.opts[evPicked] }); record({ src: 'event', tag: E.tag, id: E.id, q: E.q, pick: E.opts[evPicked], ans: '', ok: null }); render(); });
  clock();
}
/* 揭曉 */
function renderEnd() {
  $('tabs').classList.add('hidden');
  const fin = PUB.final; if (!fin) { $('app').innerHTML = '<p class="soft">結算中……</p>'; return; }
  const me = PRIV, mine = me.fac === 'bs' ? 'bs' : (me.spy ? me.spy.origin : me.fac), won = fin.winner === mine;
  const ps = me.personal || {};
  $('app').innerHTML = `<div class="card" style="text-align:center"><div style="font-size:2.6em">${won ? '🏆' : fin.winner === 'none' ? '⚖️' : '🕯️'}</div><h2 class="serif" style="color:var(--candle)">${fin.winner === 'none' ? '沒有勢力達成勝利條件' : fin.winner === 'bs' ? '天下均勢・鍵結社勝利' : `${F[fin.winner].name}勝利！`}</h2>${won ? '<p>🎉 你的陣營贏了！</p>' : ''}</div>
    <div class="card" style="margin-top:10px"><b>⭐ 你的成績：${me.pts ?? '—'} 分</b><ul style="margin:6px 0 0 20px"><li>${ps.ok1 ? '✅' : '❌'} ${esc(ps.t1 || '')}</li><li>${ps.ok2 ? '✅' : '❌'} ${esc(ps.t2 || '')}</li></ul>${me.spy ? `<div class="fb ${me.secOk ? 'ok' : 'bad'}">🎭 秘密任務 ${esc(me.spy.secName)}：${me.secOk ? '成功 +40' : '失敗'}</div>` : ''}</div>
    <div class="card" style="margin-top:10px"><b>🏰 勢力排名</b>${(fin.rank || []).map((f, i) => `<div>${i + 1}. ${fx(f)} ${fin.fscore[f]} 分${fin.winner === f ? ' 🏆' : ''}</div>`).join('')}</div>
    <div class="card" style="margin-top:10px"><b>🎭 雙面人揭曉</b>${(fin.spies || []).length ? fin.spies.map(s => `<div class="small">${esc(s.name)}：潛伏在${F[s.host].name}，其實是${F[s.origin].name}的人（${MPE.SECRET[s.sec].name} ${s.ok ? '✅' : '❌'}）</div>`).join('') : '<p class="soft">這局沒有雙面人</p>'}</div>
    <div class="card" style="margin-top:10px"><b>📝 這局答題</b> ${ansLog.filter(a => a.ok === true).length}／${ansLog.filter(a => a.ok != null).length} 題答對 <span id="saved" class="soft small"></span></div>`;
  saveRecord();
}
// 把這局的作答併進單機版的累積紀錄（老師頁的熱點圖、常錯題目會一起統計）
async function saveRecord() {
  if (saved || !P) return; saved = true;
  try {
    const L = ansLog.filter(a => a.ok != null), fin = PUB.final, me = PRIV;
    L.forEach(a => { if (!a.tag) return; const x = (P.prac[a.tag] = P.prac[a.tag] || { n: 0, ok: 0 }); x.n++; if (a.ok) x.ok++; });
    L.forEach(a => { const k = BSC.qkey(a.id || a.q), x = P.qs[k] || (P.qs[k] = { id: a.id, q: String(a.q).replace(/<[^>]+>/g, '').slice(0, 80), a: String(a.ans).replace(/<[^>]+>/g, '').slice(0, 60), tag: a.tag, n: 0, w: 0, p: {} }); x.n++; if (!a.ok) { x.w++; const pk = String(a.pick || '（空白）').replace(/<[^>]+>/g, '').slice(0, 40).replace(/[.$#\[\]\/]/g, '_'); x.p[pk] = (x.p[pk] || 0) + 1; } });
    P.tot.tasks = (P.tot.tasks || 0) + L.length; P.tot.firstOk = (P.tot.firstOk || 0) + L.filter(a => a.ok).length;
    const mine = me.fac === 'bs' ? 'bs' : (me.spy ? me.spy.origin : me.fac);
    P.hist = [{ at: Date.now(), level: PUB.level, code: 'MP-' + ROOM, timed: true, score: me.pts || 0, end: fin.winner === mine ? 'mpwin' : 'mp', rounds: fin.rounds, rate: L.length ? Math.round(L.filter(a => a.ok).length / L.length * 100) : 0, prac: 0, mp: true }, ...(P.hist || [])].slice(0, 30);
    await BSC.savePlayer(P);
    BSC.log(SID, 'mp-end', { room: ROOM, level: PUB.level, fac: me.fac, role: me.role, spy: !!me.spy, score: me.pts || 0, winner: fin.winner, wrong: L.filter(a => !a.ok).slice(0, 40) });
    const el = $('saved'); if (el) el.textContent = '（已存進你的紀錄）';
  } catch (e) { saved = false; }
}

/* ---------- 按鈕 ---------- */
function bind() {
  const on = (sel, fn) => $('app').querySelectorAll(sel).forEach(b => b.onclick = () => fn(b));
  on('[data-as]', b => { CH.as = b.dataset.as; render(); });
  on('[data-vein]', b => { CH.vein = b.dataset.vein; render(); });
  on('[data-mol]', b => { CH.mol = b.dataset.mol; render(); });
  on('[data-to]', b => { CH.to = b.dataset.to; render(); });
  on('[data-pair]', b => { CH.pair = b.dataset.pair; render(); });
  on('[data-el]', b => { CH.el = b.dataset.el; render(); });
  const hide = $('hide'); if (hide) hide.onchange = () => { CH.hide = hide.checked; };
  const tq = $('takeQ'); if (tq) tq.onclick = () => {
    const as = PRIV.role === 'flex' ? (CH.as || 'miner') : PRIV.role;
    if (as === 'mechanic') Q = engQ(); else { Q = genQ(RL[as].tags.length ? RL[as].tags : ['concept']); Q.as = as; }
    Q.sel = null; render();
  };
  on('[data-p]', b => { Q.sel = b.dataset.p; render(); });
  const qok = $('qok'); if (qok) qok.onclick = submitQ;
  const qx = $('qx'); if (qx) qx.onclick = () => { Q = null; render(); };
  const mb = $('mbook'); if (mb) mb.onclick = () => matBook(Q && Q.mode === 'pick' ? Q.cands : null);
  on('[data-atk]', b => { if (confirm(`花國庫 💰${MPE.K.ATK_COST} 攻打${F[b.dataset.atk].name}？`)) send({ type: 'attack', to: b.dataset.atk }); });
  const is = $('issue'); if (is) is.onclick = () => send({ type: 'issue' });
  on('[data-intel]', b => send({ type: 'intel', to: b.dataset.intel }));
  on('[data-cid]', b => { const c = PUB.board.find(x => x.id === b.dataset.cid); Q = genQ([c.tag]); Q.bs = true; Q.cid = c.id; Q.sel = null; render(); });
  on('[data-cov]', b => { const [kind, f] = b.dataset.cov.split('|'); send({ type: 'bscovert', kind, f }); });
  const be = $('buy-el'); if (be) be.onchange = () => { CH.buy = be.value; };
  const se2 = $('st-el'); if (se2) se2.onchange = () => { CH.stBuy = se2.value; };
  const dn = $('don-n'); if (dn) dn.oninput = () => { CH.don = dn.value; };
  const sto = $('sell-to'); if (sto) sto.onchange = () => { CH.sellTo = sto.value; };
  const buy = $('buy'); if (buy) buy.onclick = () => send({ type: 'buy', el: CH.buy, n: 1 });
  const stb = $('st-buy'); if (stb) stb.onclick = () => { CH.stBuy = $('st-el').value; send({ type: 'buy', el: CH.stBuy, n: 1, dest: 'stash' }); };
  const se = $('sell-el'); if (se) se.onchange = () => { CH.sell = se.value.split('（')[0]; };
  const st = $('sell-to'); if (st) st.onchange = () => { CH.sellTo = st.value; };
  const sell = $('sell'); if (sell) sell.onclick = () => send({ type: 'sell', el: ($('sell-el').value || '').split('（')[0], to: $('sell-to').value });
  const don = $('don'); if (don) don.onclick = () => send({ type: 'donate', n: +$('don-n').value });
  const da = $('don-all'); if (da) da.onclick = () => send({ type: 'donate', n: PRIV.wallet });
  const sd = $('send'); if (sd) sd.onclick = () => send({ type: 'send', el: $('send-el').value });
  const sh = $('sh'); if (sh) sh.onclick = () => { hideSecret = !hideSecret; render(); };
  $('app').querySelectorAll('#sh').forEach(b => b.onclick = () => { hideSecret = !hideSecret; render(); });
  on('[data-rt]', b => { CH.rumor = b.dataset.rt; render(); });
  on('[data-ab]', b => { const k = b.dataset.ab; if (confirm(`發動 ${MPE.ABIL[k].name}（💰${MPE.ABIL[k].cost}）？`)) send({ type: 'spy', ab: k, to: CH.rumor }); });
  const map = $('map'); if (map) MPMAP.draw(map, { seed: PUB.seed, facs: PUB.facs, owner: PUB.owner, rel: PUB.rel });
}
// 簡易材料圖鑑（機巧師用）
function matBook(focus) {
  const L = focus ? focus.map(id => MATS.BY[id]) : MATS.LIST, yn = v => v === 'y' ? '✔' : v === 'n' ? '✘' : v === 'semi' ? '△' : v === 'weak' ? '△' : '—';
  const m = modal(`<div class="row" style="justify-content:space-between"><h2>📚 材料圖鑑</h2><button class="btn sm" id="mb-x">關閉</button></div>${focus ? '<p class="small">這題的候選材料（<a href="#" id="mb-all">看全部</a>）</p>' : ''}
    <div class="mats-w"><table class="mats"><tr><th>材料</th><th>熔點</th><th>沸點</th><th>固/熔/水 導電</th><th>在水中</th><th>硬度</th><th>延展</th><th>密度</th><th>導電度</th><th>價格</th><th>空氣中</th></tr>
    ${L.map(x => `<tr><td><b>${esc(x.n)}</b></td><td>${esc(MATS.mpTxt(x))}</td><td>${MATS.deg(x.bp)}</td><td>${yn(x.sc)} ${yn(x.lc)} ${yn(x.aq)}</td><td>${MATS.SOL[x.sol]}</td><td>${x.hard ?? '—'}</td><td>${MATS.MECH_S[x.mech]}</td><td>${x.dens}</td><td>${x.cond || '—'}</td><td>${MATS.PRICE[x.price]}</td><td>${MATS.AIR[x.air]}</td></tr><tr><td colspan="11" class="small" style="white-space:normal;color:#6b5a3a">🔬 ${esc(x.s)}</td></tr>`).join('')}</table></div>`);
  m.querySelector('#mb-x').onclick = closeModal; const a = m.querySelector('#mb-all'); if (a) a.onclick = e => { e.preventDefault(); matBook(null); };
}
$('modal').onclick = e => { if (e.target.id === 'modal') closeModal(); };

/* ---------- 開始 ---------- */
(async () => {
  try { const s = JSON.parse(localStorage.getItem(SKEY)); const last = BSC.lastProfile(); if (s && s.room === ROOM && last) { /* 同一個房間：顯示登入表單（已填好），按一下就回到原本身分 */ } } catch (e) {}
