<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>隱秘的鍵結社</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&family=Noto+Serif+TC:wght@700;900&display=swap" rel="stylesheet">
<style>
  /* 學生頁：不連回事務所首頁 */
  :root { --night: #15121d; --night-2: #201b2c; --night-3: #2c2540; --ink: #2a2238; --paper: #f3e9d2; --paper-2: #e3d4b0; --gold: #e2b44c; --gold-2: #a8801f;
    --soft: #b9b2d6; --red: #d2482e; --green: #2f9e5a; --candle: #ffcf6b; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Noto Sans TC', sans-serif; background: radial-gradient(ellipse at top, #2a2140 0%, var(--night) 60%) fixed; color: #f1ecff; min-height: 100vh; line-height: 1.6; }
  button { font: inherit; cursor: pointer; }
  button:disabled { opacity: .45; cursor: not-allowed; }
  .hidden { display: none !important; }
  .serif { font-family: 'Noto Serif TC', serif; }
  .btn { border: none; border-radius: 10px; padding: 10px 16px; font-weight: 700; background: var(--gold); color: var(--ink); box-shadow: 0 3px 0 var(--gold-2); }
  .btn:active:not(:disabled) { transform: translateY(2px); box-shadow: 0 1px 0 var(--gold-2); }
  .btn.ghost { background: transparent; color: var(--paper); border: 2px solid #4a4266; box-shadow: none; }
  .btn.dark { background: var(--ink); color: #fff; box-shadow: 0 3px 0 #000; }
  .btn.sm { padding: 5px 10px; font-size: .88em; }
  .btn.red { background: var(--red); color: #fff; box-shadow: 0 3px 0 #8a2a17; }

  /* ---- 開始畫面 ---- */
  #s-title { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px 16px; }
  .title-box { width: min(560px, 100%); text-align: center; }
  .candle { font-size: 3em; filter: drop-shadow(0 0 18px #ffb84d); animation: flicker 3s infinite; }
  @keyframes flicker { 0%, 100% { opacity: 1; } 45% { opacity: .85; } 50% { opacity: .95; } }
  .title-box h1 { font-family: 'Noto Serif TC', serif; font-size: 2.3em; letter-spacing: .12em; color: var(--candle); text-shadow: 0 0 22px #ffb84d55; }
  .lore { color: var(--soft); margin: 10px 0 18px; font-size: .96em; }
  .opt-card { background: var(--night-2); border: 2px solid var(--night-3); border-radius: 14px; padding: 16px; text-align: left; margin-bottom: 12px; }
  .opt-card h3 { font-size: .95em; color: var(--candle); margin-bottom: 8px; }
  .seg { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .seg label { display: block; cursor: pointer; }
  .seg input { display: none; }
  .seg span { display: block; border: 2px solid var(--night-3); border-radius: 10px; padding: 9px 10px; font-size: .9em; }
  .seg span b { display: block; font-size: 1.05em; }
  .seg input:checked + span { border-color: var(--gold); background: #3a2f17; }
  .code-in { width: 100%; background: var(--night); border: 2px solid var(--night-3); border-radius: 10px; color: #fff; padding: 9px 12px; font: inherit; letter-spacing: .2em; text-transform: uppercase; }
  .title-actions { display: flex; flex-direction: column; gap: 10px; margin-top: 6px; }

  /* ---- 遊戲畫面 ---- */
  .topbar { position: sticky; top: 0; z-index: 20; background: #120f19ee; border-bottom: 1px solid #2c2540; backdrop-filter: blur(6px); }
  .topbar .in { max-width: 1240px; margin: 0 auto; padding: 8px 14px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .topbar .brand { font-family: 'Noto Serif TC', serif; color: var(--candle); font-weight: 900; margin-right: 6px; }
  .chip { background: var(--night-2); border: 1px solid var(--night-3); border-radius: 999px; padding: 3px 11px; font-size: .9em; font-weight: 700; white-space: nowrap; }
  .chip.money { color: var(--candle); } .chip.stealth.low { color: #ff8a73; border-color: #6a2a20; }
  .topbar .sp { flex: 1; }
  .wrap { max-width: 1240px; margin: 0 auto; padding: 14px; display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 14px; align-items: start; }
  @media (max-width: 900px) { .wrap { grid-template-columns: 1fr; } }
  .card { background: var(--night-2); border: 1px solid var(--night-3); border-radius: 14px; padding: 14px; }
  .card h2 { font-family: 'Noto Serif TC', serif; font-size: 1.15em; color: var(--candle); margin-bottom: 8px; }
  .mapbox { background: #b9d3dc; border-radius: 12px; overflow: hidden; border: 3px solid #5a4a2e; box-shadow: inset 0 0 40px #5a4a2e55; }
  .mapbox svg { width: 100%; height: auto; display: block; }
  .hex { stroke: #fff8; stroke-width: .6; transition: fill .8s; }
  .hex.flash { animation: flash 1.2s 3; }
  @keyframes flash { 50% { fill: #fff; } }
  .cap-tag { font-family: 'Noto Sans TC', sans-serif; font-weight: 900; font-size: 12px; }

  .powers { margin-top: 12px; display: grid; gap: 7px; }
  .prow { display: grid; grid-template-columns: 92px 1fr 54px; gap: 8px; align-items: center; font-size: .9em; }
  .prow .nm { font-weight: 700; } .prow .nm small { display: block; font-weight: 400; color: var(--soft); font-size: .8em; }
  .bar { position: relative; height: 22px; background: #120f19; border-radius: 6px; overflow: hidden; }
  .bar .safe { position: absolute; top: 0; bottom: 0; background: #2f9e5a33; border-left: 1px dashed #2f9e5a; border-right: 1px dashed #2f9e5a; }
  .bar .fill { position: absolute; left: 0; top: 4px; bottom: 4px; border-radius: 0 4px 4px 0; transition: width .8s; }
  .bar .mk { position: absolute; top: 0; bottom: 0; width: 1px; background: #fff3; }
  .bar .abs { position: absolute; right: 6px; top: 1px; font-size: .78em; color: #ffffffcc; }
  .prow .pct { text-align: right; font-weight: 900; }
  .pct.warn { color: #ffcf6b; } .pct.bad { color: #ff7a63; }
  .legend { font-size: .78em; color: var(--soft); margin-top: 6px; }

  /* 右側行動面板 */
  .step-h { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
  .step-h .kicker { color: var(--soft); font-size: .85em; }
  .comm { background: var(--paper); color: var(--ink); border-radius: 12px; padding: 12px; margin-bottom: 10px; border-left: 6px solid #999; }
  .comm.done { opacity: .6; } .comm .hd { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin-bottom: 4px; }
  .badge { display: inline-block; border-radius: 6px; padding: 0 8px; font-size: .8em; font-weight: 700; color: #fff; }
  .kind { background: var(--ink); } .shady { background: #3a0f0f; }
  .effs { display: flex; gap: 5px; flex-wrap: wrap; margin: 6px 0; }
  .eff { border-radius: 6px; padding: 0 7px; font-size: .82em; font-weight: 700; }
  .eff.up { background: #dff3e6; color: #1e6e3e; } .eff.dn { background: #fde3df; color: #9a2f1c; }
  .comm .ft { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
  .needs { font-size: .82em; color: #6b5a3a; } .needs .miss { color: var(--red); font-weight: 700; }
  .note { background: #120f19; border-radius: 10px; padding: 10px 12px; font-size: .92em; color: var(--soft); margin: 8px 0; }
  .note b { color: #fff; }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
  .warnline { color: #ffcf6b; font-size: .9em; } .badline { color: #ff8a73; font-size: .9em; }

  /* 交易所 */
  .trade-sec { background: var(--night); border-radius: 12px; padding: 10px 12px; margin-bottom: 10px; }
  .trade-sec h3 { font-size: .95em; color: var(--candle); margin-bottom: 6px; }
  .trade-row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin: 4px 0; font-size: .9em; }
  .friends { display: flex; flex-wrap: wrap; gap: 6px; }
  .fr { border: 2px solid; border-radius: 8px; padding: 2px 8px; font-size: .82em; font-weight: 700; }
  .fr small { margin-left: 4px; color: var(--soft); font-weight: 400; }
  .mnews { font-size: .85em; background: #00000033; border-radius: 8px; padding: 6px 8px; margin: 6px 0; }
  .tmode { font-size: .88em; margin: 6px 0; color: var(--candle); }
  .tabs { display: flex; gap: 6px; margin-bottom: 6px; }
  .tab { flex: 1; border: 2px solid var(--candle); background: transparent; color: #fff; border-radius: 8px; padding: 6px; font-weight: 700; }
  .tab.on { background: var(--candle); color: #2a1d0e; }
  .tab:disabled { opacity: .35; }
  .el small .up { color: #c0392b; } .el small .dn { color: #1e8449; }
  .trade-row b .up { color: #ff8a7a; } .trade-row b .dn { color: #7fe0a0; }
  .fbtn:disabled { opacity: .35; }
  .fbtn { border: 2px solid; border-radius: 8px; padding: 3px 9px; background: transparent; color: #fff; font-weight: 700; font-size: .88em; }

  /* 週期表 */
  .ptable { display: grid; grid-template-columns: repeat(18, minmax(0, 1fr)); gap: 2px; margin: 8px 0; }
  .el { aspect-ratio: 1 / 1.1; border: 1px solid #0002; border-radius: 4px; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: clamp(8px, 1.6vw, 12px); line-height: 1.05; padding: 0; color: var(--ink); background: #fff; }
  .el small { font-size: .7em; opacity: .7; }
  .el.m { background: #f5e6b8; } .el.n { background: #cfe0f5; } .el.s { background: #d9f0d0; } .el.g { background: #e3d9f2; }
  .el.sel { outline: 3px solid var(--red); z-index: 1; }
  .el .cnt { font-size: .7em; color: var(--red); font-weight: 900; }
  .el.empty { visibility: hidden; }

  /* 任務視窗 */
  .modal { position: fixed; inset: 0; background: #000b; display: flex; align-items: center; justify-content: center; padding: 14px; z-index: 50; }
  .mcard { background: var(--paper); color: var(--ink); border-radius: 16px; width: min(720px, 100%); max-height: 92vh; overflow: auto; padding: 18px; }
  .mcard h2 { font-family: 'Noto Serif TC', serif; font-size: 1.25em; }
  .mcard .from { font-size: .85em; color: #6b5a3a; }
  .clues { list-style: none; margin: 10px 0; }
  .clues li { background: #fff; border-radius: 8px; padding: 6px 10px; margin-bottom: 5px; border-left: 4px solid var(--gold); }
  .bigf { font-size: 2em; font-weight: 900; text-align: center; margin: 10px 0; font-family: 'Noto Serif TC', serif; }
  .bigf sub { font-size: .55em; } .bigf sup { font-size: .5em; }
  .ionbox { display: flex; justify-content: center; gap: 18px; flex-wrap: wrap; margin: 10px 0; }
  .ionc { background: #fff; border-radius: 12px; padding: 10px 14px; text-align: center; min-width: 140px; }
  .ionc .ion { font-size: 1.6em; font-weight: 900; } .ionc .ion sub { font-size: .55em; } .ionc .ion sup { font-size: .55em; }
  .step { display: inline-flex; align-items: center; gap: 6px; margin-top: 6px; }
  .step button { width: 34px; height: 34px; border-radius: 50%; border: none; background: var(--ink); color: #fff; font-size: 1.2em; }
  .step b { min-width: 24px; display: inline-block; text-align: center; font-size: 1.3em; }
  .pick { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; margin: 4px 0 8px; }
  .pick button { border: 2px solid var(--paper-2); background: #fff; border-radius: 10px; padding: 6px 14px; font-weight: 900; font-size: 1.1em; color: var(--ink); }
  .pick button.on { border-color: var(--red); background: #fde3df; }
  .pick button sub { font-size: .6em; }
  .preview { text-align: center; font-size: 1.6em; font-weight: 900; min-height: 1.6em; } .preview sub { font-size: .55em; }
  .names { display: grid; gap: 8px; grid-template-columns: 1fr 1fr; margin: 10px 0; }
  .names button { border: 2px solid var(--paper-2); background: #fff; border-radius: 10px; padding: 10px; font-weight: 700; font-size: 1.05em; color: var(--ink); }
  .fb { border-radius: 10px; padding: 10px 12px; margin-top: 10px; line-height: 1.75; }
  .fb.ok { background: #dff3e6; } .fb.bad { background: #fde3df; } .fb.hint { background: #fff3cd; }
  .ev-choice { display: block; width: 100%; text-align: left; background: #fff; border: 2px solid var(--paper-2); border-radius: 10px; padding: 10px 12px; margin-bottom: 8px; color: var(--ink); font-weight: 700; }
  .ev-choice:hover:not(:disabled) { border-color: var(--gold); }
  .ev-card { background: var(--paper); color: var(--ink); border-radius: 12px; padding: 14px; }
  .score-t { width: 100%; border-collapse: collapse; margin: 8px 0; }
  .score-t td { padding: 5px 8px; border-bottom: 1px dashed var(--paper-2); } .score-t td:last-child { text-align: right; font-weight: 900; }
  .score-t tr.total td { font-size: 1.2em; border-bottom: none; color: #8a3a12; }
  .codex-f { border-left: 6px solid; border-radius: 10px; background: #fff; padding: 10px 12px; margin-bottom: 8px; }
  .pt-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  @media (max-width: 640px) {
    .pt-wrap .ptable { min-width: 600px; }
    .topbar .brand .txt, .btn .txt { display: none; }
    .topbar .in { padding: 6px 10px; gap: 5px; }
    .chip { padding: 2px 8px; font-size: .82em; }
    .pt-wrap::after { content: '← 左右滑動看完整週期表 →'; display: block; text-align: center; font-size: .75em; color: #8a7a62; }
  }
  /* 易讀性（2026-10-14 晚）：劇情、任務說明、作答區分開 */
  .mcard .note b, .ev-card .note b { color: var(--ink); }
  .mcard { line-height: 1.75; font-size: 1.02em; }
  .story { background: #fffaf0; border-left: 5px solid #c9b48a; border-radius: 8px; padding: 8px 12px; margin: 8px 0; font-style: italic; color: #4a3b22; }
  .ask { color: var(--ink); margin: 8px 0 4px; font-weight: 700; }
  .ask small { display: block; font-weight: 400; color: #8a7a62; font-size: .85em; }
  .tmr { float: right; font-weight: 900; color: #8a6a22; } .tmr.over { color: #999; font-weight: 400; }
  .ov { position: fixed; inset: 0; background: #000c; display: flex; align-items: center; justify-content: center; padding: 14px; z-index: 70; }
  .ovc { background: #fff8e6; color: var(--ink); border: 4px solid var(--candle); border-radius: 16px; width: min(560px, 100%); padding: 16px; box-shadow: 0 0 40px #ffcf6b88; }
  .ovc h3 { font-family: 'Noto Serif TC', serif; }
  .ovc .qq { font-size: 1.15em; margin: 8px 0; } .ovc .qq sub, .names sub { font-size: .65em; } .ovc .qq sup, .names sup { font-size: .6em; }
  .qbar { height: 8px; background: #eee; border-radius: 4px; overflow: hidden; } .qbar i { display: block; height: 100%; background: var(--red); transition: width 1s linear; }
  .chip.clock.low { color: #ff8a73; border-color: #6a2a20; animation: flicker 1s infinite; }
  .codex-g { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 6px; }
  .codex-g div { background: #fff; border-radius: 8px; padding: 6px 10px; border-left: 5px solid #ccc; font-size: .9em; }
  .codex-g div.ok { border-color: var(--green); } .codex-g div.try { border-color: var(--gold); }
  .rep td.lbl { width: 9em; white-space: nowrap; }
  .clues li .lbl, .rep td.lbl { min-width: 4.8em; font-size: .8em; font-weight: 700; color: #8a6a22; }
  .rep { width: 100%; border-collapse: collapse; background: #fff; border-radius: 8px; overflow: hidden; margin: 8px 0; }
  .rep caption { text-align: left; font-weight: 900; padding: 4px 0; }
  .rep td { border-bottom: 1px dashed var(--paper-2); padding: 6px 10px; vertical-align: top; }
  .tests { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 6px; margin: 8px 0; }
  .tests button { border: 2px solid var(--paper-2); background: #fff; border-radius: 10px; padding: 6px 8px; text-align: left; color: var(--ink); font-weight: 700; font-size: .9em; }
  .tests button small { color: #8a6a22; font-weight: 400; }
  .suspects { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 8px 0; }
  .suspects button { border: 2px solid var(--paper-2); background: #fff; border-radius: 10px; padding: 10px; color: var(--ink); font-weight: 700; }
  .suspects button.on { border-color: var(--red); background: #fde3df; }
  .suspects button small { display: block; font-weight: 400; font-size: .85em; }
  .sortbox { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
  .sortbox button { border: 2px solid var(--paper-2); background: #fff; border-radius: 10px; padding: 8px 12px; font-weight: 900; color: var(--ink); font-size: 1.05em; }
  .sortbox button.used { opacity: .3; }
  .seq { min-height: 46px; background: #fff; border: 2px dashed var(--gold); border-radius: 10px; padding: 6px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .seq span { background: var(--ink); color: #fff; border-radius: 8px; padding: 4px 10px; font-weight: 700; }
  .cls-row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; background: #fff; border-radius: 10px; padding: 6px 10px; margin-bottom: 6px; }
  .cls-row b { min-width: 7em; }
  .cls-row button { border: 2px solid var(--paper-2); background: #fff; border-radius: 8px; padding: 3px 9px; font-size: .88em; font-weight: 700; color: var(--ink); }
  .cls-row button.on { background: var(--ink); color: #fff; border-color: var(--ink); }
  .cls-row.bad { outline: 2px solid var(--red); }
  .eqn { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 8px; font-size: 1.25em; font-weight: 900; margin: 10px 0; }
  .eqn .term { display: flex; flex-direction: column; align-items: center; background: #fff; border-radius: 10px; padding: 6px 10px; }
  .eqn .term sub { font-size: .6em; }
  .scale { width: 100%; border-collapse: collapse; background: #fff; border-radius: 8px; margin: 6px 0; font-size: .95em; }
  .scale td, .scale th { padding: 4px 8px; text-align: center; border-bottom: 1px dashed var(--paper-2); }
  .scale .eq { color: var(--green); font-weight: 900; } .scale .ne { color: var(--red); font-weight: 900; }
  .toast { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); background: #000d; border: 2px solid var(--gold); border-radius: 10px; padding: 9px 16px; z-index: 80; opacity: 0; transition: .3s; pointer-events: none; }
  .toast.on { opacity: 1; }
</style>
</head>
<body>

<!-- 開始畫面 -->
<section id="s-title">
  <div class="title-box">
    <div class="candle">🕯️</div>
    <h1>隱秘的鍵結社</h1>
    <p class="lore">在一個平行時空的大陸上，共國、離國、金國互相角力。<br>你是不屬於任何國家的秘密組織特工，暗中接下各國的委託。<br><b style="color:#fff">讓各國互相制衡</b>：天下維持均勢，鍵結社才有存在的意義。</p>
    <div class="opt-card" id="cont-card"><h3>📜 上次的存檔</h3><div id="cont-info" class="note" style="margin:0 0 8px"></div><button class="btn" id="btn-cont" style="width:100%">繼續上次的戰局 ▶</button></div>
    <div class="opt-card">
      <h3>🎓 課程程度</h3>
      <div class="seg">
        <label><input type="radio" name="lv" value="g10" checked><span><b>高一版</b>共國、離國、金國三國（氫聯邦、凡聯邦以事件登場）</span></label>
        <label><input type="radio" name="lv" value="g11"><span><b>高二高三版</b>五大勢力全部登場，加入氫鍵與凡得瓦力</span></label>
      </div>
    </div>
    <div class="opt-card">
      <h3>⏱️ 計時模式</h3>
      <div class="seg">
        <label><input type="radio" name="tm" value="1" checked><span><b>開啟</b>每回合 4 分鐘、會跳出干擾快問、快速完成委託有獎金</span></label>
        <label><input type="radio" name="tm" value="0"><span><b>關閉</b>慢慢想，不計時（沒有干擾快問與快手獎金）</span></label>
      </div>
    </div>
    <div class="opt-card">
      <h3>🗺️ 地圖代碼（選填）</h3>
      <input class="code-in" id="in-code" maxlength="6" placeholder="留空＝隨機產生新大陸">
      <p class="hint" style="color:var(--soft);font-size:.82em;margin-top:6px">輸入老師給的代碼，全班可以玩同一張地圖、同樣的開局。</p>
    </div>
    <div class="title-actions">
      <button class="btn" id="btn-new">開始新的戰局 ▶</button>
      <button class="btn ghost" id="btn-codex">📖 勢力圖鑑與規則</button>
    </div>
  </div>
</section>

<!-- 遊戲畫面 -->
<section id="s-game" class="hidden">
  <div class="topbar"><div class="in">
    <span class="brand">🕯️<span class="txt"> 隱秘的鍵結社</span></span>
    <span class="chip" id="t-round"></span>
    <span class="chip money" id="t-money"></span>

<script>
const $ = id => document.getElementById(id);
const F = WORLD.FACTIONS, C = CHEM, RU = WORLD.RULE;
const SAVE = 'bond-society-save-v1';
const SEASON = ['春', '夏', '秋', '冬'];
const KIND = { mine: '⛏️ 尋礦', forge: '⚒️ 鑄造', detect: '🔍 鑑定', set: '📚 題組' };
let S = null, MAP = null;
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const md = s => String(s).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
let TRADE_TAB = 'buy';
let tt; function toast(m) { const t = $('toast'); t.textContent = m; t.classList.add('on'); clearTimeout(tt); tt = setTimeout(() => t.classList.remove('on'), 2400); }
function save() { try { localStorage.setItem(SAVE, JSON.stringify(S)); } catch (e) {} }
function load() { try { return JSON.parse(localStorage.getItem(SAVE)); } catch (e) { return null; } }
const fname = f => `${F[f].icon} ${F[f].name}`;
const effChips = eff => Object.entries(eff || {}).filter(([, v]) => v).map(([f, v]) => `<span class="eff ${v > 0 ? 'up' : 'dn'}">${F[f].name} ${v > 0 ? '+' : ''}${Math.round(v * 10) / 10}%</span>`).join('');
const roundName = r => `第 ${r}／8 回合・第${r <= 4 ? '一' : '二'}年${SEASON[(r - 1) % 4]}`;
const roundShort = r => (innerWidth <= 640 ? `${r}／8・${SEASON[(r - 1) % 4]}` : roundName(r));
/* ---------- ⏱️ 計時模式：回合倒數、干擾快問 ---------- */
let TICK = null, CUR = null, QOPEN = null;
const mmss = t => `${Math.floor(t / 60)}:${String(t % 60).padStart(2, '0')}`;
function drawClock() {
  const el = $('t-clock'); if (!el) return;
  const on = S && S.timed && !S.ended && ['board', 'trade'].includes(S.step);
  el.classList.toggle('hidden', !on); if (!on) return;
  el.textContent = S.timeCrisis ? '⏰ 時間到' : `⏱️ ${mmss(S.tLeft ?? GAME.ROUND_SEC)}`;
  el.classList.toggle('low', !S.timeCrisis && (S.tLeft ?? 999) <= 30);
}
function tick() {
  drawTaskTimer();
  if (!S || S.ended || !S.timed || document.hidden || !['board', 'trade'].includes(S.step)) return drawClock();
  if (QOPEN) quickTick();
  if (!S.timeCrisis) {
    S.tLeft = Math.max(0, (S.tLeft ?? GAME.ROUND_SEC) - 1);
    if (S.tLeft === 0) { const r = GAME.timeUp(S); refresh(); if (!QOPEN) showTimeUp(r); else S.pendingTU = true; return; }
    if (!QOPEN) { S.qNext = (S.qNext ?? GAME.QUICK_EVERY) - 1; if (S.qNext <= 0) { S.qNext = GAME.QUICK_EVERY; openQuick(); } }
  }
  drawClock(); if (S.tLeft % 5 === 0) save();
}
function overlay(html) { $('ovc').innerHTML = html; $('ov').classList.remove('hidden'); return $('ovc'); }
function closeOverlay() { $('ov').classList.add('hidden'); if (S && S.pendingTU) { S.pendingTU = false; showTimeUp({ applied: {} }); } }
function showTimeUp(r) {
  const tc = S.timeCrisis;
  const o = overlay(`<h3>⏰ 時間到！大陸危機爆發</h3><p style="margin:8px 0">鍵結社遲遲沒有行動，<b style="color:${F[tc.top].color}">${F[tc.top].name}</b>趁機擴張（+6%），<b style="color:${F[tc.low].color}">${F[tc.low].name}</b>陷入動亂（−6%），組織也被注意到了（隱密度 −5）。</p>
    <p>本回合不能再接新的委託。手上的任務做完後，回公告板按「結束本回合」。</p>
    <div class="actions" style="justify-content:flex-end"><button class="btn" id="ovok">知道了</button></div>`);
  o.querySelector('#ovok').onclick = () => { closeOverlay(); const f = WORLD.checkFail(S); if (f) { S.ended = f; save(); closeModal(); return showEnding(); } if (!$('modal').classList.contains('hidden') && !CUR) closeModal(); if (!CUR) renderStep(); };
}
function openQuick() {
  const q = GAME.quick(S); QOPEN = { q, left: GAME.QUICK_SEC };
  const o = overlay(`<h3>⚡ 干擾快問！<span style="float:right" id="qleft">${GAME.QUICK_SEC}</span></h3><div class="qbar"><i id="qbar" style="width:100%"></i></div>
    <div style="font-size:.8em;color:#8a6a22;margin-top:6px">知識點：${QUIZ.TAGS[q.tag]}・答對 💰+5，答錯或超時隱密度 −3</div>
    <div class="qq">${q.q}</div><div class="names">${q.opts.map((x, k) => `<button data-x="${k}">${x}</button>`).join('')}</div><div id="qres"></div>`);
  o.querySelectorAll('[data-x]').forEach(b => b.onclick = () => endQuick(q.opts[+b.dataset.x]));
}
function quickTick() {
  QOPEN.left--; const l = $('qleft'), bar = $('qbar');
  if (l) l.textContent = Math.max(0, QOPEN.left); if (bar) bar.style.width = `${Math.max(0, QOPEN.left) / GAME.QUICK_SEC * 100}%`;
  if (QOPEN.left <= 0) endQuick(null);
}
function endQuick(ans) {
  if (!QOPEN || QOPEN.done) return; const q = QOPEN.q, ok = ans === q.ans; QOPEN.done = true;
  GAME.answerQuick(S, q, ok); drawTop(); save();
  $('ovc').querySelectorAll('[data-x]').forEach(x => { x.disabled = true; if ($('ovc').querySelector(`[data-x="${x.dataset.x}"]`) && q.opts[+x.dataset.x] === q.ans) x.style.borderColor = 'var(--green)'; });
  $('qres').innerHTML = `<div class="fb ${ok ? 'ok' : 'bad'}">${ok ? '✅ 答對了！💰 +5' : `${ans === null ? '⌛ 時間到' : '❌ 答錯了'}，正確答案是 ${q.ans}。🕵️ 隱密度 −3`}</div><div class="actions" style="justify-content:flex-end"><button class="btn" id="qok">繼續 ▶</button></div>`;
  $('qok').onclick = () => { QOPEN = null; closeOverlay(); const f = WORLD.checkFail(S); if (f) { S.ended = f; save(); closeModal(); showEnding(); } };
}
function pracView() {
  const P = S.prac || {}, tags = QUIZ.LEVEL_TAGS[S.level];
  const done = tags.filter(t => (P[t] || {}).ok > 0).length;
  return `<p style="margin:6px 0">已練成 <b>${done}</b>／${tags.length} 種知識點（每練成一種，總分 +10）。綠色＝答對過、黃色＝練過但還沒答對、灰色＝還沒遇到。</p>
    <div class="codex-g">${tags.map(t => { const p = P[t]; return `<div class="${p && p.ok ? 'ok' : p ? 'try' : ''}">${QUIZ.TAGS[t]}<br><small>${p ? `答對 ${p.ok}／${p.n}` : '還沒練過'}</small></div>`; }).join('')}</div>`;
}
function modal(html) { $('mcard').innerHTML = html; $('modal').classList.remove('hidden'); $('mcard').scrollTop = 0; drawTaskTimer(); return $('mcard'); }
function closeModal() { $('modal').classList.add('hidden'); }

/* ---------- 開始畫面 ---------- */
function showTitle() {
  $('s-title').classList.remove('hidden'); $('s-game').classList.add('hidden');
  const sv = load();
  const can = sv && sv.v === 4 && !sv.ended;   // 舊版存檔（v1、v2）規則不同，不能接著玩
  $('cont-card').classList.toggle('hidden', !can);
  if (can) $('cont-info').innerHTML = `${sv.level === 'g11' ? '高二高三版' : '高一版'}・地圖 <b>${sv.code}</b>・${roundName(sv.round)}・💰 ${sv.money}`;
}
$('btn-cont').onclick = () => { S = load(); enterGame(); };
$('btn-new').onclick = () => {
  const code = $('in-code').value.trim();
  if (code && !/^[0-9a-z]{1,6}$/i.test(code)) return toast('地圖代碼只能是英文字母和數字（最多 6 個）');
  const level = document.querySelector('[name=lv]:checked').value;
  S = WORLD.newGame({ level, code: code || undefined });
  S.timed = document.querySelector('[name=tm]:checked').value === '1';
  enterGame(true);
};
function enterGame(fresh) {
  MAP = WORLD.makeMap(S.seed, S.facs);
  clearInterval(TICK); TICK = setInterval(tick, 1000); QOPEN = null; $('ov').classList.add('hidden');
  $('s-title').classList.add('hidden'); $('s-game').classList.remove('hidden');
  drawMap(); drawPowers(); drawTop();
  if (fresh) intro(); else renderStep();
}
function intro() {
  const m = modal(`<h2>🕯️ 歡迎加入鍵結社</h2>
    <p style="margin:8px 0">特工，這片大陸上有 ${S.facs.map(f => `<b style="color:${F[f].color}">${F[f].name}</b>`).join('、')}，中央山脈是中立的<b>採礦國</b>，開採原子序 1～36 的元素。</p>
    <p>你的任務：接下各國的化學委託，但要<b>讓各國互相制衡</b>。任何一國統一天下、或任何一國被消滅，鍵結社都會失去存在的意義。</p>
    <ul style="margin:8px 0 0 20px"><li>每回合最多接 <b>2 件</b>委託；幫誰，誰就變強。</li><li><b>領土跟著國力走</b>：國力變強的國家，會奪走鄰國的省分。</li><li>開局各國強弱不一，一定有強國和弱國。</li><li>交易所每回合可以做 <b>1 次暗中行動</b>（資助一國或對一國散播謠言），還能買賣元素賺錢。</li><li>撐過 <b>8 回合</b>（兩年），而且天下均勢，就是最好的結局。</li></ul>
    <p class="note" style="color:#6b5a3a;background:#fff">💡 各國國力的數字差很多（共國、離國幾百，凡聯邦只有個位數），因為它們代表的化學鍵強弱本來就差很多。判斷平衡要看<b>相對國力</b>（國力條）。</p>
    <div class="actions" style="justify-content:flex-end"><button class="btn" id="go">開始第一回合 ▶</button></div>`);
  m.querySelector('#go').onclick = () => { closeModal(); renderStep(); };
}

/* ---------- 地圖 ---------- */
function drawMap(flash = []) {
  const svg = $('map'), M = MAP, W = WORLD;
  svg.setAttribute('viewBox', `0 0 ${M.width.toFixed(0)} ${M.height.toFixed(0)}`);
  const colorOf = o => (o ? (o === 'mine' ? '#b9a98c' : F[o].light) : null);
  let h = `<defs><pattern id="wave" width="24" height="12" patternUnits="userSpaceOnUse"><path d="M0 6 q6 -4 12 0 t12 0" stroke="#9cc0cc" fill="none" stroke-width="1"/></pattern></defs>
    <rect width="100%" height="100%" fill="#bcd6df"/><rect width="100%" height="100%" fill="url(#wave)" opacity=".7"/>`;
  M.cells.forEach(c => { if (!c.land) return; const o = S.owner[c.i];
    h += `<polygon class="hex ${flash.includes(c.i) ? 'flash' : ''}" points="${W.hexPath(c.x, c.y)}" fill="${colorOf(o)}"/>`; });
  // 國界與海岸線
  M.cells.forEach(c => {
    if (!c.land) return; const o = S.owner[c.i];
    for (let k = 0; k < 6; k++) {
      const ang = 60 * k * Math.PI / 180;
      const nx = c.x + Math.cos(ang) * M.S * 1.73, ny = c.y + Math.sin(ang) * M.S * 1.73;
      const nb = c.nb.map(j => M.cells[j]).find(d => Math.hypot(d.x - nx, d.y - ny) < M.S * 0.5);
      const no = nb && nb.land ? S.owner[nb.i] : 'sea';
      if (no === o) continue;
      const a1 = (60 * k - 30) * Math.PI / 180, a2 = (60 * k + 30) * Math.PI / 180;
      const x1 = c.x + M.S * Math.cos(a1), y1 = c.y + M.S * Math.sin(a1), x2 = c.x + M.S * Math.cos(a2), y2 = c.y + M.S * Math.sin(a2);
      h += `<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="${no === 'sea' ? '#5a4a2e' : (o === 'mine' ? '#5a4a2e' : F[o].color)}" stroke-width="${no === 'sea' ? 2.2 : 1.8}" stroke-linecap="round"/>`;
    }
  });
  // 地形裝飾
  M.cells.forEach(c => {
    if (!c.land) return;
    if (c.terrain === 'mount') h += `<path d="M${c.x - 8} ${c.y + 6} L${c.x - 2} ${c.y - 6} L${c.x + 4} ${c.y + 6}Z M${c.x - 1} ${c.y + 6} L${c.x + 4} ${c.y - 2} L${c.x + 9} ${c.y + 6}Z" fill="#7a6a52" opacity=".8"/>`;
    else if (c.terrain === 'forest') h += `<circle cx="${c.x - 4}" cy="${c.y + 2}" r="3.2" fill="#4c7a4a" opacity=".55"/><circle cx="${c.x + 3}" cy="${c.y - 2}" r="3.6" fill="#4c7a4a" opacity=".55"/>`;
    else if (c.terrain === 'hill') h += `<path d="M${c.x - 7} ${c.y + 4} q7 -9 14 0" stroke="#7a6a52" fill="none" opacity=".55" stroke-width="1.5"/>`;
  });
  // 首都與名稱
  S.facs.forEach(f => {
    let cap = M.cells[M.capitals[f]];
    if (S.owner[cap.i] !== f) { const own = M.cells.filter(c => S.owner[c.i] === f); if (!own.length) return; cap = own[0]; }
    const w = F[f].name.length > 2 ? 82 : 72, r = Math.round(WORLD.rel(S, f)), hot = r > RU.SAFE[1] || r < RU.SAFE[0];
    h += `<g><rect x="${cap.x - w / 2}" y="${cap.y - 9}" width="${w}" height="17" rx="8" fill="${F[f].color}" stroke="${hot ? '#ffd84a' : '#fff'}" stroke-width="${hot ? 2.4 : 1.2}"/><text class="cap-tag" x="${cap.x}" y="${cap.y + 3.5}" text-anchor="middle" fill="#fff">🏰${F[f].name} ${r}%</text></g>`;
  });
  const mineCells = M.cells.filter(c => S.owner[c.i] === 'mine');
  if (mineCells.length) { const mx = mineCells.reduce((a, c) => a + c.x, 0) / mineCells.length, my = mineCells.reduce((a, c) => a + c.y, 0) / mineCells.length;
    h += `<rect x="${mx - 30}" y="${my + 8}" width="60" height="16" rx="8" fill="#5a4a2e" stroke="#fff" stroke-width="1"/><text class="cap-tag" x="${mx}" y="${my + 20}" text-anchor="middle" fill="#fff">⛏️採礦國</text>`; }
  svg.innerHTML = h;
  $('map-code').textContent = `地圖代碼 ${S.code}・${S.level === 'g11' ? '高二高三版' : '高一版'}`;
}
function drawPowers() {
  const MAX = 190;
  $('powers').innerHTML = S.facs.map(f => {
    const r = WORLD.rel(S, f), w = Math.min(100, r / MAX * 100);
    const cls = r >= RU.UNIFY_SOFT || r <= RU.DESTROY + 10 ? 'bad' : r > RU.SAFE[1] || r < RU.SAFE[0] ? 'warn' : '';
    return `<div class="prow"><div class="nm" style="color:${F[f].color}">${F[f].icon} ${F[f].name}<small>${F[f].bond}・領土 ${WORLD.territory(S, f)}・🤝 ${S.friend ? S.friend[f] : '-'}</small></div>
      <div class="bar"><div class="safe" style="left:${RU.SAFE[0] / MAX * 100}%;width:${(RU.SAFE[1] - RU.SAFE[0]) / MAX * 100}%"></div>
        <div class="mk" style="left:${100 / MAX * 100}%"></div><div class="mk" style="left:${RU.DESTROY / MAX * 100}%;background:#ff7a6377"></div><div class="mk" style="left:${RU.UNIFY / MAX * 100}%;background:#ff7a6377"></div>
        <div class="fill" style="width:${w}%;background:${F[f].color}"></div><span class="abs">國力 ${WORLD.fmtPower(S, f)}</span></div>
      <div class="pct ${cls}">${Math.round(r)}%</div></div>`;
  }).join('');
}
function drawTop() {
  $('t-round').textContent = roundShort(S.round);
  $('t-money').textContent = `💰 ${S.money}`;
  $('t-stealth').textContent = `🕵️ 隱密 ${Math.max(0, S.stealth)}`;
  $('t-stealth').classList.toggle('low', S.stealth <= 30);
  drawClock();
}
function refresh(flash) { drawMap(flash); drawPowers(); drawTop(); save(); }

/* ---------- 每一步 ---------- */
function renderStep() {
  drawTop();
  if (S.ended) return showEnding();
  ({ report: stepReport, board: stepBoard, trade: stepTrade, settle: stepSettle, event: stepEvent })[S.step]();
}
function warnings() {
  return S.facs.map(f => { const r = WORLD.rel(S, f);
    if (r >= RU.UNIFY_SOFT) return `<div class="badline">🚨 ${F[f].name}相對國力 ${Math.round(r)}%，再不壓制就要統一天下了！${(S.hi[f] || 0) >= 1 ? '（已連續 1 回合 ≥${RU.UNIFY_SOFT}%，下回合結束還是 ≥${RU.UNIFY_SOFT}% 就失敗）' : ''}</div>`;
    if (r > RU.SAFE[1]) return `<div class="warnline">⚠️ ${F[f].name}過強（${Math.round(r)}%）</div>`;
    if (r <= RU.DESTROY + 10) return `<div class="badline">🚨 ${F[f].name}快要滅亡了（${Math.round(r)}%）！</div>`;
    if (r < RU.SAFE[0]) return `<div class="warnline">⚠️ ${F[f].name}過弱（${Math.round(r)}%）</div>`;
    return ''; }).join('');
}
function stepReport() {
  const prev = S.history.length > 1 ? S.history[S.history.length - 2] : null;
  $('panel').innerHTML = `<div class="step-h"><h2>📜 情勢報告</h2><span class="kicker">${roundName(S.round)}</span></div>
    <p>${S.round === 1 ? (() => { const o = [...S.facs].sort((a, b) => WORLD.rel(S, b) - WORLD.rel(S, a)); return `各國實力不一：<b style="color:${F[o[0]].color}">${F[o[0]].name}</b>正在崛起（${Math.round(WORLD.rel(S, o[0]))}%），<b style="color:${F[o[o.length - 1]].color}">${F[o[o.length - 1]].name}</b>國勢衰弱（${Math.round(WORLD.rel(S, o[o.length - 1]))}%）。強國每回合結算都會蠶食相鄰的弱國，放著不管就會失衡。`; })() : '上一回合結束後，各國的消長如下：'}</p>
    ${prev ? `<div class="effs">${S.facs.map(f => { const d = S.history[S.history.length - 1][f] - prev[f]; return `<span class="eff ${d >= 0 ? 'up' : 'dn'}">${F[f].name} ${d >= 0 ? '+' : ''}${d}%</span>`; }).join('')}</div>` : ''}
    ${warnings() || '<div class="note">✅ 目前各國都在安全範圍內。</div>'}
    <div class="note">每回合最多接 <b>2 件</b>委託。想一想：該幫弱國一把，還是削弱強國？</div>
    <div class="actions"><button class="btn" id="go">查看本回合的委託 ▶</button></div>`;
  $('go').onclick = () => { GAME.startRound(S); TRADE_TAB = 'buy'; save(); renderStep(); };
}
function stepBoard() {
  const open = S.board.filter(c => c.state === 'open');
  $('panel').innerHTML = `<div class="step-h"><h2>📋 委託公告板</h2><span class="kicker">本回合還能接 <b style="color:var(--candle)">${S.ap}</b> 件</span></div>
    ${S.timeCrisis ? `<div class="badline" style="margin-bottom:8px">⏰ 時間到，大陸危機已經爆發，本回合不能再接新的委託。</div>` : ''}
    ${S.board.map(c => {
      const t = c.task, col = c.from === 'mine' ? F.mine.color : F[c.from].color;
      const miss = GAME.missing(S, t);
      const st = c.state === 'done' ? '✅ 已完成' : c.state === 'failed' ? '❌ 失敗' : c.state === 'skipped' ? '已略過' : '';

// 高二高三版：共國的變化連帶兩聯邦，委託卡上一起顯示
function effectsShown(eff) {
  const e = { ...eff };

/* ---------- 任務 ---------- */
function openTask(c) {
  const t = c.task, miss = GAME.missing(S, t);
  if (miss.length) {
    const cost = miss.reduce((a, sym) => a + GAME.rushPrice(S, sym), 0);
    const m = modal(`<h2>⚒️ 原料不足</h2><p style="margin:8px 0">這件委託要消耗 ${t.needs.map(x => `<b>${x}</b>`).join('、')} 各 1 單位，倉庫裡缺少 ${miss.map(x => `<b style="color:var(--red)">${x}（${C.EL[x].zh}）</b>`).join('、')}。</p>
      <p>可以向採礦國<b>緊急調貨</b>，共 <b>${cost}</b> 金幣（比交易所貴 3 成，但不算交易筆數）。小撇步：在交易所先囤一些常用元素，下回合鑄造就不用緊急調貨。</p>
      <div class="actions"><button class="btn" id="buy" ${S.money >= cost ? '' : 'disabled'}>💰 調貨並開始</button><button class="btn dark" id="no">先不要</button></div>`);
    m.querySelector('#no').onclick = closeModal;
    m.querySelector('#buy').onclick = () => { miss.forEach(sym => GAME.rush(S, sym)); refresh(); openTask(c); };
    return;
  }
  c.tries = c.tries || 0;
  if (!c.opened) { c.opened = Date.now(); save(); }
  CUR = c;
  const lim = GAME.FAST[TASKS.tierOf(S.round)];
  const head = `<div class="from">${fname(c.from)}的委託・💰 ${c.reward}${S.timed ? `<span class="tmr" id="tmr" data-lim="${lim}"></span>` : ''}</div>`;
  setTimeout(drawTaskTimer, 0);
  if (t.kind === 'set') return setUI(c, head);
  if (t.kind === 'mine') return mineUI(c, head);
  if (t.kind === 'detect') return detectUI(c, head);
  if (t.mode === 'f2name') return nameUI(c, head);
  return forgeUI(c, head);
}
function drawTaskTimer() {
  const el = $('tmr'); if (!el || !CUR || !CUR.opened) return;
  const lim = +el.dataset.lim, used = Math.floor((Date.now() - CUR.opened) / 1000), left = lim - used;
  el.textContent = left > 0 ? `⚡ 快手獎金倒數 ${left} 秒` : '⚡ 快手獎金已結束';
  el.classList.toggle('over', left <= 0);
}
function finishTask(c, ok, explain) {
  const first = ok && c.tries === 0;
  const fast = !!(S.timed && ok && c.opened && (Date.now() - c.opened) / 1000 <= GAME.FAST[TASKS.tierOf(S.round)]);
  CUR = null;
  const applied = GAME.resolve(S, c, { ok, first, fast, answers: c.task.answers });
  const fails = WORLD.checkFail(S);
  refresh();
  const m = modal(`<h2>${ok ? '✅ 委託完成' : '❌ 委託失敗'}</h2>
    <div class="fb ${ok ? 'ok' : 'bad'}">${explain}</div>
    ${ok ? `<p style="margin-top:8px">💰 得到 <b>${c.paid}</b> 金幣${first ? '' : c.task.kind === 'set' ? '（沒有全對，只拿 7 成）' : '（用了提示，只拿 7 成）'}${fast ? '（⚡ 快手獎金 ×1.2）' : ''}${c.task.kind === 'mine' ? `，⛏️ ${c.task.answer} ×${c.task.qty}` : ''}${c.task.spent ? `（檢驗花了 💰${c.task.spent}）` : ''}</p>` : '<p style="margin-top:8px">🕵️ 隱密度 −10</p>'}
    <div class="effs">${effChips(applied)}</div>
    <div class="actions" style="justify-content:flex-end"><button class="btn" id="ok">回到公告板</button></div>`);
  m.querySelector('#ok').onclick = () => { closeModal(); if (fails) { S.ended = fails; save(); return showEnding(); } renderStep(); };
}
function wrong(c, msg, retry) {

  if (c.tries >= 2) return null;
  return `<div class="fb bad">❌ ${md(msg || '不對喔。')}</div><div class="fb hint">💡 提示：${TASKS.hint(c.task)}<br>再試一次（成功只拿 7 成報酬）。</div>`;

function setUI(c, head) {

  $('panel').innerHTML = `<div class="step-h"><h2>💱 交易所</h2><span class="kicker">買賣、暗中行動完，回公告板結束回合</span></div>

    <div class="trade-sec"><h3>🕶️ 暗中行動（每回合 1 次，只能選 1 國）</h3>
      ${cv ? `<div class="note" style="margin:0">本回合已經${cv.type === 'subsidy' ? '暗中資助' : '散播謠言打擊'}了 <b style="color:${F[cv.f].color}">${F[cv.f].name}</b>。</div>` : `
      <div style="font-size:.85em;margin-bottom:4px">🤝 <b>暗中資助</b>：該國 +${GAME.SUBSIDY}%（友好度 60 以上打 8 折）</div>
      <div class="trade-row">${S.facs.map(f => `<button class="fbtn" style="border-color:${F[f].color}" data-sub="${f}">${F[f].name} ${GAME.subsidyCost(S, f)}💰</button>`).join('')}</div>
      <div style="font-size:.85em;margin:8px 0 4px">🗣️ <b>散播謠言</b>（${GAME.PRICE.rumor(r)} 金幣）：該國下次結算的成長減半，但友好度會下降</div>
      <div class="trade-row">${S.facs.map(f => `<button class="fbtn" style="border-color:${F[f].color}" data-rum="${f}">${F[f].name}</button>`).join('')}</div>`}</div>
    <div class="trade-sec"><h3>🔍 打探情報（${GAME.PRICE.intel()} 金幣，預估各國這次結算的自然消長）</h3>
      ${fc ? `<div class="effs">${S.facs.map(f => `<span class="eff ${fc[f] >= 0 ? 'up' : 'dn'}">${F[f].name} 約 ${fc[f] >= 0 ? '+' : ''}${fc[f]}%</span>`).join('')}</div><div style="font-size:.8em;color:var(--soft)">另外還有 ±5% 的運氣成分。自然消長是零和的：有人漲就有人跌。</div>` : `<button class="btn sm" id="intel">打探</button>`}</div>
    <div class="trade-sec"><h3>📦 元素買賣（本回合選「買」或「賣」其中一種，最多 ${GAME.TRADE_MAX} 筆）</h3>
      <div class="friends">${friends}</div>
      <div style="font-size:.8em;color:var(--soft);margin:4px 0">買賣不會改變國力，只會改變友好度：賣給某國 → 該國 🤝+4；向採礦國買 → 採礦國 🤝+3。友好度越高，賣價越好、買價越便宜。</div>
      ${news}
      <div class="tmode">${T.mode ? `本回合是「<b>${T.mode === 'buy' ? '買' : '賣'}</b>」，還能交易 <b>${left}</b> 筆` : '還沒交易：第一筆是買或賣，就決定本回合的模式'}</div>
      <div class="tabs"><button class="tab ${TRADE_TAB === 'buy' ? 'on' : ''}" data-tab="buy" ${canBuy ? '' : 'disabled'}>⛏️ 向採礦國買</button><button class="tab ${TRADE_TAB === 'sell' ? 'on' : ''}" data-tab="sell" ${canSell ? '' : 'disabled'}>📦 賣給各國</button></div>
      ${TRADE_TAB === 'buy' ? `<div style="font-size:.82em;color:var(--soft)">點元素買 1 單位；小字是價錢，↑ 比原價貴、↓ 比原價便宜；右上角是你的庫存</div><div class="pt-wrap"><div class="ptable" id="mkt"></div></div>`
      : (inv.length ? inv.map(([sym, n]) => { const by = GAME.buyers(S, sym); return `<div class="trade-row"><b style="min-width:58px">${sym} ×${n} ${arrow(sym)}</b>${by.length ? by.map(f => `<button class="fbtn" style="border-color:${F[f].color}" data-sell="${sym}|${f}" ${canSell ? '' : 'disabled'}>賣給${F[f].name} ${GAME.sellPrice(S, sym, f)}💰</button>`).join('') : '<span style="color:var(--soft)">沒有國家收購</span>'}</div>`; }).join('') : '<span style="color:var(--soft)">倉庫是空的：解尋礦委託可以挖到元素，或先向採礦國買。</span>')}
    </div>
    <div class="actions"><button class="btn" id="back">◀ 回公告板</button></div>`;
  if (TRADE_TAB === 'buy') {
    const mk = []; for (let p = 1; p <= 4; p++) for (let g = 1; g <= 18; g++) { const e = C.ELEMENTS.find(x => x.period === p && x.group === g); mk.push(e ? `<button class="el ${e.type}" data-buy="${e.sym}" ${canBuy ? '' : 'disabled'} title="${e.zh} ${GAME.buyPrice(S, e.sym)} 金幣">${e.sym}<span class="cnt">${S.inv[e.sym] || ''}</span><small>${GAME.buyPrice(S, e.sym)}${arrow(e.sym)}</small></button>` : '<div class="el empty"></div>'); }
    $('mkt').innerHTML = mk.join('');
  }
  const P = $('panel');
  P.querySelectorAll('[data-tab]').forEach(b => b.onclick = () => { TRADE_TAB = b.dataset.tab; stepTrade(); });
  P.querySelectorAll('[data-sub]').forEach(b => b.onclick = () => { if (GAME.subsidy(S, b.dataset.sub)) { refresh(); stepTrade(`<div class="note">🤝 已暗中資助${F[b.dataset.sub].name}。</div>`); } else toast('資金不夠'); });
  P.querySelectorAll('[data-rum]').forEach(b => b.onclick = () => { if (GAME.rumor(S, b.dataset.rum)) { refresh(); stepTrade(`<div class="note">🗣️ 已在${F[b.dataset.rum].name}散播謠言。</div>`); } else toast('資金不夠'); });
  P.querySelectorAll('[data-buy]').forEach(b => b.onclick = () => { if (GAME.buy(S, b.dataset.buy)) { refresh(); stepTrade(); } else toast(GAME.canTrade(S, 'buy') ? '資金不夠' : '本回合不能再買了'); });
  P.querySelectorAll('[data-sell]').forEach(b => b.onclick = () => { const [sym, f] = b.dataset.sell.split('|'); if (GAME.sell(S, sym, f)) { refresh(); stepTrade(); } else toast('本回合不能再賣了'); });
  const ib = $('intel'); if (ib) ib.onclick = () => { if (GAME.intel(S)) { refresh(); stepTrade(); } else toast('資金不夠'); };
  $('back').onclick = () => { S.step = 'board'; save(); renderStep(); };
}
function endRound() {
  const fail = WORLD.checkFail(S); if (fail) { S.ended = fail; save(); return showEnding(); }
  const res = GAME.settle(S, MAP); S.step = 'settle'; S.settleView = res; save();
  refresh(res.annex ? res.annex.cells : []);
  if (res.fail) { S.ended = res.fail; save(); setTimeout(showEnding, 1600); return; }
  renderStep();
}

/* ---------- 結算 ---------- */
function stepSettle() {
  const st = S.settle || {}, d = st.drift || {}, a = st.annex;
  $('panel').innerHTML = `<div class="step-h"><h2>⚔️ 回合結算</h2><span class="kicker">${roundName(S.round)}</span></div>
    <p>各國的自然消長（國運＋強者越強＋運氣，零和：有人漲就有人跌）：</p><div class="effs">${effChips(d)}</div>
    ${a && a.moves && a.moves.length ? `<div class="note">🏴 領土跟著國力走：${a.moves.map(m => `<b style="color:${F[m.to].color}">${F[m.to].name}</b>從<b style="color:${F[m.from].color}">${F[m.from].name}</b>奪得 <b>${m.n}</b> 個省分`).join('；')}（地圖上閃爍的地方）</div>` : '<div class="note">🕊️ 各國的領土和國力相符，這一季邊境平靜。</div>'}
    ${st.crisis ? `<div class="note" style="border:2px solid #ff8a73">🌋 <b>大陸危機！</b>各國實力太接近、局勢太平靜，反而醞釀出變故：<b style="color:${F[st.crisis.f].color}">${F[st.crisis.f].name}</b>${st.crisis.d > 0 ? '發現新的資源，國力暴漲' : '爆發內亂，國力重挫'} ${st.crisis.d > 0 ? '+' : ''}${st.crisis.d}%。</div>` : ''}
    ${st.balanced ? '<div class="note">⚖️ 本回合結束時，所有國家都在安全範圍（75%～130%）內，天下均勢：<b>均勢回合分 +20</b>（8 回合最多 160 分）。</div>'
      : st.worked === false && S.facs.every(f => WORLD.inSafe(S, f)) ? '<div class="note">💤 天下雖然均勢，但鍵結社這回合沒有完成任何委託，拿不到均勢回合分。</div>'
      : '<div class="note">⚠️ 本回合結束時有國家超出安全範圍（75%～130%），這回合拿不到均勢回合分。</div>'}
    ${warnings()}
    <div class="actions"><button class="btn" id="go">大陸上發生了一件事…… ▶</button></div>`;
  $('go').onclick = () => { S.step = 'event'; S.evRes = null; S.evId = GAME.pickEvent(S).id; save(); renderStep(); };
}

/* ---------- 事件 ---------- */
function stepEvent() {
  const ev = S.curEv && S.curEv.id === S.evId ? S.curEv : GAME.evById(S.evId);
  if (ev.kind) return puzzleUI(ev);
  $('panel').innerHTML = `<div class="step-h"><h2>🎲 隨機事件</h2><span class="kicker">${roundName(S.round)}</span></div>
    <div class="ev-card"><h3 class="serif">${ev.title}</h3><p style="margin:6px 0 10px">${esc(ev.text)}</p>
    <div id="choices">${ev.choices.map((ch, k) => `<button class="ev-choice" data-k="${k}" ${ch.money < 0 && S.money < -ch.money ? 'disabled' : ''}>${String.fromCharCode(65 + k)}. ${esc(ch.t)}</button>`).join('')}</div>
    <div id="ev-res"></div></div>`;
  const showRes = (k, r) => {
    const ch = ev.choices[k];
    $('choices').querySelectorAll('button').forEach(x => { x.disabled = true; if (+x.dataset.k === k) x.style.borderColor = 'var(--gold)'; });
    const last = S.round >= WORLD.RULE.ROUNDS;
    $('ev-res').innerHTML = `<div class="fb ${ch.ok === false ? 'bad' : ch.ok ? 'ok' : 'hint'}">${ch.ok === true ? '✅ ' : ch.ok === false ? '❌ ' : ''}${esc(ch.res)}${r.gifts && r.gifts.length ? `<br>⛏️ 得到 ${r.gifts.join('、')}` : ''}</div>
      <div class="effs">${effChips(r.applied)}${ch.money ? `<span class="eff ${ch.money > 0 ? 'up' : 'dn'}">💰 ${ch.money > 0 ? '+' : ''}${ch.money}</span>` : ''}${ch.stealth ? `<span class="eff dn">🕵️ ${ch.stealth}</span>` : ''}</div>
      <div class="actions"><button class="btn" id="go">${r.fail ? '看結局 ▶' : last ? '兩年過去了……看結局 ▶' : '進入下一回合 ▶'}</button></div>`;
    $('go').onclick = () => {
      if (r.fail) { S.ended = r.fail; save(); return showEnding(); }
      S.evRes = null; GAME.nextRound(S); save(); renderStep();
    };
  };
  if (S.evRes) return showRes(S.evRes.k, S.evRes);   // 已經選過（例如重新整理）：直接顯示結果，不能重選
  $('panel').querySelectorAll('[data-k]').forEach(b => b.onclick = () => {
    const k = +b.dataset.k;
    const r = GAME.chooseEvent(S, ev, k); if (!r.ok) return toast(r.msg);
    S.evRes = { k, ok: true, applied: r.applied, gifts: r.gifts, fail: r.fail };
    refresh(); showRes(k, S.evRes);
  });
}

/* ---------- 互動題事件（排序、分類、條約天平、路易斯結構） ---------- */
function puzzleUI(ev) {
  const d = ev.data, N = F[ev.who];
  let ans = ev.kind === 'sort' ? [] : ev.kind === 'classify' ? d.items.map(() => null) : ev.kind === 'balance' ? [...d.l, ...d.r].map(() => 1) : { bp: 0, lp: 0 };
  const ASK = { sort: `📌 ${d.title}：依序點選下面的物質<small>點錯了可以按「重排」</small>`, classify: `📌 ${d.title}<small>${d.multi ? '點一下選取、再點一下取消；有的物質同時含有兩種化學鍵' : '每一種物質點選一個聯邦'}</small>`, balance: '📌 調整每個化學式前面的係數，讓兩邊每種原子的數目都相等<small>係數要化成最簡整數比；係數 1 不用寫</small>', lewis: `📌 ${d.f} 的路易斯結構中，共有幾對共用電子？幾對孤對電子？<small>先算每個原子的價電子，再讓每個原子（H 除外）周圍湊滿 8 個電子</small>` };
  const widget = () => {
    if (ev.kind === 'sort') return `<div class="sortbox">${d.shown.map(x => `<button data-s="${esc(x)}" class="${ans.includes(x) ? 'used' : ''}" ${ans.includes(x) ? 'disabled' : ''}>${esc(x)}</button>`).join('')}</div>
      <div class="seq">${ans.length ? ans.map((x, i) => `<span>${i + 1}. ${esc(x)}</span>`).join('') : '<i style="color:#999">依序點選上面的物質</i>'}</div>
      <div class="actions"><button class="btn sm dark" id="reset">↺ 重排</button></div>`;
    if (ev.kind === 'classify') return d.items.map((it, i) => `<div class="cls-row" data-row="${i}"><b>${esc(it[0])}</b>${Object.entries(d.cats).map(([k, v]) => `<button class="${(ans[i] || []).includes(k) ? 'on' : ''}" data-i="${i}" data-c="${k}">${(ans[i] || []).includes(k) ? '✔ ' : ''}${v}</button>`).join('')}</div>`).join('');
    if (ev.kind === 'balance') {
      const all = [...d.l, ...d.r], cnt = (fs, off) => { const o = {}; fs.forEach((f, i) => Object.entries(FACTS.atoms(f)).forEach(([k, v]) => { o[k] = (o[k] || 0) + v * ans[off + i]; })); return o; };
      const L = cnt(d.l, 0), R = cnt(d.r, d.l.length), els = Object.keys({ ...L, ...R });
      const term = (f, i) => `<div class="term"><div class="step"><button data-b="${i}|-">−</button><b>${ans[i]}</b><button data-b="${i}|+">＋</button></div><div>${C.html(f)}</div></div>`;
      return `<div class="eqn">${d.l.map((f, i) => term(f, i)).join('<span>＋</span>')}<span>→</span>${d.r.map((f, i) => term(f, d.l.length + i)).join('<span>＋</span>')}</div>
        <table class="scale"><tr><th>原子</th><th>左邊（反應物）</th><th>右邊（生成物）</th><th></th></tr>${els.map(k => `<tr><td><b>${k}</b></td><td>${L[k] || 0}</td><td>${R[k] || 0}</td><td class="${L[k] === R[k] ? 'eq' : 'ne'}">${L[k] === R[k] ? '⚖️ 平衡' : '✗'}</td></tr>`).join('')}</table>`;
    }
    return `<div class="bigf">${d.f}<div style="font-size:.45em;font-weight:700">${d.zh}</div></div>
      <div class="ionbox"><div class="ionc">共用電子對<div class="step"><button data-l="bp|-">−</button><b>${ans.bp}</b><button data-l="bp|+">＋</button></div></div>
      <div class="ionc">孤對電子<div class="step"><button data-l="lp|-">−</button><b>${ans.lp}</b><button data-l="lp|+">＋</button></div></div></div>`;
  };
  const ready = () => ev.kind === 'sort' ? ans.length === d.items.length : ev.kind === 'classify' ? ans.every(Boolean) : true;
  const showRes = r => {
    const res = r.res, last = S.round >= WORLD.RULE.ROUNDS;
    $('pz').querySelectorAll('button').forEach(x => { x.disabled = true; });
    if (ev.kind === 'classify' && r.ans) r.ans.forEach((a, i) => { if ([...(a || [])].sort().join() !== [...d.items[i][1]].sort().join()) { const row = $('pz').querySelector(`[data-row="${i}"]`); if (row) row.classList.add('bad'); } });
    $('ev-res').innerHTML = `<div class="fb ${res.ok ? 'ok' : res.near ? 'hint' : 'bad'}">${res.ok ? `✅ 完全正確！${N.name}對你刮目相看。` : res.near ? '🟡 差一點，只錯了一個。' : '❌ 不太對。'}<br>${res.msg}</div>
      <div class="effs">${effChips(r.applied)}${res.ok ? '<span class="eff up">💰 +12</span>' : res.near ? '<span class="eff up">💰 +5</span>' : '<span class="eff dn">🕵️ −5</span>'}</div>
      <div class="actions"><button class="btn" id="go">${r.fail ? '看結局 ▶' : last ? '兩年過去了……看結局 ▶' : '進入下一回合 ▶'}</button></div>`;
    $('go').onclick = () => { if (r.fail) { S.ended = r.fail; save(); return showEnding(); } S.evRes = null; S.curEv = null; GAME.nextRound(S); save(); renderStep(); };
  };
  const draw = () => {
    $('panel').innerHTML = `<div class="step-h"><h2>🎲 隨機事件</h2><span class="kicker">${roundName(S.round)}</span></div>
      <div class="ev-card"><h3 class="serif">${ev.title}</h3><div class="story">${esc(ev.text)}</div><div class="ask">${ASK[ev.kind]}</div>
      <div id="pz">${widget()}</div>
      <div class="actions" id="sub-row">${S.evRes ? '' : `<button class="btn" id="sub" ${ready() ? '' : 'disabled'}>✔️ 提交答案</button>`}</div>
      <div style="font-size:.8em;color:#6b5a3a">答對：💰+12、${N.name}國力 +4｜只錯一個：💰+5｜答錯：${N.name}國力 −3、隱密度 −5</div>
      <div id="ev-res"></div></div>`;
    if (S.evRes) return showRes(S.evRes);
    const P = $('pz');
    P.querySelectorAll('[data-s]').forEach(b => b.onclick = () => { ans.push(b.dataset.s); draw(); });
    const rs = $('reset'); if (rs) rs.onclick = () => { ans = []; draw(); };
    P.querySelectorAll('[data-i]').forEach(b => b.onclick = () => { const i = +b.dataset.i, k = b.dataset.c, cur = ans[i] || [];
      ans[i] = d.multi ? (cur.includes(k) ? cur.filter(x => x !== k) : [...cur, k]) : [k]; if (!ans[i].length) ans[i] = null; draw(); });
    P.querySelectorAll('[data-b]').forEach(b => b.onclick = () => { const [i, op] = b.dataset.b.split('|'); ans[+i] = Math.max(1, Math.min(9, ans[+i] + (op === '+' ? 1 : -1))); draw(); });
    P.querySelectorAll('[data-l]').forEach(b => b.onclick = () => { const [k, op] = b.dataset.l.split('|'); ans[k] = Math.max(0, Math.min(9, ans[k] + (op === '+' ? 1 : -1))); draw(); });
    $('sub').onclick = () => {
      const res = GAME.checkPuzzle(ev, ans), r = GAME.solvePuzzle(S, ev, res);
      S.evRes = { res, applied: r.applied, fail: r.fail, ans: Array.isArray(ans) ? ans.slice() : { ...ans } };
      if (ev.kind !== 'sort') { /* 保留作答畫面 */ }
      refresh(); $('sub-row').innerHTML = ''; showRes(S.evRes);
    };
  };
  if (S.evRes && S.evRes.ans) ans = S.evRes.ans;
  draw();
}

/* ---------- 結局 ---------- */
const ENDINGS = {
  harmony: { t: '🌀 隱藏結局：大陸大和解', d: '兩年過去，各國的國力幾乎回到起點，誰也吞不下誰。各國元首在採礦國簽下和平條約，條約的見證人欄位上，有一個沒有人認得的燭火印記……' },
  peace: { t: '⚖️ 均勢和平', d: '兩年過去，各國互相牽制，誰也無法稱霸。各國繼續暗中委託鍵結社，你的組織在陰影中越來越壯大。' },
  shaky: { t: '⚠️ 危險的平衡', d: '兩年過去，沒有國家統一天下，也沒有國家滅亡，但是有國家已經失衡。鍵結社勉強撐了下來，未來充滿變數。' },
  unify: { t: '❌ 天下一統', d: '的軍隊橫掃大陸，天下歸於一統。統一的國家不再需要暗中的委託，鍵結社的據點被一一查封……' },
  destroy: { t: '❌ 一國滅亡', d: '在戰火中滅亡了。失去制衡的大陸陷入混亂，各國開始追查是誰在暗中操控，鍵結社被迫解散……' },
  exposed: { t: '❌ 組織曝光', d: '鍵結社的存在被揭穿了。各國聯手掃蕩，特工們四散逃亡……' }
};
function showEnding() {
  if (S.step !== 'end') { S.step = 'end'; }
  const e = S.ended, E = ENDINGS[e.id], sc = WORLD.score(S), fail = WORLD.FAIL_ENDS.includes(e.id);
  save();
  refresh();
  $('panel').innerHTML = `<div class="step-h"><h2>${E.t}</h2><span class="kicker">${roundName(S.round)}</span></div>
    <div class="ev-card"><p>${e.f ? `<b style="color:${F[e.f].color}">${F[e.f].full}</b>` : ''}${E.d}</p>
    ${e.id === 'unify' && WORLD.rel(S, e.f) < WORLD.RULE.UNIFY ? `<p class="note" style="background:#fff;color:#6b5a3a">${F[e.f].name}連續 2 回合相對國力超過 ${WORLD.RULE.UNIFY_SOFT}%，勢力已經無法阻擋。</p>` : ''}
    <table class="score-t">
      <tr><td>💰 資金${fail ? `（組織被消滅，資產被沒收，只留 ${WORLD.CONFISCATE * 10} 成）` : ''}</td><td>${sc.money}</td></tr>
      <tr><td>⚖️ 均勢回合分（結算時天下均勢的回合 ${S.balanceRounds} × 20）</td><td>${sc.balance}</td></tr>
      <tr><td>📚 學習分（第一次就答對 ${S.stats.firstOk}／${S.stats.tasks} 件 × 200）</td><td>${sc.learn}</td></tr>
      <tr><td>🧠 知識點分（練成 ${sc.practice / 10} 種 × 10）</td><td>${sc.practice}</td></tr>
      <tr><td>🕵️ 隱密分</td><td>${sc.stealth}</td></tr>
      <tr><td>🏁 結局分</td><td>${sc.ending}</td></tr>
      <tr class="total"><td>總分</td><td>${sc.total}</td></tr>
    </table>
    <h3 class="serif" style="margin-top:10px">🧠 知識點圖鑑</h3>${pracView()}
    ${chart()}
    <div class="actions"><button class="btn" id="again">🔁 同一張地圖再挑戰</button><button class="btn dark" id="new">🗺️ 換一張新地圖</button></div></div>`;
  $('again').onclick = () => { const lv = S.level, code = S.code, tm = S.timed; S = WORLD.newGame({ level: lv, code }); S.timed = tm; enterGame(true); };
  $('new').onclick = () => { try { localStorage.removeItem(SAVE); } catch (e) {} showTitle(); };
}
// 各國相對國力的走勢圖
function chart() {
  const H = S.history, w = 300, h = 120, max = 220, x = i => 20 + i * (w - 30) / Math.max(1, H.length - 1), y = v => h - 10 - Math.min(max, v) / max * (h - 20);
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;background:#fff;border-radius:10px;margin-top:6px">
    <rect x="20" y="${y(RU.SAFE[1])}" width="${w - 30}" height="${y(RU.SAFE[0]) - y(RU.SAFE[1])}" fill="#2f9e5a22"/>
    ${[30, 100, 200].map(v => `<line x1="20" x2="${w - 10}" y1="${y(v)}" y2="${y(v)}" stroke="#ccc" stroke-dasharray="3 3"/><text x="2" y="${y(v) + 3}" font-size="8" fill="#999">${v}%</text>`).join('')}
    ${S.facs.map(f => `<polyline fill="none" stroke="${F[f].color}" stroke-width="2" points="${H.map((p, i) => `${x(i)},${y(p[f])}`).join(' ')}"/>`).join('')}
    ${H.map((_, i) => `<text x="${x(i)}" y="${h - 1}" font-size="7" fill="#999" text-anchor="middle">${i}</text>`).join('')}</svg>
    <div style="font-size:.8em;color:#6b5a3a">相對國力走勢（橫軸：回合；綠色是安全範圍）</div>`;
}

/* ---------- 倉庫、圖鑑、選單 ---------- */
$('btn-inv').onclick = () => {
  const inv = Object.entries(S.inv).filter(([, n]) => n > 0);
  const m = modal(`<h2>⛏️ 鍵結社的倉庫</h2><p style="margin:6px 0">尋礦委託會得到元素；鑄造委託會消耗元素（每種 1 單位）。缺原料時可以在交易所向採礦國購買。</p>
    <div class="names">${inv.length ? inv.map(([sym, n]) => `<div style="background:#fff;border-radius:10px;padding:8px 12px"><b>${sym}</b> ${C.EL[sym].zh} × <b>${n}</b><br><small style="color:#6b5a3a">${C.EL[sym].typeZh}・第 ${C.EL[sym].period} 週期第 ${C.EL[sym].group} 族</small></div>`).join('') : '倉庫是空的'}</div>
    <div class="actions" style="justify-content:flex-end"><button class="btn" id="ok">關閉</button></div>`);
  m.querySelector('#ok').onclick = closeModal;
};
function codex() {
  const list = ['co', 'io', 'me', 'hb', 'vw', 'mine'];
  const TXT = {
    co: '人民兩兩<b>共用電子</b>手牽手，組成一個個「分子村落」，例如 H₂O、CO₂、NH₃。最堅固的要塞是整片連在一起的<b>網狀共價</b>城牆（鑽石、石英）。共價鍵很強，所以共國國力很高。',
    io: '陽離子和陰離子靠<b>正負電互相吸引</b>，排成整齊的大陣列（晶格）。這裡<b>沒有一對一的婚姻</b>：每個陽離子都被一圈陰離子包圍。國名寫成 NaCl 只代表人口比例 1：1，不是一對一對的分子。離子鍵和共價鍵一樣強。',
    me: '金屬陽離子泡在全國共享的<b>電子海</b>裡。社會很有彈性（延展性），消息傳得快（導電、導熱），閃閃發亮（金屬光澤）。在這個世界設定裡，金屬鍵的強度大約是共價鍵、離子鍵的 1/3。',
    hb: '成員其實是來自共國的分子村落，靠接在 <b>F、O、N 上的 H</b> 特別強的吸引力結盟（氫鍵）。氫鍵是「分子之間」的作用力，強度大約只有共價鍵的 1/10。共國分子村落越多，氫聯邦就有越多成員可以拉攏。',
    vw: '一樣由分子村落組成，靠<b>凡得瓦力</b>結盟，是最弱的聯盟，強度大約只有氫鍵的 1/10。不過分子越大、電子越多，凡得瓦力越強，這就是為什麼氯是氣體、溴是液體、碘是固體。',
    mine: '位在大陸中央山脈，開採原子序 1～36 的元素賣給各國。礦脈的位置就是<b>週期表</b>的位置：橫列是週期、直行是族。稀有氣體是住在山頂、不和任何人往來的隱士。採礦國受各國條約保護，不會被併吞。'
  };
  const m = modal(`<h2>📖 勢力圖鑑</h2><p style="margin:6px 0">各國的國力數字差很多，是因為它們代表的化學鍵（或分子間作用力）強弱本來就差很多。遊戲裡的數字是依比例設計的，不是真實的鍵能數值。</p>
    ${list.map(f => `<div class="codex-f" style="border-color:${F[f].color}"><b style="color:${F[f].color}">${F[f].icon} ${F[f].full}</b>（${F[f].bond}）${F[f].base ? `<span style="font-size:.85em;color:#6b5a3a">・標準國力 ${F[f].base[0]}～${F[f].base[1]}</span>` : ''}<div style="font-size:.92em;margin-top:4px">${TXT[f]}</div></div>`).join('')}
    <h3 style="margin-top:10px">📏 規則摘要</h3>
    <ul style="margin:6px 0 0 20px;font-size:.92em"><li>相對國力＝目前國力 ÷ 標準國力（開局時各國有強有弱，不一定是 100%）。安全範圍 75%～130%。</li><li>任一國 ≥170%（或連續 2 回合 ≥150%）＝天下一統；任一國 ≤45%＝一國滅亡；隱密度歸零＝組織曝光。三種都會讓鍵結社被消滅。</li><li>每回合結算：先算各國自然消長＝國運趨勢＋0.18×（相對國力−各國平均）＋運氣 ±5%，再扣掉各國的平均值（零和：有人漲就有人跌）。接著領土跟著國力走：每國應得面積＝總面積×自己的相對國力÷各國相對國力總和，領土不足的國家向領土過多的鄰國奪地（每回合最多 3 格，首都不會被攻下）。</li><li>交易所：每回合 1 次暗中行動（資助或謠言，只能選一國）；買賣元素每回合選「買」或「賣」，最多 3 筆，只能賣倉庫裡有的。買賣不改變國力，只改變<b>友好度</b>（🤝）：友好度越高賣價越好，採礦國友好度越高買越便宜。礦價會隨買賣量和需求浮動。</li><li>總分＝資金＋均勢回合分（每回合結算時天下均勢、而且本回合至少完成 1 件委託 +20）＋學習分（第一次就答對的比例）＋知識點分（每練成一種知識點 +10）＋隱密分＋結局分；組織被消滅時資金只留 3 成。</li><li>各國最強與最弱的差距小於 15% 時，太平靜反而會爆發「大陸危機」，某一國突然大漲或大跌 12%。</li><li>計時模式：每回合 4 分鐘，時間到還沒結束回合會爆發危機（最強國 +6%、最弱國 −6%、隱密度 −5，不能再接委託）；每 75 秒跳出一題干擾快問（20 秒，答對 💰+5，答錯或超時隱密度 −3）；委託在 60／75／90 秒內（依難度）完成，報酬 ×1.2。</li></ul>
    <div class="actions" style="justify-content:flex-end"><button class="btn" id="ok">關閉</button></div>`);
  m.querySelector('#ok').onclick = closeModal;
}
$('btn-codex').onclick = codex; $('btn-codex2').onclick = codex;
$('btn-prac').onclick = () => { const m = modal(`<h2>📚 知識點圖鑑</h2>${pracView()}<div class="actions" style="justify-content:flex-end"><button class="btn" id="cl">關閉</button></div>`); m.querySelector('#cl').onclick = () => { closeModal(); if (CUR) openTask(CUR); }; };
$('btn-menu').onclick = () => {
  const m = modal(`<h2>☰ 選單</h2><p style="margin:8px 0">地圖代碼 <b>${S.code}</b>（${S.level === 'g11' ? '高二高三版' : '高一版'}）。戰局每一步都會自動存檔。</p>
    <div class="actions"><button class="btn" id="ok">繼續遊戲</button><button class="btn dark" id="title">回到開始畫面</button></div>`);
  m.querySelector('#ok').onclick = closeModal;
  m.querySelector('#title').onclick = () => { closeModal(); showTitle(); };
};
showTitle();
</script>
