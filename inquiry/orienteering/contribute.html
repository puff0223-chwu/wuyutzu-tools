<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#1f2a44">
<title>📸 遺落的地點｜學生出題</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Noto+Serif+TC:wght@900&family=Bebas+Neue&display=swap" rel="stylesheet">
<style>
:root{--bg:#f7f3ea;--paper:#fffdf8;--ink:#1f2a44;--ink2:#4a5470;--muted:#7a8196;--line:#d9d2c3;--gold:#f2b134;--gold-soft:#fdf1d6;--red:#e4572e;--red-soft:#fde7e0;--teal:#1f9e8f;--teal-soft:#e3f4f1;--orange:#f07c1f;--blue-soft:#e4eefb;--purple:#7a4fd0}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--ink);font-family:'Noto Sans TC','Microsoft JhengHei',sans-serif;line-height:1.5;-webkit-tap-highlight-color:transparent}
button,input,textarea{font:inherit;color:inherit}
.wrap{max-width:560px;margin:0 auto;padding:0 12px 60px}
.small{font-size:.86em}.muted{color:var(--muted)}.bold{font-weight:700}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.spacer{flex:1}
.top{position:sticky;top:0;z-index:20;background:var(--ink);color:#fff;padding:9px 14px;display:flex;align-items:center;gap:10px;box-shadow:0 3px 0 var(--gold)}
.top b{font-weight:900}
.top .who{margin-left:auto;font-size:.85em;opacity:.85}
.head{background:var(--ink);color:#fff;border-radius:16px;padding:18px;margin:14px 0;box-shadow:4px 4px 0 var(--gold)}
.head .en{font-family:'Bebas Neue',sans-serif;letter-spacing:.22em;color:var(--orange);font-size:.95em}
.head h1{font-family:'Noto Serif TC',serif;font-weight:900;font-size:1.55em;line-height:1.25}
.card{background:var(--paper);border:2px solid var(--ink);border-radius:14px;box-shadow:3px 3px 0 var(--ink);padding:14px;margin:12px 0}
.card h2{font-size:1.08em;margin-bottom:6px}
label.f{display:block;font-weight:700;margin:12px 0 4px;font-size:.95em}
input[type=text],input[type=tel]{width:100%;border:2px solid var(--line);border-radius:10px;padding:10px 12px;background:#fff;font-size:1.05em}
input:focus{outline:none;border-color:var(--gold)}
input.code{font-family:monospace;font-size:1.8em;letter-spacing:.3em;text-align:center;text-transform:uppercase;font-weight:900}
.btn{display:block;width:100%;background:var(--gold);border:2.5px solid var(--ink);border-radius:12px;padding:11px;font-weight:900;font-size:1.05em;cursor:pointer;box-shadow:3px 3px 0 var(--ink);margin-top:12px}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:#fff}
.btn.purple{background:var(--purple);color:#fff;border-color:#4b2e8a;box-shadow:3px 3px 0 #4b2e8a}
.btn.sm{display:inline-block;width:auto;padding:6px 12px;font-size:.92em;margin-top:0;box-shadow:2px 2px 0 var(--ink);border-width:2px}
.alert{border-left:5px solid var(--red);background:var(--red-soft);padding:9px 12px;border-radius:8px;margin:10px 0;font-size:.93em}
.alert.ok{border-color:var(--teal);background:var(--teal-soft)}
.alert.warn{border-color:var(--gold);background:var(--gold-soft)}
/* 我的投稿 */
.mine{display:flex;gap:10px;align-items:center;border-top:1.5px dashed var(--line);padding:10px 0;cursor:pointer}
.mine:first-of-type{border-top:none}
.mine img{width:64px;height:64px;object-fit:cover;border-radius:10px;border:2px solid var(--ink);background:#eee;flex:none}
.chip{display:inline-block;border-radius:999px;padding:1px 10px;font-size:.8em;font-weight:700;background:#eee}
.chip.ok{background:var(--teal);color:#fff}.chip.back{background:var(--red);color:#fff}.chip.wait{background:var(--gold-soft);color:#8a5a00}.chip.got{background:var(--ink);color:var(--gold)}
/* 投稿步驟 */
.steps{display:flex;gap:4px;margin:12px 0 2px}
.steps i{flex:1;height:7px;border-radius:999px;background:#e2dccd}
.steps i.on{background:var(--orange)}
.stitle{font-size:1.15em;font-weight:900;margin-top:6px}
.drop{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;border:3px dashed var(--line);border-radius:16px;background:#fff;min-height:220px;cursor:pointer;text-align:center;color:var(--muted);font-weight:700}
.drop .big{font-size:3em}
.preview{width:100%;max-height:46vh;object-fit:contain;border-radius:12px;border:2px solid var(--ink);background:#222;display:block}
.mapbox{position:relative;overflow:auto;border:2px solid var(--ink);border-radius:12px;background:#fff;max-height:52vh;-webkit-overflow-scrolling:touch;margin-top:8px}
.mapin{position:relative;margin:0 auto}
.mapin .crop{position:relative;width:100%;overflow:hidden}
.mapin .inner{position:absolute;left:0;width:100%;cursor:crosshair}
.mapin img.base{width:100%;height:100%;display:block}
.mapin svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.mk{position:absolute;transform:translate(-50%,-50%);pointer-events:none}
.mk.pin{transform:translate(-50%,-100%);font-size:28px;line-height:1}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{border:2px solid var(--line);background:#fff;border-radius:999px;padding:5px 13px;font-weight:700;cursor:pointer}
.chips button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.compass{position:relative;width:200px;height:200px;margin:8px auto 0;border-radius:50%;background:radial-gradient(circle,#fffdf8 52%,#f3eee2 53%);border:2.5px solid var(--ink)}
.compass button{position:absolute;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;border:2px solid var(--ink);background:#fff;font-size:1.15em;font-weight:900;cursor:pointer}
.compass button.on{background:var(--orange);color:#fff;border-color:var(--orange)}
.compass .c{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;font-size:.85em;color:var(--muted);line-height:1.3}
.compass .c b{display:block;color:var(--ink);font-size:1.15em}
.check{display:flex;gap:10px;align-items:flex-start;border:2px solid var(--line);border-radius:12px;padding:10px 12px;margin-top:8px;background:#fff;cursor:pointer;font-weight:700}
.check input{width:22px;height:22px;flex:none;margin-top:2px}
.check span small{display:block;font-weight:500;color:var(--muted)}
.nav{display:flex;gap:10px}
.nav .btn{flex:1}
/* 通過畫面（拿去找大師領獎） */
.prize{position:fixed;inset:0;z-index:50;background:radial-gradient(circle at 50% 30%,#3a4a75,#1f2a44 70%);color:#fff;overflow:auto;padding:22px 18px;text-align:center}
.prize .big{font-size:4.2em;line-height:1;animation:pop .5s}
.prize h1{font-family:'Noto Serif TC',serif;font-size:2em;margin-top:6px;color:var(--gold)}
.prize .msg{font-size:1.2em;font-weight:900;margin:8px 0 14px}
.prize img{width:100%;max-width:420px;max-height:34vh;object-fit:cover;border-radius:14px;border:3px solid #fff}
.prize .meta{background:rgba(255,255,255,.12);border-radius:12px;padding:10px;margin:12px auto;max-width:420px;line-height:1.8}
.prize .stamp{display:inline-block;border:4px solid var(--teal);color:#7ff0df;border-radius:14px;padding:6px 18px;font-size:1.5em;font-weight:900;transform:rotate(-6deg);margin-top:6px}
.prize .btn{max-width:420px;margin-left:auto;margin-right:auto}
.prize .x{position:absolute;top:12px;right:12px;background:rgba(255,255,255,.15);border:1.5px solid rgba(255,255,255,.5);color:#fff;border-radius:10px;padding:4px 12px;cursor:pointer}
.sheet-bg{position:fixed;inset:0;background:rgba(20,26,44,.6);display:flex;align-items:flex-end;justify-content:center;z-index:60}
.sheet{background:var(--paper);color:var(--ink);border-radius:18px 18px 0 0;max-width:560px;width:100%;padding:20px 18px calc(22px + env(safe-area-inset-bottom));border-top:3px solid var(--ink);text-align:left}
.toast{position:fixed;left:50%;top:64px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:12px;z-index:200;box-shadow:3px 3px 0 var(--gold);max-width:92vw;text-align:center;font-weight:700}
.toast.err{background:var(--red)}
.zoom{position:fixed;inset:0;background:#000;z-index:100;overflow:auto}
.zoom img{width:100%;display:block}
.zoom .x{position:fixed;top:12px;right:12px;background:rgba(255,255,255,.2);color:#fff;border:1.5px solid #fff;border-radius:10px;padding:6px 14px}
.foot{text-align:center;margin-top:20px}
.foot button{background:none;border:none;color:var(--muted);text-decoration:underline;font-size:.85em;cursor:pointer}
@keyframes pop{0%{transform:scale(.4);opacity:0}100%{transform:scale(1);opacity:1}}
</style>
</head>
<body>
<div id="top"></div>
<div class="wrap" id="app"><p style="text-align:center;margin-top:30vh" class="muted">載入中…</p></div>
<script src="core.js?v=20261013g"></script>
<script>
(function () {
  'use strict';
  const G = window.GPS, esc = G.esc, DB = G.DB_URL;
  const $ = (s, el) => (el || document).querySelector(s), $$ = (s, el) => Array.from((el || document).querySelectorAll(s));
  const LS = { get: (k, d) => { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } }, set: (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { } } };
  let CODE = String(new URLSearchParams(location.search).get('c') || '').toUpperCase().replace(/[^0-9A-Z]/g, '');
  const ROOT = () => 'orienteering/contrib/' + CODE;
  const ARROWS = ['↑', '↗', '→', '↘', '↓', '↙', '←', '↖'];
  const st = { meta: null, me: null, items: {}, es: null, poll: null, step: 0, d: null, prize: null, seen: LS.get('gps_cseen', {}) };

  function toast(msg, err) { const t = document.createElement('div'); t.className = 'toast' + (err ? ' err' : ''); t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), err ? 3800 : 2400); }
  function sheet(html) { const bg = document.createElement('div'); bg.className = 'sheet-bg'; bg.innerHTML = `<div class="sheet">${html}</div>`; document.body.appendChild(bg); bg.addEventListener('click', (e) => { if (e.target === bg) bg.remove(); }); return { el: bg, close: () => bg.remove() }; }
  async function api(path, method, body) {
    const r = await fetch(DB + path + '.json', { method: method || 'GET', headers: body ? { 'Content-Type': 'application/json' } : {}, body: body ? JSON.stringify(body) : undefined });
    if (!r.ok) { const e = new Error('HTTP ' + r.status); e.status = r.status; try { e.detail = (await r.text()).slice(0, 120); } catch (x) { } throw e; }
    return r.json();
  }
  const isOpen = () => st.meta && st.meta.open && (!st.meta.deadline || Date.now() < st.meta.deadline);

  // ---------- 加入 ----------
  async function renderJoin(msg) {
    $('#top').innerHTML = '';
    if (CODE && !st.meta) { try { st.meta = await api(ROOT() + '/meta'); } catch (e) { } }
    $('#app').innerHTML = `
    <div class="head"><div class="en">THE LOST PLACES</div><h1>📸 遺落的地點・學生出題</h1><div class="small" style="opacity:.85">拍一張校園照片，讓全班來找！${st.meta ? `<br><b>${esc(st.meta.title)}</b>` : ''}</div></div>
    ${msg ? `<div class="alert">${esc(msg)}</div>` : ''}
    <div class="card">
      ${CODE && st.meta ? '' : `<label class="f">投稿代碼（老師給的 6 碼）</label><input type="text" class="code" id="jCode" maxlength="6" value="${esc(CODE)}" autocomplete="off" autocapitalize="characters">`}
      <label class="f">座號${st.meta && st.meta.roster ? '（跟老師名單上一樣，例：20105）' : ''}</label><input type="tel" id="jSeat" placeholder="例：20105">
      <label class="f">姓名</label><input type="text" id="jName" maxlength="12" placeholder="例：王小明">
      <button class="btn" id="jGo">進入</button></div>`;
    $('#jGo').onclick = async () => {
      if ($('#jCode')) CODE = $('#jCode').value.toUpperCase().replace(/[^0-9A-Z]/g, '');
      const seat = $('#jSeat').value.replace(/\D/g, ''), name = $('#jName').value.replace(/\s+/g, '');
      if (CODE.length !== 6) return toast('投稿代碼是 6 碼', true);
      if (!seat || !name) return toast('請輸入座號和姓名', true);
      $('#jGo').disabled = true;
      try {
        st.meta = await api(ROOT() + '/meta');
        if (!st.meta) { $('#jGo').disabled = false; return toast('找不到這個投稿代碼', true); }
        const h = await G.sha(CODE + '|' + seat + '|' + name);
        if (st.meta.roster && !(await api(`${ROOT()}/keys/${h}`))) { $('#jGo').disabled = false; return toast('老師的名單裡找不到你，請確認座號和姓名', true); }
        st.me = { h, seat, name }; LS.set('gps_cme_' + CODE, st.me);
        history.replaceState(null, '', '?c=' + CODE);
        start();
      } catch (e) { $('#jGo').disabled = false; toast('連線失敗，請確認網路後再試', true); }
    };
  }

  // ---------- 我的投稿（即時同步審核結果） ----------
  function connect() {
    const url = `${DB}${ROOT()}/items/${st.me.h}.json`;
    const poll = async () => { try { st.items = (await api(`${ROOT()}/items/${st.me.h}`)) || {}; onItems(); } catch (e) { } };
    try {
      st.es = new EventSource(url);
      const apply = (path, data) => { if (path === '/') st.items = data || {}; else { const ks = path.split('/').filter(Boolean); let o = st.items = st.items || {}; for (let i = 0; i < ks.length - 1; i++) o = o[ks[i]] = (o[ks[i]] && typeof o[ks[i]] === 'object') ? o[ks[i]] : {}; if (data === null) delete o[ks[ks.length - 1]]; else o[ks[ks.length - 1]] = data; } };
      st.es.addEventListener('put', (e) => { const d = JSON.parse(e.data); apply(d.path, d.data); onItems(); });
      st.es.addEventListener('patch', (e) => { const d = JSON.parse(e.data); Object.entries(d.data || {}).forEach(([k, v]) => apply((d.path === '/' ? '' : d.path) + '/' + k, v)); onItems(); });
      st.es.onerror = () => { if (st.es.readyState === 2 && !st.poll) { poll(); st.poll = setInterval(poll, 5000); } };
    } catch (e) { poll(); st.poll = setInterval(poll, 5000); }
  }
  // 2026-10-13：切到背景超過 60 秒就斷線（Firebase 免費版同時連線上限 100，全站共用），回到畫面自動重連並補抓最新結果
  function disconnect() { if (st.es) { st.es.close(); st.es = null; } clearInterval(st.poll); st.poll = null; }
  document.addEventListener('visibilitychange', () => {
    if (!st.me) return;
    if (document.visibilityState === 'hidden') { st.hiddenAt = Date.now(); setTimeout(() => { if (document.visibilityState === 'hidden' && Date.now() - st.hiddenAt >= 59000) disconnect(); }, 60000); }
    else if (!st.es && !st.poll) connect();
  });
  // 剛通過的投稿 → 自動跳出領獎畫面（每張只自動跳一次）
  function onItems() {
    const fresh = Object.entries(st.items || {}).find(([id, it]) => it.status === 'ok' && !st.seen[CODE + id]);
    if (fresh) { st.seen[CODE + fresh[0]] = 1; LS.set('gps_cseen', st.seen); st.prize = fresh[0]; }
    if (st.step === 0 || st.prize) render();
  }
  function drawTop() { $('#top').innerHTML = st.me ? `<div class="top"><b>📸 學生出題</b><span class="small" style="opacity:.8">${esc(st.meta.title)}</span><span class="who">${esc(st.me.seat)} ${esc(st.me.name)}</span></div>` : ''; }
  const photoOf = async (it) => (it.okPhoto ? G.loadPhoto(it.okPhoto) : it.pic && !it.picGone ? (st.picCache = st.picCache || {}, st.picCache[it.pic] || (st.picCache[it.pic] = await api(`${ROOT()}/pics/${it.pic}/data`).catch(() => ''))) : '');

  function render() {
    drawTop();
    if (st.prize && st.items[st.prize]) return renderPrize(st.prize);
    if (st.step > 0) return renderStep();
    const list = Object.entries(st.items || {}).sort((a, b) => (b[1].ts || 0) - (a[1].ts || 0));
    const chip = (it) => it.status === 'ok' ? (it.claimed || LS.get('gps_cclaim_' + CODE, {})[it.id] ? '<span class="chip got">🏆 已領獎</span>' : '<span class="chip ok">✅ 通過！點我領獎</span>') : it.status === 'back' ? '<span class="chip back">✏️ 退回</span>' : '<span class="chip wait">⏳ 審核中</span>';
    $('#app').innerHTML = `
    <div class="card" style="text-align:center">
      <div style="font-size:2.6em">📸</div><h2>拍一張校園照片，讓全班來找！</h2>
      <p class="small muted">${st.meta.deadline ? `截止：${new Date(st.meta.deadline).toLocaleDateString('zh-TW')}・` : ''}老師審核通過就會放進題庫，你可以拿通過畫面找大師領獎 🏆</p>
      ${isOpen() ? '<button class="btn purple" id="mNew">➕ 投一張新照片</button>' : '<div class="alert warn">這次投稿已經截止囉</div>'}
    </div>
    <div class="card"><h2>📂 我的投稿${list.length ? `（${list.length}）` : ''}</h2>
      ${list.map(([id, it]) => `<div class="mine" data-item="${id}"><img data-ph="${id}" alt=""><div style="flex:1;min-width:0"><b>${esc(it.name)}</b><div>${chip(it)}</div>${it.status === 'back' ? `<div class="small" style="color:#a33316">原因：${esc(it.reason || '')}</div>` : ''}${it.status === 'ok' ? `<div class="small muted">已成為第 ${it.pointNo} 號題目</div>` : ''}</div></div>`).join('') || '<p class="small muted">還沒有投稿。</p>'}
    </div>
    <div class="card small"><b>📏 好照片的祕訣</b><br>✔ 拍「固定不會移動」的東西（牌子、欄杆、磁磚、樹幹…）<br>✔ 可以拍特寫、從奇怪的角度拍，讓大家想一想<br>✘ 不要拍到人臉、不要進教室或辦公室</div>
    <div class="foot"><button id="logout">登出（換人）</button></div>`;
    if ($('#mNew')) $('#mNew').onclick = () => { st.d = { view: {} }; st.step = 1; render(); window.scrollTo(0, 0); };
    $$('img[data-ph]').forEach(async (im) => { const d = await photoOf(st.items[im.dataset.ph]); if (d) im.src = d; });
    $$('[data-item]').forEach((el) => { el.onclick = () => { const it = st.items[el.dataset.item]; if (it.status === 'ok') { st.prize = el.dataset.item; render(); } }; });
    $('#logout').onclick = () => { if (!confirm('確定登出？')) return; LS.set('gps_cme_' + CODE, null); st.me = null; if (st.es) st.es.close(); clearInterval(st.poll); renderJoin(); };
  }

  // ---------- 🏆 通過畫面：拿去找大師領獎 ----------
  async function renderPrize(id) {
    const it = st.items[id], claimed = it.claimed || LS.get('gps_cclaim_' + CODE, {})[id];
    $('#app').innerHTML = `<div class="prize">
      <button class="x" id="pzX">✕ 回到我的投稿</button>
      <div class="big">🎉</div><h1>投稿通過！</h1>
      <div class="msg">${claimed ? '這張的獎賞已經領過囉' : '請主動拿著這個畫面<br>找到大師領取獎賞 🏆'}</div>
      <img id="pzImg" alt="">
      <div class="meta">📸 出題者：<b>${esc(st.me.seat)} ${esc(st.me.name)}</b><br>🧭 已成為題庫第 <b>${it.pointNo}</b> 號<br>⏰ 通過時間：${new Date(it.okAt).toLocaleString('zh-TW', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' })}</div>
      ${claimed ? '<div class="stamp">✅ 已領取</div>' : '<button class="btn" id="pzClaim">🏆 大師已發獎（請大師輸入發獎碼）</button>'}
    </div>`;
    photoOf(it).then((d) => { if (d && $('#pzImg')) $('#pzImg').src = d; });
    $('#pzX').onclick = () => { st.prize = null; render(); };
    if ($('#pzClaim')) $('#pzClaim').onclick = () => {
      const sh = sheet(`<h2>🏆 請大師輸入發獎碼</h2><p class="small muted" style="margin:4px 0 8px">輸入後這張投稿就會變成「已領取」，不能再領第二次。</p><input type="tel" id="pzPin" maxlength="8" autocomplete="off" style="font-size:1.6em;letter-spacing:.3em;text-align:center"><button class="btn" data-ok>確定</button><button class="btn ghost" data-no>取消</button>`);
      $('[data-no]', sh.el).onclick = sh.close;
      $('[data-ok]', sh.el).onclick = async () => {
        const pin = $('#pzPin', sh.el).value.trim(); if (!pin) return;
        try {
          await api(`${ROOT()}/claims/${st.me.h}/${id}`, 'PUT', pin);
          const c = LS.get('gps_cclaim_' + CODE, {}); c[id] = 1; LS.set('gps_cclaim_' + CODE, c);
          sh.close(); toast('✅ 已領取！'); renderPrize(id);
        } catch (e) { toast(e.status === 401 || e.status === 403 ? '發獎碼不對，或這張已經領過了' : '連線失敗，請再試一次', true); }
      };
    };
  }

  // ---------- 投稿五步驟 ----------
  const STEPS = ['拍照', '照片在哪', '你站哪拍', '說明', '檢查送出'];
  function mapHTML(mode) {
    const m = st.meta, map = m.map || { src: 'r:map', w: 1117, h: 1579 }, crop = m.crop || { top: 0, bot: 100 }, span = (crop.bot - crop.top) / 100, d = st.d;
    const ng = (m.noGo || []).map((r) => `<rect x="${r.x}" y="${r.y}" width="${r.w}" height="${r.h}" fill="rgba(228,87,46,.15)" stroke="#e4572e" stroke-width="1.2" vector-effect="non-scaling-stroke"/>`).join('');
    const cam = d.cam ? `<div class="mk" style="left:${d.cam.x}%;top:${d.cam.y}%"><div style="width:32px;height:32px;border-radius:50%;background:${mode === 'cam' ? '#f07c1f' : '#1f9e8f'};border:2px solid #fff;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:18px;box-shadow:0 1px 4px rgba(0,0,0,.5);transform:rotate(${(d.cam.dir || 0) * 45}deg)">${d.cam.dir != null ? '↑' : '•'}</div></div>` : '';
    return `<div class="mapbox"><div class="mapin" style="width:200%"><div class="crop" style="aspect-ratio:${map.w}/${(map.h * span).toFixed(1)}"><div class="inner" data-pick="${mode}" style="top:${(-crop.top / span).toFixed(3)}%;height:${(100 / span).toFixed(3)}%">
      <img class="base" src="${esc(G.photoURL(map.src))}" alt="校園地圖"><svg viewBox="0 0 100 100" preserveAspectRatio="none">${ng}</svg>
      ${d.x != null ? `<div class="mk pin" style="left:${d.x}%;top:${d.y}%">📍</div>` : ''}${mode === 'cam' ? cam : ''}
    </div></div></div></div><div class="small muted" style="margin-top:4px">紅框＝教學區（不能進去拍）・可以左右上下滑動地圖</div>`;
  }
  function inNoGo(p) { return (st.meta.noGo || []).some((r) => p.x >= r.x && p.x <= r.x + r.w && p.y >= r.y && p.y <= r.y + r.h); }
  function renderStep() {
    const d = st.d, s = st.step;
    let body = '', ok = false;
    if (s === 1) {
      body = d.photo ? `<img class="preview" src="${d.photo}" alt=""><button class="btn ghost" id="sRe">🔄 換一張</button>` : `<label class="drop" for="sFile"><span class="big">📷</span>拍照或選照片<span class="small">直的橫的都可以，系統會自動壓縮</span></label>`;
      body += '<input type="file" id="sFile" accept="image/*" capture="environment" style="display:none">';
      ok = !!d.photo;
    } else if (s === 2) {
      body = `<p class="small muted">在地圖上點一下「照片拍的東西在哪裡」。</p>${mapHTML('pt')}${d.x != null && inNoGo(d) ? '<div class="alert">📍 這裡是教學區（紅框），請不要在上課的地方出題；如果是一樓或不同樓層，可以繼續。</div>' : ''}`;
      ok = d.x != null;
    } else if (s === 3) {
      body = `<p class="small muted">① 在地圖上點一下「你拍照時站的位置」（📍 是照片裡的東西）② 再選鏡頭朝哪個方向（地圖上方＝北）。</p>${mapHTML('cam')}
        <div class="compass">${[0, 1, 2, 3, 4, 5, 6, 7].map((k) => { const a = k * Math.PI / 4; return `<button data-dir="${k}" class="${d.cam && d.cam.dir === k ? 'on' : ''}" style="left:${(50 + 39 * Math.sin(a)).toFixed(1)}%;top:${(50 - 39 * Math.cos(a)).toFixed(1)}%">${ARROWS[k]}</button>`; }).join('')}<div class="c">📷<b>${d.cam && d.cam.dir != null ? '朝' + G.DIRS[d.cam.dir] : '選方向'}</b></div></div>`;
      ok = !!(d.cam && d.cam.x != null && d.cam.dir != null);
    } else if (s === 4) {
      const v = d.view || {};
      body = `<label class="f">📍 這是哪裡？（必填，老師看的）</label><input type="text" id="sName" maxlength="30" value="${esc(d.name || '')}" placeholder="例：學思樓前花圃的大石頭">
        <label class="f">👁️ 距離</label><div class="chips">${G.VIEW_DIST.filter((x) => x[0]).map(([k, t]) => `<button data-vd="${k}" class="${v.dist === k ? 'on' : ''}">${t}</button>`).join('')}</div>
        <label class="f">👁️ 角度</label><div class="chips">${G.VIEW_ANGLE.filter((x) => x[0]).map(([k, t]) => `<button data-va="${k}" class="${v.angle === k ? 'on' : ''}">${t}</button>`).join('')}<button data-odd class="${v.odd ? 'on' : ''}">🌀 奇特視角</button></div>
        <label class="f">💡 給找不到的人一個提示（選填）</label><input type="text" id="sHint" maxlength="40" value="${esc(d.hint || '')}" placeholder="例：在學思樓附近，低頭看看">
        <label class="f">🔍 現場觀察小題（選填）</label><input type="text" id="sTq" maxlength="60" value="${esc(d.tq || '')}" placeholder="例：這塊石頭上刻了幾個字？">
        <input type="text" id="sTa" maxlength="30" value="${esc(d.ta || '')}" placeholder="答案（例：4）" style="margin-top:6px">`;
      ok = !!(d.name && d.name.trim());
    } else if (s === 5) {
      const c = d.checks || {};
      const item = (k, t, sm) => `<label class="check"><input type="checkbox" data-ck="${k}" ${c[k] ? 'checked' : ''}><span>${t}<small>${sm}</small></span></label>`;
      body = `<div class="row" style="flex-wrap:nowrap;gap:10px;align-items:flex-start"><img src="${d.photo}" style="width:110px;height:110px;object-fit:cover;border-radius:10px;border:2px solid var(--ink)" alt=""><div class="small"><b style="font-size:1.1em">${esc(d.name)}</b><br>👁️ ${G.viewLabel({ dist: d.view.dist || '', angle: d.view.angle || '', odd: !!d.view.odd }) || '未選'}<br>🦶 鏡頭朝${G.DIRS[d.cam.dir]}${d.hint ? `<br>💡 ${esc(d.hint)}` : ''}${d.tq ? `<br>🔍 ${esc(d.tq)}` : ''}</div></div>
        ${item('a', '🚪 不在教室、辦公室或教學區裡面拍的', '不要打擾別人上課或辦公')}
        ${item('b', '🙈 照片裡沒有人臉', '保護大家的隱私')}
        ${item('c', '🪨 拍的是固定不會移動的東西', '不是盆栽、垃圾桶、腳踏車這種會被搬走的')}`;
      ok = c.a && c.b && c.c;
    }
    $('#app').innerHTML = `<div class="card">
      <div class="row"><b>📸 投稿</b><span class="spacer"></span><span class="small muted">${s} / 5・${STEPS[s - 1]}</span></div>
      <div class="steps">${STEPS.map((x, i) => `<i class="${i < s ? 'on' : ''}"></i>`).join('')}</div>
      <div class="stitle">${['', '① 拍一張校園照片', '② 照片拍的是哪裡？', '③ 你站在哪裡拍的？', '④ 簡單說明', '⑤ 送出前檢查'][s]}</div>
      ${body}
      <div class="nav"><button class="btn ghost" id="sPrev">${s === 1 ? '取消' : '← 上一步'}</button><button class="btn ${s === 5 ? 'purple' : ''}" id="sNext" ${ok ? '' : 'disabled'}>${s === 5 ? '📨 送出投稿' : '下一步 →'}</button></div>
    </div>`;
    bindStep();
  }
  function bindStep() {
    const d = st.d, s = st.step;
    const f = $('#sFile');
    if (f) f.onchange = async () => { const file = f.files[0]; if (!file) return; try { toast('照片處理中…'); const c = await G.compressImage(file, 800, 0.72, 300000); d.photo = c.data; renderStep(); } catch (e) { toast('讀不到這張照片，換一張試試', true); } };
    if ($('#sRe')) $('#sRe').onclick = () => f.click();
    $$('[data-pick]').forEach((el) => {
      el.onclick = (e) => {
        const r = el.getBoundingClientRect(), clamp = (v) => Math.min(100, Math.max(0, v)); // 點到地圖最邊邊也要在 0～100（規則會檢查）
        const x = +clamp((e.clientX - r.left) / r.width * 100).toFixed(2), y = +clamp((e.clientY - r.top) / r.height * 100).toFixed(2);
        if (el.dataset.pick === 'pt') { d.x = x; d.y = y; } else d.cam = { ...(d.cam || {}), x, y };
        keepMap(renderStep);
      };
    });
    $$('[data-dir]').forEach((b) => { b.onclick = () => { d.cam = { ...(d.cam || {}), dir: +b.dataset.dir }; keepMap(renderStep); }; });
    const save4 = () => { if (s !== 4) return; d.name = $('#sName').value.trim(); d.hint = $('#sHint').value.trim(); d.tq = $('#sTq').value.trim(); d.ta = $('#sTa').value.trim(); };
    if (s === 4) { $('#sName').oninput = () => { d.name = $('#sName').value; $('#sNext').disabled = !d.name.trim(); }; }
    $$('[data-vd]').forEach((b) => { b.onclick = () => { save4(); d.view.dist = d.view.dist === b.dataset.vd ? '' : b.dataset.vd; renderStep(); }; });
    $$('[data-va]').forEach((b) => { b.onclick = () => { save4(); d.view.angle = d.view.angle === b.dataset.va ? '' : b.dataset.va; renderStep(); }; });
    $$('[data-odd]').forEach((b) => { b.onclick = () => { save4(); d.view.odd = !d.view.odd; renderStep(); }; });
    $$('[data-ck]').forEach((c) => { c.onchange = () => { d.checks = d.checks || {}; d.checks[c.dataset.ck] = c.checked; renderStep(); }; });
    $('#sPrev').onclick = () => { save4(); if (s === 1) { if (d.photo && !confirm('放棄這次投稿？')) return; st.step = 0; render(); } else { st.step--; renderStep(); } window.scrollTo(0, 0); };
    $('#sNext').onclick = () => { save4(); if (s < 5) { st.step++; renderStep(); window.scrollTo(0, 0); centerMap(); } else submit(); };
    if (s === 2 || s === 3) centerMap();
  }
  // 點地圖後重畫：保持地圖捲動位置
  function keepMap(fn) { const b = $('.mapbox'), p = b ? [b.scrollLeft, b.scrollTop] : null, y = window.scrollY; st.noCenter = true; fn(); const b2 = $('.mapbox'); if (p && b2) { b2.scrollLeft = p[0]; b2.scrollTop = p[1]; } window.scrollTo(0, y); st.noCenter = false; }
  function centerMap() {
    if (st.noCenter) return;
    const b = $('.mapbox'), inner = b && $('.inner', b); if (!inner) return;
    const d = st.d, tx = d.x != null ? d.x : 50, ty = d.y != null ? d.y : 50;
    setTimeout(() => { b.scrollLeft = Math.max(0, tx / 100 * inner.offsetWidth - b.clientWidth / 2); b.scrollTop = Math.max(0, inner.offsetTop + ty / 100 * inner.offsetHeight - b.clientHeight / 2); }, 30);
  }
  async function submit() {
    const d = st.d; let step = '準備';
    if (!isOpen()) { // 頁面記得的狀態可能是舊的（老師剛重新開放）→ 先問一次伺服器
      try { const m = await api(ROOT() + '/meta'); if (m) st.meta = m; } catch (e) { }
      if (!isOpen()) return toast(st.meta && !st.meta.open ? '老師目前「暫停收件」，請等老師重新開放後再按一次送出' : '投稿已經截止了', true);
    }
    $('#sNext').disabled = true; $('#sNext').textContent = '⏳ 上傳中…';
    try {
      const pic = G.rid(6), id = G.rid(5);
      if (d.photo.length > 380000) d.photo = await shrinkData(d.photo); // 舊版頁面留下的大照片：再縮一次（規則上限 40 萬字）
      step = '照片';
      await api(`${ROOT()}/pics/${pic}`, 'PUT', { k: st.me.h, data: d.photo, ts: { '.sv': 'timestamp' } });
      step = '投稿內容';
      const item = { pic, x: d.x, y: d.y, cam: { x: d.cam.x, y: d.cam.y, dir: d.cam.dir }, view: { dist: d.view.dist || '', angle: d.view.angle || '', odd: !!d.view.odd }, name: d.name.slice(0, 30), seat: st.me.seat, who: st.me.name, ts: { '.sv': 'timestamp' } };
      if (d.hint) item.hint = d.hint.slice(0, 40);
      if (d.tq) item.task = { q: d.tq.slice(0, 60), a: (d.ta || '').slice(0, 30) };
      await api(`${ROOT()}/items/${st.me.h}/${id}`, 'PUT', item);
      st.step = 0; st.d = null; toast('📨 已送出！等老師審核');
      if (!st.items[id]) st.items[id] = { ...item, ts: Date.now() };
      render(); window.scrollTo(0, 0);
    } catch (e) {
      $('#sNext').disabled = false; $('#sNext').textContent = '📨 送出投稿';
      if (e.status !== 401 && e.status !== 403) return toast('上傳失敗，請確認網路後再按一次', true);
      // 2026-10-13：被拒絕時重新查一次，告訴學生「真正的原因」（以前一律說「可能截止或不在名單」）
      let why = '';
      try {
        const m = await api(ROOT() + '/meta'); if (m) st.meta = m;
        if (!m) why = '找不到這個投稿活動（可能被老師刪除了）';
        else if (!m.open) why = '老師目前「暫停收件」，請等老師重新開放後再按一次送出';
        else if (m.deadline && Date.now() > m.deadline) why = '已經過了截止時間';
        else if (m.roster && !(await api(`${ROOT()}/keys/${st.me.h}`))) why = '老師的名單裡找不到你（座號或姓名跟名單不一樣），請按右上角登出，用名單上的座號姓名再進來';
      } catch (x) { }
      if (why) toast('送不出去：' + why, true);
      else errSheet(`系統拒絕了「${step}」（${e.status}${e.detail ? '：' + e.detail : ''}）`);
    }
  }
  // 查不出原因時：顯示詳細代碼，方便截圖給老師
  function errSheet(msg) {
    const s = sheet(`<h3 style="margin-bottom:8px">😵 送不出去</h3><p class="small">請先再按一次「送出投稿」。如果還是不行，把這個畫面截圖給老師：</p>
      <div style="background:#f3eee2;border-radius:10px;padding:10px;margin:10px 0;font-size:.85em;word-break:break-all">${esc(msg)}<br>代碼 ${esc(CODE)}・${esc(st.me.seat)}・${new Date().toLocaleTimeString('zh-TW')}</div>
      <button class="btn primary" style="width:100%" data-ok>知道了</button>`);
    s.el.querySelector('[data-ok]').onclick = s.close;
  }
  // 把 dataURL 照片再縮小（長邊 640、品質 0.6）
  function shrinkData(src) {
    return new Promise((ok) => { const img = new Image(); img.onload = () => { const k = Math.min(1, 640 / Math.max(img.width, img.height)), c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k); c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); ok(c.toDataURL('image/jpeg', 0.6)); }; img.onerror = () => ok(src); img.src = src; });
  }

  async function start() {
    $('#app').innerHTML = '<p style="text-align:center;margin-top:30vh" class="muted">連線中…</p>';
    try { st.meta = await api(ROOT() + '/meta'); } catch (e) { return renderJoin('連線失敗，請確認網路後重新整理'); }
    if (!st.meta) { LS.set('gps_cme_' + CODE, null); st.me = null; return renderJoin('找不到這個投稿代碼'); }
    try { st.items = (await api(`${ROOT()}/items/${st.me.h}`)) || {}; } catch (e) { st.items = {}; }
    // 已經看過的通過投稿，下次打開不再自動跳出（但點清單還是能打開）
    render(); connect();
  }
  st.me = CODE ? LS.get('gps_cme_' + CODE, null) : null;
  if (st.me) start(); else renderJoin();
})();
</script>
</body>
</html>
