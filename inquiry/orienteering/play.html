<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#1f2a44">
<title>🧭 遺落的地點</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Noto+Serif+TC:wght@900&family=Bebas+Neue&display=swap" rel="stylesheet">
<style>
:root{--bg:#f7f3ea;--paper:#fffdf8;--ink:#1f2a44;--ink2:#4a5470;--muted:#7a8196;--line:#d9d2c3;--gold:#f2b134;--gold-soft:#fdf1d6;--red:#e4572e;--red-soft:#fde7e0;--teal:#1f9e8f;--teal-soft:#e3f4f1;--orange:#f07c1f;--blue-soft:#e4eefb}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--ink);font-family:'Noto Sans TC','Microsoft JhengHei',sans-serif;line-height:1.5;-webkit-tap-highlight-color:transparent}
button,input{font:inherit;color:inherit}
.wrap{max-width:560px;margin:0 auto;padding:0 12px 60px}
.hidden{display:none!important}
.small{font-size:.86em}.muted{color:var(--muted)}.bold{font-weight:700}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.spacer{flex:1}
/* 頂部 */
.top{position:sticky;top:0;z-index:20;background:var(--ink);color:#fff;padding:8px 14px calc(8px);display:flex;align-items:center;gap:10px;box-shadow:0 3px 0 var(--gold)}
.top .tn{font-weight:900;font-size:1.05em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:40%}
.top .prog{font-family:'Bebas Neue',sans-serif;font-size:1.6em;letter-spacing:.05em;color:var(--gold);line-height:1}
.top .clk{margin-left:auto;font-family:'Bebas Neue',sans-serif;font-size:1.6em;letter-spacing:.05em;line-height:1;text-align:right}
.top .clk small{display:block;font-family:'Noto Sans TC',sans-serif;font-size:.42em;letter-spacing:0;opacity:.75}
.net{font-size:.72em;border-radius:999px;padding:1px 8px;background:rgba(255,255,255,.14);white-space:nowrap}
.net.bad{background:var(--red)}
.head{background:var(--ink);color:#fff;border-radius:16px;padding:18px;margin:14px 0;box-shadow:4px 4px 0 var(--gold)}
.head .en{font-family:'Bebas Neue',sans-serif;letter-spacing:.22em;color:var(--orange);font-size:.95em}
.head h1{font-family:'Noto Serif TC',serif;font-weight:900;font-size:1.6em;line-height:1.25}
.card{background:var(--paper);border:2px solid var(--ink);border-radius:14px;box-shadow:3px 3px 0 var(--ink);padding:14px;margin:12px 0}
.card h2{font-size:1.08em;margin-bottom:6px}
label.f{display:block;font-weight:700;margin:10px 0 4px;font-size:.95em}
input[type=text],input[type=tel]{width:100%;border:2px solid var(--line);border-radius:10px;padding:10px 12px;background:#fff;font-size:1.1em}
input:focus{outline:none;border-color:var(--gold)}
input.code{font-family:monospace;font-size:2em;letter-spacing:.35em;text-align:center;text-transform:uppercase;font-weight:900}
.btn{display:block;width:100%;background:var(--gold);border:2.5px solid var(--ink);border-radius:12px;padding:11px;font-weight:900;font-size:1.05em;cursor:pointer;box-shadow:3px 3px 0 var(--ink);margin-top:12px}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:#fff}
.btn.sm{display:inline-block;width:auto;padding:6px 12px;font-size:.92em;margin-top:0;box-shadow:2px 2px 0 var(--ink);border-width:2px}
.alert{border-left:5px solid var(--red);background:var(--red-soft);padding:10px 12px;border-radius:8px;margin:10px 0;font-size:.95em}
.alert.ok{border-color:var(--teal);background:var(--teal-soft)}
.alert.warn{border-color:var(--gold);background:var(--gold-soft)}
.msg{background:var(--gold-soft);border:2px dashed #d79a1e;border-radius:12px;padding:8px 12px;margin-top:12px;font-weight:700;text-align:center}
/* 地圖 */
.mapbox{position:relative;overflow:auto;border:2px solid var(--ink);border-radius:12px;background:#fff;max-height:52vh;-webkit-overflow-scrolling:touch}
.mapin{position:relative;margin:0 auto}
.mapin .crop{position:relative;width:100%;overflow:hidden}
.mapin .inner{position:absolute;left:0;width:100%}
.mapin img.base{width:100%;height:100%;display:block}
.mapin svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.pin{position:absolute;transform:translate(-50%,-100%);display:flex;flex-direction:column;align-items:center;pointer-events:none}
.pin b{background:var(--orange);color:#fff;border:2px solid #fff;border-radius:8px;font-size:12px;padding:0 5px;min-width:24px;text-align:center;box-shadow:0 1px 4px rgba(0,0,0,.4);line-height:18px}
.pin i{width:2px;height:7px;background:var(--orange)}
.pin.ok b{background:var(--teal)}
.pin.ok i{background:var(--teal)}
.pin.hot b{background:var(--red);transform:scale(1.25)}
.pin.tried b{background:#9a9a9a;text-decoration:line-through}
.pin.tried i{background:#9a9a9a}
.nums button.tried{background:#eee;color:#999;text-decoration:line-through;border-color:#ccc}
.pc.prev{opacity:.92}
.pc.prev .ph img{max-height:22vh}
.mapctl{display:flex;gap:6px;justify-content:flex-end;margin-top:6px}
.mapctl button{border:2px solid var(--ink);background:#fff;border-radius:8px;width:38px;height:32px;font-weight:900;cursor:pointer}
.legend{font-size:.75em;color:var(--muted);margin-top:4px}
/* 照片卡 */
.pc{background:var(--paper);border:2.5px solid var(--ink);border-radius:16px;box-shadow:3px 3px 0 var(--ink);margin:14px 0;overflow:hidden}
.pc.ok{border-color:var(--teal);box-shadow:3px 3px 0 var(--teal)}
.pc .ph{position:relative;background:#222;display:flex;justify-content:center}
.pc .ph img{max-width:100%;max-height:46vh;display:block;cursor:zoom-in}
.pc .tag{position:absolute;left:8px;top:8px;background:var(--ink);color:var(--gold);font-weight:900;border-radius:8px;padding:1px 10px;font-size:.9em}
.pc .bd{padding:12px}
.nums{display:flex;flex-wrap:wrap;gap:7px;margin-top:6px}
.nums button{min-width:52px;padding:8px 6px;border:2px solid var(--ink);border-radius:10px;background:#fff;font-weight:900;font-size:1.1em;cursor:pointer}
.nums button.sel{background:var(--orange);color:#fff;border-color:var(--orange)}
.nums button:disabled{opacity:.3}
.okbox{display:flex;align-items:center;gap:10px}
.okbox .big{font-size:1.7em}
.reveal{margin-top:10px}
.reveal img{width:100%;border-radius:10px;display:block}
.helps{display:flex;gap:8px;margin-top:12px}
.helps .btn{margin-top:0;font-size:.95em;padding:9px 6px;background:#fff}
.hint{background:var(--blue-soft);border-radius:10px;padding:8px 12px;margin-top:8px;font-size:.95em}
.cool{background:var(--red-soft);border-radius:10px;padding:8px 12px;margin-top:8px;font-weight:700;color:#a33316;text-align:center}
.wait{background:#f3eee2;border-radius:10px;padding:8px 12px;margin-top:8px;text-align:center}
/* 全螢幕照片、對話框 */
.zoom{position:fixed;inset:0;background:#000;z-index:100;overflow:auto;touch-action:pinch-zoom pan-x pan-y}
.zoom img{width:100%;height:auto;display:block;margin:auto;min-height:100%;object-fit:contain}
.zoom .x{position:fixed;top:12px;right:12px;background:rgba(255,255,255,.2);color:#fff;border:1.5px solid #fff;border-radius:10px;padding:6px 14px;z-index:2}
.sheet-bg{position:fixed;inset:0;background:rgba(20,26,44,.6);display:flex;align-items:flex-end;justify-content:center;z-index:60}
.sheet{background:var(--paper);border-radius:18px 18px 0 0;max-width:560px;width:100%;padding:20px 18px calc(22px + env(safe-area-inset-bottom));border-top:3px solid var(--ink)}
.cover{position:fixed;inset:0;background:rgba(31,42,68,.92);color:#fff;z-index:50;display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center;padding:30px}
.cover .big{font-size:3.2em}
.toast{position:fixed;left:50%;top:70px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:12px;z-index:200;box-shadow:3px 3px 0 var(--gold);max-width:92vw;text-align:center;font-weight:700}
.toast.err{background:var(--red)}
.finish{text-align:center;padding:26px 16px}
.finish .big{font-size:4em}
.finish .stat{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:14px}
.finish .stat div{background:#f3eee2;border-radius:10px;padding:8px}
.finish .stat b{display:block;font-size:1.4em}
.foot{text-align:center;margin-top:20px}
.foot button{background:none;border:none;color:var(--muted);text-decoration:underline;font-size:.85em;cursor:pointer}
/* 🎯 積分賽：任務牆 */
.wall{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:12px}
.wall.w3{grid-template-columns:repeat(3,1fr)}
.tile{position:relative;border:2.5px solid var(--ink);border-radius:12px;overflow:hidden;background:#222;padding:0;cursor:pointer;aspect-ratio:4/3;box-shadow:2px 2px 0 var(--ink)}
.tile img{width:100%;height:100%;object-fit:cover;display:block;opacity:.88}
.tile.on{border-color:var(--orange);box-shadow:0 0 0 3px var(--orange)}
.tile.on img{opacity:1}
.tile .val{position:absolute;right:5px;top:5px;background:var(--gold);color:var(--ink);border:2px solid var(--ink);border-radius:9px;font-weight:900;font-size:1.1em;padding:0 7px;line-height:1.35}
.tile .val small{font-size:.6em}
.tile .val.cold{background:var(--red);color:#fff}
.tile .val.hot{background:#9db4cf;color:#1f2a44}
.tile .ix{position:absolute;left:5px;top:5px;background:var(--ink);color:#fff;border-radius:7px;font-weight:900;padding:0 7px;font-size:.85em}
.tile .cd{position:absolute;left:0;right:0;bottom:0;background:rgba(228,87,46,.9);color:#fff;font-size:.78em;font-weight:700;text-align:center}
.vlegend{font-size:.75em;color:var(--muted);margin-top:5px;text-align:center}
.banner{background:var(--red);color:#fff;border-radius:12px;padding:10px 12px;margin-top:12px;font-weight:900;text-align:center;box-shadow:3px 3px 0 var(--ink)}
.found{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.found .f1{flex:none;width:118px;background:#fff;border:2px solid var(--teal);border-radius:10px;overflow:hidden;font-size:.78em}
.found .f1 img{width:100%;height:70px;object-fit:cover;display:block}
.found .f1 div{padding:3px 6px}
/* 等待開始畫面（2026-10-12 改版：步驟＋規則小卡，不再是一長串條列） */
.modepill{display:inline-block;background:var(--ink);color:var(--gold);border-radius:999px;padding:3px 14px;font-weight:900;font-size:.95em}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.steps div{background:#f3eee2;border-radius:12px;padding:10px 6px;text-align:center;font-size:.82em;line-height:1.35;position:relative}
.steps div .n{position:absolute;left:6px;top:4px;font-family:'Bebas Neue',sans-serif;color:var(--orange);font-size:1.4em}
.steps div .i{display:block;font-size:1.9em;margin-bottom:2px}
.steps div b{display:block;font-size:1.15em;margin-bottom:1px}
.rgrid{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:12px}
.rgrid div{display:flex;align-items:center;gap:8px;border:2px solid var(--line);border-radius:12px;padding:7px 9px;background:#fff}
.rgrid div .i{font-size:1.5em;flex:none}
.rgrid div span{font-size:.78em;color:var(--muted);line-height:1.3}
.rgrid div span b{display:block;color:var(--ink);font-size:1.22em}
.rgrid div.wide{grid-column:1/3}
.nogo{margin-top:10px;background:var(--red-soft);color:#a33316;border-radius:10px;padding:8px 12px;font-weight:700;font-size:.9em;text-align:center}
.sect{font-weight:900;margin-top:14px;font-size:.95em;color:var(--ink2)}
/* 🎁 加分挑戰（2026-10-12 改版：答對就跳出來問、一次一題的全螢幕挑戰） */
.offer{position:fixed;inset:0;background:rgba(20,26,44,.72);z-index:45;display:flex;align-items:center;justify-content:center;padding:18px}
.offer .box{background:var(--paper);border:3px solid var(--ink);border-radius:20px;box-shadow:5px 5px 0 #7a4fd0;max-width:420px;width:100%;padding:18px;text-align:center}
.offer .box img{width:100%;max-height:28vh;object-fit:cover;border-radius:12px;border:2px solid var(--ink)}
.offer .gift{font-size:2.6em;line-height:1}
.offer .list{display:flex;flex-direction:column;gap:6px;margin:12px 0 4px;text-align:left}
.offer .list div{display:flex;align-items:center;gap:8px;background:#f3eee2;border-radius:10px;padding:8px 12px;font-weight:700}
.offer .list b{margin-left:auto;color:#7a4fd0;white-space:nowrap}
.btn.purple{background:#7a4fd0;color:#fff;border-color:#4b2e8a;box-shadow:3px 3px 0 #4b2e8a}
.chv{margin-top:14px}
.chv .hd{display:flex;align-items:center;gap:8px;background:#7a4fd0;color:#fff;border-radius:14px 14px 0 0;padding:9px 14px;font-weight:900}
.chv .hd span{margin-left:auto;background:rgba(255,255,255,.22);border-radius:999px;padding:0 10px;font-size:.9em}
.chv .bd{background:var(--paper);border:3px solid #7a4fd0;border-top:none;border-radius:0 0 14px 14px;padding:14px}
.chv .ttl{font-weight:900;font-size:1.12em}
.chv .ph1{width:100%;max-height:26vh;object-fit:cover;border-radius:10px;border:2px solid var(--ink);margin-top:8px;cursor:zoom-in;display:block}
.chv .q{font-size:1.15em;font-weight:900;margin:12px 0 2px}
.chv .stp{font-weight:900;margin-top:14px;display:flex;align-items:center;gap:6px}
.chv .stp i{font-style:normal;background:var(--ink);color:#fff;border-radius:50%;width:22px;height:22px;display:inline-flex;align-items:center;justify-content:center;font-size:.8em}
.chv .stp.done i{background:var(--teal)}
.chv .big{font-size:3em;text-align:center;line-height:1.1;margin-top:6px}
.chv .skipl{display:block;margin:12px auto 0;background:none;border:none;color:var(--muted);text-decoration:underline;font-size:.9em;cursor:pointer}
.compass{position:relative;width:200px;height:200px;margin:8px auto 0;border-radius:50%;background:radial-gradient(circle,#fffdf8 52%,#f3eee2 53%);border:2.5px solid var(--ink)}
.compass button{position:absolute;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;border:2px solid var(--ink);background:#fff;font-size:1.15em;font-weight:900;cursor:pointer}
.compass button.on{background:var(--orange);color:#fff;border-color:var(--orange)}
.compass .c{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;font-size:.85em;color:var(--muted);line-height:1.3}
.compass .c b{display:block;color:var(--ink);font-size:1.15em}
.chrec{margin-top:12px}
.chrec summary{cursor:pointer;font-weight:900}
.chrec .r{display:flex;gap:8px;align-items:center;border-top:1px dashed var(--line);padding:6px 0;font-size:.9em}
.chrec .r b{margin-left:auto;white-space:nowrap}
.top .tn button{background:none;border:none;color:var(--gold);font-size:.85em;cursor:pointer;padding:0 0 0 4px}
/* 🎁 加分挑戰 */
.chal{border-color:#7a4fd0;box-shadow:3px 3px 0 #7a4fd0}
.cb{border-top:1.5px dashed var(--line);padding-top:10px;margin-top:10px}
.cb:first-of-type{border-top:none;margin-top:4px;padding-top:0}
.cthumb{width:64px;height:64px;object-fit:cover;border-radius:8px;border:2px solid var(--ink);flex:none;cursor:zoom-in}
.mapbox.mini{max-height:42vh;margin-top:8px}
.mapbox.mini .inner{cursor:crosshair}
.mk{position:absolute;transform:translate(-50%,-50%);pointer-events:none;font-size:20px;line-height:1;text-shadow:0 0 3px #fff}
.mk.tg{transform:translate(-50%,-100%)}
.mk .ar{display:block;font-size:22px}
.dirs{display:grid;grid-template-columns:repeat(3,46px);gap:5px;justify-content:center;margin-top:8px}
.dirs button{height:42px;border:2px solid var(--ink);border-radius:9px;background:#fff;font-size:1.3em;font-weight:900;cursor:pointer}
.dirs button.on{background:var(--orange);color:#fff;border-color:var(--orange)}
.dirs span{display:flex;align-items:center;justify-content:center;font-size:.7em;color:var(--muted)}
.res{border-radius:10px;padding:8px 12px;margin-top:8px;font-weight:700}
.res.ok{background:var(--teal-soft);color:#14695f}.res.half{background:var(--gold-soft);color:#8a5a00}.res.no{background:var(--red-soft);color:#a33316}.res.judge{background:var(--blue-soft)}
@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.shake{animation:shake .4s}
@keyframes pop{0%{transform:scale(.6);opacity:0}100%{transform:scale(1);opacity:1}}
.pop{animation:pop .35s}
</style>
</head>
<body>
<div id="top"></div>
<div class="wrap" id="app"><p style="text-align:center;margin-top:30vh" class="muted">載入中…</p></div>
<script src="core.js?v=20261013f"></script>
<script>
(function () {
  'use strict';
  const G = window.GPS, esc = G.esc, DB = G.DB_URL;
  const $ = (s, el) => (el || document).querySelector(s), $$ = (s, el) => Array.from((el || document).querySelectorAll(s));
  const LS = { get: (k, d) => { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } }, set: (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { } } };
  const CODE = String(new URLSearchParams(location.search).get('code') || '').toUpperCase().replace(/[^0-9A-Z]/g, '');
  const RUN = 'orienteering/runs/' + CODE;
  const did = LS.get('gps_did', '') || (() => { const d = 'd' + G.rid(4); LS.set('gps_did', d); return d; })();
  const st = {
    me: LS.get('gps_join_' + CODE, null), pub: null, view: null, net: 'live', offset: 0, beatLocal: Date.now(), lastBeat: 0,
    sel: {}, pending: {}, reqPending: {}, zoom: 1, lastHTML: '', center: true, autoZoom: true, es: null, poll: null, hiddenAt: 0, lastBatch: 0, shown: {},
    focus: null, camSel: {}, chalPend: {}, taskText: {}, lastChal: -1, mapPins: [], bannerOn: false, chalNo: 0, chalShow: null, chalHide: {}
  };
  const q = { list: LS.get('gps_q_' + CODE, []), busy: false };

  function toast(msg, err) { const t = document.createElement('div'); t.className = 'toast' + (err ? ' err' : ''); t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), err ? 3800 : 2400); }
  function sheet(html) {
    const bg = document.createElement('div'); bg.className = 'sheet-bg'; bg.innerHTML = `<div class="sheet">${html}</div>`;
    document.body.appendChild(bg); bg.addEventListener('click', (e) => { if (e.target === bg) bg.remove(); });
    return { el: bg, close: () => bg.remove() };
  }
  async function api(path, method, body) {
    const r = await fetch(DB + path + '.json', { method: method || 'GET', headers: body ? { 'Content-Type': 'application/json' } : {}, body: body ? JSON.stringify(body) : undefined });
    if (!r.ok) { const e = new Error('HTTP ' + r.status); e.status = r.status; throw e; }
    return r.json();
  }
  const now = () => Date.now() + st.offset; // 換算成「大師的時鐘」

  // ---------- 加入 ----------
  function renderJoin(msg) {
    $('#top').innerHTML = '';
    $('#app').innerHTML = `
    <div class="head"><div class="en">THE LOST PLACES</div><h1>🧭 遺落的地點</h1><div class="small" style="opacity:.85">校園照片定向越野</div></div>
    ${!CODE ? '<div class="alert">網址少了活動代碼，請重新掃老師給的 QR Code。</div>' : `
    <div class="card"><h2>🔑 輸入你們這一組的通行碼</h2><p class="small muted">活動代碼 <b>${esc(CODE)}</b>・通行碼在老師發的小紙條上（4 碼）</p>
      ${msg ? `<div class="alert">${esc(msg)}</div>` : ''}
      <input type="text" class="code" id="jPass" maxlength="4" autocomplete="off" autocapitalize="characters" placeholder="____">
      <button class="btn" id="jGo">進入</button></div>
    <div class="card small"><b>怎麼玩？</b><br>每一關系統給你們 1～2 張校園照片，地圖上會標出幾個「候選地點」，照片就是其中的地點！想一想、跑去現場比對，選出照片拍的是幾號送出。<br>🚫 斜線區是正在上課的教學區，請繞道、保持安靜。</div>`}`;
    if (!CODE) return;
    const go = async () => {
      const pass = $('#jPass').value.toUpperCase().replace(/[^0-9A-Z]/g, '');
      if (pass.length !== 4) return toast('通行碼是 4 碼', true);
      $('#jGo').disabled = true;
      try {
        const k = await G.sha(CODE + '|' + pass);

    const ctr = $('[data-center]'); if (ctr) ctr.onclick = () => { st.center = true; st.autoZoom = true; centerMap(); };
    $$('[data-focus]').forEach((b) => { b.onclick = () => { if (st.focus === b.dataset.focus) return; st.focus = b.dataset.focus; st.sel = {}; st.center = true; st.autoZoom = true; render(); }; });
    $$('[data-num]').forEach((b) => { b.onclick = () => { const [cid, n] = b.dataset.num.split('|'); st.sel = { [cid]: +n }; render(); }; });
    $$('[data-send]').forEach((b) => {
      b.onclick = () => {
        const cid = b.dataset.send, ans = st.sel[cid]; if (!ans) return;
        const c = st.view.cards[cid];
        st.pending[cid] = { ans, wrong: c.wrong || 0, at: Date.now() };
        st.sel = {};
        enqueue('subs', { cid, ans, by: LS.get('gps_seats_' + CODE, '') });
        render();
      };
    });
    $$('[data-hint]').forEach((b) => {
      b.onclick = () => {
        const cid = b.dataset.hint, c = st.view.cards[cid], s = st.view.set, lv = (c.hint1 ? 1 : 0) + (c.hint2 ? 1 : 0);
        const cost = isScore() ? `這張照片的分數<b>打折 −${s.hintPct}%</b>` : `<b>罰 ${s.hintCost} 秒</b>`;
        const sh = sheet(`<h2>💡 要求助嗎？</h2><p style="margin:8px 0">系統會給你${lv ? '第二層（更精確的）' : '第一層（大範圍的）'}提示，${cost}。</p><button class="btn" data-ok>💡 給我提示</button><button class="btn ghost" data-no>再想想</button>`);
        $('[data-no]', sh.el).onclick = sh.close;
        $('[data-ok]', sh.el).onclick = () => { sh.close(); st.reqPending[cid] = { type: 'hint', lv }; enqueue('reqs', { cid, type: 'hint' }); render(); };
      };
    });
    $$('[data-skip]').forEach((b) => {
      b.onclick = () => {
        const cid = b.dataset.skip, s = st.view.set;
        const sh = sheet(`<h2>⏭ 放棄這一張？</h2><p style="margin:8px 0">牆上會補一張新的照片。放棄之後 <b>${s.skipCool} 秒內</b>不能再放棄。</p><button class="btn" data-ok>⏭ 放棄，換一張</button><button class="btn ghost" data-no>再找找</button>`);
        $('[data-no]', sh.el).onclick = sh.close;
        $('[data-ok]', sh.el).onclick = () => { sh.close(); st.reqPending[cid] = { type: 'skip' }; enqueue('reqs', { cid, type: 'skip' }); render(); };
      };
    });
    $$('[data-pass]').forEach((b) => {
      b.onclick = () => {
        const cid = b.dataset.pass;
        const sh = sheet(`<h2>🙋 申請 PASS</h2><p class="small" style="margin:6px 0">大師同意後會換一題給你們。<b>PASS 的題目不算完成</b>，還是要湊滿 ${st.view.target} 題。</p>
          <label class="f">想跟大師說什麼？（選填）</label><input type="text" id="pNote" maxlength="60" placeholder="例：這裡被圍起來了"><button class="btn" data-ok>送出申請</button><button class="btn ghost" data-no>先不要</button>`);
        $('[data-no]', sh.el).onclick = sh.close;
        $('[data-ok]', sh.el).onclick = () => { const note = $('#pNote', sh.el).value.trim().slice(0, 60); sh.close(); st.reqPending[cid] = { type: 'pass' }; enqueue('reqs', note ? { cid, type: 'pass', note } : { cid, type: 'pass' }); toast('已送出，等待大師裁決'); render(); };
      };
    });
    // 🦶 站位挑戰：點地圖標站位、按箭頭選方向
    $$('[data-mpick]').forEach((el) => {
      el.onclick = (e) => {
        const r = el.getBoundingClientRect(), bid = el.dataset.mpick;
        const x = (e.clientX - r.left) / r.width * 100, y = (e.clientY - r.top) / r.height * 100;
        st.camSel[bid] = { ...(st.camSel[bid] || {}), x: +x.toFixed(2), y: +y.toFixed(2) }; render();
      };
    });
    $$('[data-cdir]').forEach((b) => { b.onclick = () => { const [bid, d] = b.dataset.cdir.split('|'); st.camSel[bid] = { ...(st.camSel[bid] || {}), dir: +d }; render(); }; });
    $$('[data-csend]').forEach((b) => {
      b.onclick = () => {
        const bid = b.dataset.csend, sel = st.camSel[bid]; if (!sel || sel.x == null || sel.dir == null) return;
        st.chalPend[bid] = Date.now(); enqueue('reqs', { cid: bid, type: 'cam', x: sel.x, y: sel.y, dir: sel.dir }); render();
      };
    });
    // 🎁 挑戰：開始、略過（整個地點／單一題）、看完結果繼續
    $$('[data-chgo]').forEach((b) => { b.onclick = () => { st.chalNo = +b.dataset.chgo; st.chalShow = null; render(); window.scrollTo(0, 0); }; });
    const skipChal = (bids) => { bids.forEach((bid) => { st.chalHide[bid] = 1; enqueue('reqs', { cid: bid, type: 'cskip' }); }); };
    $$('[data-chskip]').forEach((b) => { b.onclick = () => { const no = +b.dataset.chskip; skipChal(chalOpen(st.view).filter(([, c]) => c.no === no).map(([bid]) => bid)); render(); }; });
    $$('[data-chskip1]').forEach((b) => { b.onclick = () => { skipChal([b.dataset.chskip1]); render(); window.scrollTo(0, 0); }; });
    $$('[data-chnext]').forEach((b) => { b.onclick = () => { st.chalShow = null; render(); window.scrollTo(0, 0); }; });
    // ✏️ 改隊名（只能一次，規則擋第二次）
    $$('#app [data-rename]').forEach((b) => { b.onclick = openRename; });
    $$('[data-keep^="tk_"]').forEach((i) => { i.oninput = () => { st.taskText[i.dataset.keep.slice(3)] = i.value; }; });
    $$('[data-tsend]').forEach((b) => {
      b.onclick = () => {
        const bid = b.dataset.tsend, inp = $(`[data-keep="tk_${bid}"]`), text = (inp ? inp.value : '').trim().slice(0, 60);
        if (!text) return toast('先輸入答案', true);
        st.taskText[bid] = text; st.chalPend[bid] = Date.now(); enqueue('reqs', { cid: bid, type: 'task', text }); render();
      };
    });
    const lo = $('#logout'); if (lo) lo.onclick = () => { if (!confirm('確定登出？（這支手機會忘記你們的組別）')) return; LS.set('gps_join_' + CODE, null); st.me = null; disconnect(); renderJoin(); };
  }
  // 每秒更新倒數（冷卻、PASS、放棄、遲到、時鐘），不重畫整頁
  setInterval(() => {
    if (!st.view || !st.me) return;
    drawTop();
    const t = now();
    let need = false;
    $$('[data-cool]').forEach((el) => { const left = Math.ceil((+el.dataset.cool - t) / 1000); if (left <= 0) need = true; else el.textContent = `❌ 不對喔！${left} 秒後可以再試`; });
    $$('[data-passat]').forEach((b) => { const left = Math.ceil((+b.dataset.passat - t) / 1000); if (left <= 0) need = true; else b.textContent = `🙋 PASS（${G.fmtTime(left)}）`; });
    $$('[data-skipat]').forEach((b) => { const left = Math.ceil((+b.dataset.skipat - t) / 1000); if (left <= 0) need = true; else b.textContent = `⏭ 放棄（${G.fmtTime(left)}）`; });
    $$('[data-lateat]').forEach((el) => { el.textContent = lateTxt(+el.dataset.lateat, el.dataset.latepts); });
    if (bannerCond(st.view) !== st.bannerOn) need = true;
    Object.entries(st.pending).forEach(([cid, p]) => { if (Date.now() - p.at > 25000 && !q.list.length) { delete st.pending[cid]; need = true; toast('大師還沒回應，可以再送一次', true); } });
    Object.entries(st.chalPend).forEach(([bid, at]) => { if (Date.now() - at > 25000 && !q.list.length) { delete st.chalPend[bid]; need = true; toast('大師還沒回應，可以再送一次', true); } });
    if (need) render();
  }, 1000);

  async function start() {
    $('#app').innerHTML = '<p style="text-align:center;margin-top:30vh" class="muted">連線中…</p>';
    try {
      st.pub = await api(`${RUN}/pub`);
      st.view = await api(`${RUN}/teams/${st.me.tid}/view`);
      if (!st.view) { LS.set('gps_join_' + CODE, null); st.me = null; return renderJoin('找不到你們的組別，請重新輸入通行碼'); }
    } catch (e) { return renderJoin('連線失敗，請確認網路後重新整理'); }
    st.lastBatch = st.view.batchNo || 0; st.lastDone = st.view.done || 0;
    onView(); connect(); flushQueue();
    if (!LS.get('gps_seats_' + CODE, '')) renderMembers();
  }
  if (st.me && CODE) start(); else renderJoin();
})();
</script>
</body>
</html>
