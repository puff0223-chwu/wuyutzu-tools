<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>🔧 展覽館管理｜巫魚子教課事務所</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Noto+Serif+TC:wght@700;900&family=Bebas+Neue&display=swap" rel="stylesheet">
<link rel="stylesheet" href="showcase.css?v=20261108a">
<style>
/* =========================================================
   🔧 教師展覽館管理頁 v2（2026-11-08 全面檢修）
   版面：上方狀態列（連線燈號）→ 分頁 → 內容
   ========================================================= */
body { padding-bottom: 70px; }
.atop { position: sticky; top: 0; z-index: 40; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; background: var(--navy); color: #fff; padding: 9px 16px; box-shadow: 0 3px 0 var(--mustard); }
.atop .brand { font-weight: 900; line-height: 1.2; }
.atop .brand small { display: block; font-family: 'Bebas Neue', sans-serif; letter-spacing: .2em; color: var(--mustard); font-size: .72em; font-weight: 400; }
.atop .sp { flex: 1; }
.atop a, .atop button { color: #fff; text-decoration: none; background: none; border: 1.5px solid rgba(255,255,255,.45); border-radius: 10px; padding: 5px 11px; font: inherit; font-weight: 700; font-size: .86em; cursor: pointer; white-space: nowrap; }
.atop .who { font-size: .8em; opacity: .75; }
.conn { display: inline-flex; align-items: center; gap: 6px; font-size: .84em; font-weight: 800; padding: 4px 10px; border-radius: 999px; background: rgba(255,255,255,.12); }
.conn i { width: 10px; height: 10px; border-radius: 50%; background: #b9b2a3; }
.conn.on i { background: #3ccf8e; box-shadow: 0 0 0 3px rgba(60,207,142,.25); }
.conn.off { background: #e4572e; } .conn.off i { background: #fff; }
.awrap { max-width: 1120px; margin: 0 auto; padding: 16px; }
.nav { display: flex; gap: 8px; flex-wrap: wrap; margin: 4px 0 14px; }
.nav a { text-decoration: none; font-weight: 800; border: 2px solid var(--navy); background: #fff; color: var(--navy); border-radius: 999px; padding: 6px 15px; }
.nav a.on { background: var(--navy); color: #fff; }
.nav .n { display: inline-block; min-width: 20px; border-radius: 999px; background: var(--red); color: #fff; font-size: .78em; padding: 0 6px; margin-left: 4px; text-align: center; }
.panel { background: var(--card); border: 2px solid var(--navy); border-radius: 16px; box-shadow: 4px 4px 0 var(--navy); padding: 16px 18px; margin-bottom: 16px; }
.panel h2 { font-family: 'Noto Serif TC', serif; font-size: 1.2em; margin-bottom: 8px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.grow { flex: 1; }
.muted { color: var(--muted); }
.small { font-size: .86em; }
.btn.red { background: #fff; color: var(--red); border-color: var(--red); box-shadow: 3px 3px 0 var(--red); }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.btn.xs { padding: 3px 9px; font-size: .8em; box-shadow: 2px 2px 0 var(--navy); }
input[type=text], input[type=search], input[type=password], textarea, select { font: inherit; color: var(--navy); border: 2px solid #ddd3bd; border-radius: 10px; padding: 7px 10px; background: #fff; width: 100%; }
input[disabled] { background: #f3efe6; color: var(--muted); }
textarea { min-height: 84px; resize: vertical; line-height: 1.6; }
input:focus, textarea:focus, select:focus { outline: none; border-color: var(--mustard); }
label.f { display: block; font-weight: 800; margin: 12px 0 4px; font-size: .92em; }
.hint { font-size: .82em; color: var(--muted); margin-top: 3px; line-height: 1.55; }
.tip { display: inline-grid; place-items: center; width: 18px; height: 18px; border-radius: 50%; background: var(--navy); color: #fff; font-size: .72em; font-weight: 900; cursor: help; position: relative; vertical-align: 1px; margin-left: 4px; }
.tip::after { content: attr(data-tip); display: none; position: absolute; left: 50%; top: 24px; transform: translateX(-50%); z-index: 60; width: max-content; max-width: 280px; white-space: pre-line; background: var(--navy); color: #fff; font-weight: 500; font-size: 13px; line-height: 1.55; padding: 8px 11px; border-radius: 9px; box-shadow: 3px 3px 0 var(--mustard); text-align: left; }
.tip:hover::after, .tip:focus::after { display: block; }
.warn { background: #fde8e1; border: 1.5px solid #f2b3a0; color: #8c2f17; border-radius: 10px; padding: 8px 12px; font-size: .9em; line-height: 1.6; margin: 8px 0; }
.okbox { background: #e3f4f1; border: 1.5px solid #9fd6cd; color: #13675d; border-radius: 10px; padding: 8px 12px; font-size: .9em; margin: 8px 0; }
.info { background: #fff1d6; border: 1.5px solid var(--mustard); border-radius: 10px; padding: 8px 12px; font-size: .9em; line-height: 1.6; margin: 8px 0; }
.sw { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; font-weight: 800; font-size: .84em; user-select: none; white-space: nowrap; border: none; background: none; font-family: inherit; color: var(--navy); padding: 0; }
.sw i { width: 38px; height: 22px; border-radius: 999px; background: #cfc8b8; position: relative; transition: background .15s; flex: none; }
.sw i::after { content: ''; position: absolute; left: 3px; top: 3px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: left .15s; }
.sw.on i { background: #2e9d6a; } .sw.on i::after { left: 19px; }
.sw[disabled] { opacity: .5; cursor: not-allowed; }
.toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); z-index: 300; background: var(--navy); color: #fff; padding: 10px 18px; border-radius: 12px; font-weight: 700; box-shadow: 3px 3px 0 var(--mustard); max-width: 92vw; }
.toast.err { background: var(--red); }
.banner { position: sticky; top: 52px; z-index: 35; margin-bottom: 12px; }
.gate { max-width: 460px; margin: 9vh auto; }
.st { display: inline-block; border-radius: 999px; padding: 1px 9px; font-size: .78em; font-weight: 800; white-space: nowrap; }
.st.on { background: #2e9d6a; color: #fff; } .st.hid { background: #efedf2; color: #55515f; } .st.no { background: #fff; border: 1.5px dashed #b9b2a3; color: var(--muted); }
.st.ok { background: #e3f4f1; color: #13675d; } .st.bad { background: #fde8e1; color: #a33a1d; } .st.ext { background: #e4edf8; color: #2f5a8f; }
.st.sync { background: #e4edf8; color: #2f5a8f; } .st.suite { background: var(--navy); color: #fff; } .st.solo { background: #fff1d6; color: #8a5a00; }

/* 📬 需要你看一下 */
.inbox { border-color: var(--red); box-shadow: 4px 4px 0 var(--red); }
.ibx { display: flex; gap: 10px; align-items: flex-start; padding: 10px 0; border-top: 1px dashed var(--line); }
.ibx:first-of-type { border-top: none; }
.ibx .ic { font-size: 1.3em; line-height: 1.2; flex: none; width: 28px; text-align: center; }
.ibx .tx { flex: 1; min-width: 0; line-height: 1.6; }
.ibx .tx small { display: block; color: var(--muted); }
.ibx .ops { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.diff { display: inline-block; font-size: .86em; background: #f6f2e8; border-radius: 6px; padding: 0 6px; margin: 2px 4px 0 0; }
.diff del { color: #a33a1d; } .diff ins { color: #13675d; text-decoration: none; font-weight: 800; }

/* 🖼️ 卡片清單 */
.toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 6px; }
.chips2 { display: flex; gap: 6px; flex-wrap: wrap; }
.chips2 button { font: inherit; font-size: .86em; font-weight: 700; cursor: pointer; border: 2px solid var(--navy); background: #fff; border-radius: 999px; padding: 4px 12px; color: var(--navy); }
.chips2 button.on { background: var(--navy); color: #fff; }
.dsec h3 { font-family: 'Noto Serif TC', serif; font-size: 1.12em; display: flex; align-items: center; gap: 8px; margin: 18px 0 6px; }
.dsec h3 .tag { font-family: 'Bebas Neue', sans-serif; letter-spacing: .12em; color: #fff; padding: 1px 10px; border-radius: 6px; font-size: .78em; }
.rows { border: 2px solid var(--navy); border-radius: 12px; background: #fff; overflow: hidden; }
.r { display: grid; grid-template-columns: 52px minmax(0, 1fr) 118px 170px 70px auto; gap: 10px; align-items: center; padding: 8px 10px; border-top: 1px solid var(--line); }
.r:first-child { border-top: none; }
.r.off { background: #fbf8f2; }
.r.off .nm, .r.off .ico { opacity: .55; }
.r.child { background: #f9fbff; padding-left: 26px; }
.r.child.off { background: #f6f5f2; }
.r .mv { display: flex; flex-direction: column; gap: 2px; }
.r .mv button { font: inherit; font-size: .72em; line-height: 1; padding: 3px 0; border: 1.5px solid var(--line); background: #fff; border-radius: 6px; cursor: pointer; }
.r .mv button:hover { border-color: var(--navy); }
.r .main { display: flex; gap: 10px; align-items: center; min-width: 0; cursor: pointer; }
.r .ico { flex: none; width: 36px; height: 36px; border-radius: 9px; display: grid; place-items: center; font-size: 1.25em; background: var(--soft, #f3efe6); }
.r .nm { min-width: 0; }
.r .nm b { display: block; line-height: 1.3; }
.r .nm .br { display: block; color: var(--muted); font-size: .8em; line-height: 1.4; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.r .nm .tags { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 2px; }
.r .nm .tags .st { font-size: .7em; }
.r select { padding: 4px 6px; font-size: .84em; border-radius: 8px; }
.r .hl { font-size: .84em; font-weight: 800; cursor: pointer; white-space: nowrap; }
.r .hl.ok { color: #2e9d6a; } .r .hl.warn { color: #b7791f; } .r .hl.err { color: #c0392b; }
.r .ops { display: flex; gap: 6px; justify-content: flex-end; }
.r .ops button { font: inherit; font-size: .84em; border: 1.5px solid var(--line); background: #fff; border-radius: 8px; padding: 4px 9px; cursor: pointer; white-space: nowrap; }
.r .ops button:hover { border-color: var(--navy); }
.r .elbow { position: absolute; }
.rh { display: grid; grid-template-columns: 52px minmax(0, 1fr) 118px 170px 70px auto; gap: 10px; padding: 0 10px 4px; font-size: .76em; font-weight: 800; color: var(--muted); }

/* 🧰 母頁工具 */
table.mt { width: 100%; border-collapse: collapse; font-size: .92em; }
.mt th { text-align: left; background: #f3eee2; padding: 7px 8px; font-size: .84em; }
.mt td { padding: 7px 8px; border-top: 1px solid var(--line); vertical-align: middle; }
.mt tr.new td { background: #fff7e6; }
.mt tr.skip td { opacity: .55; }

/* 🗂️ 分類 */
.drow { display: grid; grid-template-columns: 54px 1.2fr .8fr 1.6fr 56px auto; gap: 8px; align-items: center; padding: 8px 0; border-bottom: 1px dashed var(--line); }
.drow input[type=color] { width: 54px; height: 38px; border: 2px solid #ddd3bd; border-radius: 10px; padding: 2px; background: #fff; }

/* ✏️ 編輯頁 */
.ed { display: grid; grid-template-columns: minmax(0, 1fr) 290px; gap: 16px; align-items: start; }
.ed-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
.ed-head h2 { font-family: 'Noto Serif TC', serif; font-size: 1.35em; }
.jump { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; position: sticky; top: 52px; z-index: 20; background: var(--cream); padding: 6px 0; }
.jump a { font-size: .84em; font-weight: 800; text-decoration: none; border: 1.5px solid var(--navy); border-radius: 999px; padding: 3px 11px; background: #fff; }
.sec { scroll-margin-top: 110px; }
.sec h3 { font-size: 1.08em; display: flex; align-items: center; gap: 6px; margin-bottom: 2px; }
.side { position: sticky; top: 64px; display: flex; flex-direction: column; gap: 12px; }
.side .panel { margin: 0; padding: 14px; }
.side .health li { list-style: none; font-size: .88em; line-height: 1.5; padding: 4px 0; border-top: 1px dashed var(--line); cursor: pointer; }
.side .health li:first-child { border-top: none; }
.savebar { display: flex; flex-direction: column; gap: 8px; }
.savebar .btn { justify-content: center; text-align: center; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 14px; }
.grid3 { display: grid; grid-template-columns: 90px 1fr; gap: 0 14px; }
.choice { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.choice.three { grid-template-columns: repeat(3, 1fr); }
.choice label { display: block; border: 2px solid var(--line); border-radius: 12px; padding: 9px 11px; cursor: pointer; background: #fff; font-size: .86em; line-height: 1.5; }
.choice label b { display: block; font-size: 1.05em; }
.choice label.on { border-color: var(--navy); background: #fff7e6; box-shadow: 2px 2px 0 var(--navy); }
.choice input { display: none; }
.sub-choice { margin: 8px 0 0 26px; position: relative; }
.sub-choice::before { content: '↳'; position: absolute; left: -22px; top: 8px; font-weight: 900; color: var(--muted); }
.mlist { border: 2px solid var(--navy); border-radius: 12px; overflow: hidden; background: #fff; }
.mitem { border-top: 1px solid var(--line); }
.mitem:first-child { border-top: none; }
.mitem.open { background: #fffaf0; box-shadow: inset 5px 0 0 var(--mustard); }
.mlist .mrow { display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 9px 12px; }
.mlist .mv { display: flex; flex-direction: column; gap: 2px; }
.mnm b { display: block; font-size: 1.02em; }
.mchips { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 3px; }
.mpanel { margin: 0 12px 12px 56px; padding: 4px 16px 14px; background: #fff; border: 2px solid var(--mustard); border-radius: 12px; }
label.chk { display: flex; gap: 10px; align-items: flex-start; margin-top: 14px; padding: 10px 12px; border: 1.5px dashed var(--line); border-radius: 10px; cursor: pointer; font-size: .92em; line-height: 1.5; }
label.chk input { width: 18px; height: 18px; margin-top: 2px; flex: none; }
.mlist .mrow .mv button, .shotrow .ops button { font: inherit; border: 1.5px solid var(--line); background: #fff; border-radius: 7px; padding: 2px 7px; cursor: pointer; font-size: .82em; }
.shotrow { display: grid; grid-template-columns: 96px 1fr auto; gap: 10px; align-items: center; padding: 8px 0; border-bottom: 1px dashed var(--line); }
.shotrow img { width: 96px; height: 64px; object-fit: cover; object-position: top; border: 1.5px solid var(--navy); border-radius: 8px; background: #fff; }
.hgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.hcard { background: var(--card); border: 2px solid var(--navy); border-radius: 14px; box-shadow: 3px 3px 0 var(--navy); padding: 14px 18px 16px; }
.hcard h3 { display: flex; align-items: center; gap: 8px; font-size: 1.08em; margin-bottom: 8px; padding-bottom: 8px; border-bottom: 2px dashed var(--line); }
.hcard h3 span { font-size: 1.3em; }
.hl-list { margin: 0; padding-left: 1.2em; }
.hl-list li { margin: 6px 0; line-height: 1.7; font-size: .95em; }
.htab { width: 100%; border-collapse: collapse; font-size: .93em; }
.htab th { text-align: left; vertical-align: top; width: 92px; padding: 8px 10px 8px 0; line-height: 1.5; white-space: nowrap; }
.htab td { padding: 8px 0; line-height: 1.9; border-top: 1px dashed var(--line); }
.htab tr:first-child td { border-top: none; }
.howto3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 10px 0; }
.empty-s { text-align: center; color: var(--muted); padding: 30px 0; }

@media (max-width: 900px) {
  .ed { grid-template-columns: minmax(0, 1fr); }
  .side { position: static; order: -1; }
  .savebar { flex-direction: row; flex-wrap: wrap; position: fixed; left: 0; right: 0; bottom: 0; z-index: 50; background: var(--card); border-top: 3px solid var(--navy); padding: 10px 12px; }
  .side .save-panel { padding: 0; border: none; box-shadow: none; }
  .r, .rh { grid-template-columns: 34px minmax(0, 1fr) auto; }
  .rh { display: none; }
  .r .c-mode, .r .c-health { grid-column: 2 / 4; }
  .r .c-sw { grid-column: 3; grid-row: 1; }
  .r .ops { grid-column: 2 / 4; justify-content: flex-start; }
}
@media (max-width: 640px) {
  .atop .who { display: none; }
  .atop { gap: 6px; padding: 7px 10px; }
  .atop a, .atop button { padding: 3px 8px; font-size: .8em; }
  .mlist .mrow { grid-template-columns: 30px minmax(0, 1fr); }
  .mlist .mrow > .mops { grid-column: 2; }
  .mpanel { margin-left: 12px; }
  .jump { top: 0; position: static; }
  .banner { top: 0; }
  .grid2, .choice, .choice.three, .howto3, .hgrid { grid-template-columns: 1fr; }
  .drow { grid-template-columns: 54px 1fr; }
  .mt th:nth-child(3), .mt td:nth-child(3) { display: none; }
}
</style>
</head>
<body>
<div class="atop">
  <div class="brand"><small>TEACHER GALLERY · ADMIN</small>🔧 教師展覽館管理</div>
  <span class="conn" id="conn" title="和 Firebase 資料庫的連線"><i></i><span>連線中…</span></span>
  <span class="sp"></span>
  <span id="topLinks"></span>
</div>
<div class="awrap" id="app"><p class="muted" style="text-align:center;margin-top:20vh">載入中…</p></div>

<script src="data.js?v=20261108a"></script>
<script src="drafts.js?v=20261108a"></script>

</body>
