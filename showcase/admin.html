<style>
/* ===== 🔧 展覽館管理頁（只有巫魚子老師的管理員帳號能用） ===== */
body { padding-bottom: 60px; }
.atop { position: sticky; top: 0; z-index: 40; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; background: var(--navy); color: #fff; padding: 10px 16px; box-shadow: 0 3px 0 var(--mustard); }
.atop .brand { font-weight: 900; line-height: 1.2; }
.atop .brand small { display: block; font-family: 'Bebas Neue', sans-serif; letter-spacing: .2em; color: var(--mustard); font-size: .72em; font-weight: 400; }
.atop .sp { flex: 1; }
.atop a, .atop button { color: #fff; text-decoration: none; background: none; border: 1.5px solid rgba(255,255,255,.5); border-radius: 10px; padding: 5px 12px; font: inherit; font-weight: 700; font-size: .88em; cursor: pointer; white-space: nowrap; }
.atop .who { font-size: .82em; opacity: .8; }
.awrap { max-width: 1100px; margin: 0 auto; padding: 18px 16px; }
.tabs { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
.tabs button { font: inherit; font-weight: 800; cursor: pointer; border: 2px solid var(--navy); background: #fff; color: var(--navy); border-radius: 999px; padding: 7px 16px; }
.tabs button.on { background: var(--navy); color: #fff; }
.tabs .badge-n { display: inline-block; min-width: 20px; border-radius: 999px; background: var(--red); color: #fff; font-size: .78em; padding: 0 6px; margin-left: 4px; }
.panel { background: var(--card); border: 2px solid var(--navy); border-radius: 16px; box-shadow: 4px 4px 0 var(--navy); padding: 18px; }
.row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.grow { flex: 1; }
.muted { color: var(--muted); }
.small { font-size: .86em; }
.btn.red { background: #fff; color: var(--red); border-color: var(--red); box-shadow: 3px 3px 0 var(--red); }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
input[type=text], input[type=search], textarea, select { font: inherit; color: var(--navy); border: 2px solid #ddd3bd; border-radius: 10px; padding: 8px 10px; background: #fff; width: 100%; }
textarea { min-height: 90px; resize: vertical; line-height: 1.6; }
input:focus, textarea:focus, select:focus { outline: none; border-color: var(--mustard); }
label.f { display: block; font-weight: 800; margin: 12px 0 4px; font-size: .92em; }
.tip { display: inline-grid; place-items: center; width: 18px; height: 18px; border-radius: 50%; background: var(--navy); color: #fff; font-size: .72em; font-weight: 900; cursor: help; position: relative; vertical-align: 1px; margin-left: 4px; }
.tip::after { content: attr(data-tip); display: none; position: absolute; left: 50%; top: 24px; transform: translateX(-50%); z-index: 60; width: max-content; max-width: 280px; white-space: pre-line; background: var(--navy); color: #fff; font-weight: 500; font-size: 13px; line-height: 1.55; padding: 8px 11px; border-radius: 9px; box-shadow: 3px 3px 0 var(--mustard); text-align: left; }
.tip:hover::after, .tip:focus::after { display: block; }
.chips2 { display: flex; gap: 6px; flex-wrap: wrap; }
.chips2 button { font: inherit; font-size: .88em; font-weight: 700; cursor: pointer; border: 2px solid var(--navy); background: #fff; border-radius: 999px; padding: 4px 12px; color: var(--navy); }
.chips2 button.on { background: var(--navy); color: #fff; }
/* 卡片小首頁 */
.dsec { margin: 18px 0 8px; }
.dsec h2 { font-family: 'Noto Serif TC', serif; font-size: 1.25em; display: flex; align-items: center; gap: 8px; }
.dsec h2 .tag { font-family: 'Bebas Neue', sans-serif; letter-spacing: .12em; color: #fff; padding: 1px 10px; border-radius: 6px; font-size: .78em; }
.agrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 12px; margin-top: 8px; }
.acard { position: relative; background: #fff; border: 2px solid var(--navy); border-radius: 14px; padding: 12px; box-shadow: 3px 3px 0 var(--accent, var(--navy)); display: flex; flex-direction: column; gap: 6px; }
.acard.off { opacity: .55; border-style: dashed; box-shadow: none; background: #fbf8f2; }
.acard .top { display: flex; gap: 10px; align-items: flex-start; cursor: pointer; }
.acard .ic { flex: none; width: 40px; height: 40px; border-radius: 10px; display: grid; place-items: center; font-size: 1.35em; background: var(--soft, #f3efe6); }
.acard .nm { font-weight: 900; line-height: 1.3; }
.acard .br { color: var(--muted); font-size: .8em; line-height: 1.45; margin-top: 2px; }
.acard .meta { display: flex; gap: 4px; flex-wrap: wrap; align-items: center; font-size: .84em; }
.acard .meta .shelf-t { color: var(--muted); }
.acard .bar { display: flex; gap: 6px; align-items: center; border-top: 1px dashed var(--line); padding-top: 8px; }
.acard .bar button { font: inherit; font-size: .85em; border: 1.5px solid var(--line); background: #fff; border-radius: 8px; padding: 3px 8px; cursor: pointer; }
.acard .bar button:hover { border-color: var(--navy); }
.acard .del { position: absolute; top: 8px; right: 8px; border: none; background: none; cursor: pointer; font-size: 1em; opacity: .5; }
.acard .del:hover { opacity: 1; }
.sw { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; font-weight: 800; font-size: .85em; user-select: none; }
.sw i { width: 38px; height: 22px; border-radius: 999px; background: #cfc8b8; position: relative; transition: background .15s; }
.sw i::after { content: ''; position: absolute; left: 3px; top: 3px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: left .15s; }
.sw.on i { background: #2e9d6a; }
.sw.on i::after { left: 19px; }
.warn { background: #fde8e1; border: 1.5px solid #f2b3a0; color: #8c2f17; border-radius: 10px; padding: 8px 12px; font-size: .9em; line-height: 1.6; margin: 8px 0; }
.okbox { background: #e3f4f1; border: 1.5px solid #9fd6cd; color: #13675d; border-radius: 10px; padding: 8px 12px; font-size: .9em; margin: 8px 0; }
.info { background: #fff1d6; border: 1.5px solid var(--mustard); border-radius: 10px; padding: 8px 12px; font-size: .9em; line-height: 1.6; margin: 8px 0; }
/* 母體工具表 */
table.mt { width: 100%; border-collapse: collapse; font-size: .92em; }
.mt th { text-align: left; background: #f3eee2; padding: 8px; font-size: .85em; }
.mt td { padding: 8px; border-top: 1px solid var(--line); vertical-align: middle; }
.mt .new { background: #fff7e6; }
.st { display: inline-block; border-radius: 999px; padding: 1px 9px; font-size: .8em; font-weight: 800; white-space: nowrap; }
.st.on { background: #2e9d6a; color: #fff; } .st.hid { background: #efedf2; color: #55515f; } .st.no { background: #fff; border: 1.5px dashed #b9b2a3; color: var(--muted); }
.st.ok { background: #e3f4f1; color: #13675d; } .st.bad { background: #fde8e1; color: #a33a1d; } .st.ext { background: #e4edf8; color: #2f5a8f; }
/* 分類 */
.drow { display: grid; grid-template-columns: 54px 1.2fr 0.8fr 1.6fr 56px auto; gap: 8px; align-items: center; padding: 8px 0; border-bottom: 1px dashed var(--line); }
.drow input[type=color] { width: 54px; height: 38px; border: 2px solid #ddd3bd; border-radius: 10px; padding: 2px; background: #fff; }
/* 編輯視窗 */
.modal { position: fixed; inset: 0; z-index: 100; background: rgba(31,42,68,.55); display: flex; align-items: flex-start; justify-content: center; padding: 3vh 12px; overflow: auto; }
.mbox { background: var(--card); border: 3px solid var(--navy); border-radius: 18px; box-shadow: 8px 8px 0 var(--navy); width: min(920px, 100%); }
.mhead { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 14px 18px; border-bottom: 2px solid var(--line); }
.mhead h3 { font-family: 'Noto Serif TC', serif; font-size: 1.3em; }
.mtabs { display: flex; gap: 6px; flex-wrap: wrap; padding: 10px 18px 0; }
.mtabs button { font: inherit; font-size: .88em; font-weight: 800; cursor: pointer; border: 2px solid var(--line); background: #fff; border-radius: 10px 10px 0 0; padding: 6px 12px; color: var(--navy); border-bottom: none; }
.mtabs button.on { border-color: var(--navy); background: var(--navy); color: #fff; }
.mbody { padding: 6px 18px 16px; border-top: 2px solid var(--navy); }
.mfoot { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; padding: 12px 18px; border-top: 2px solid var(--line); position: sticky; bottom: 0; background: var(--card); border-radius: 0 0 16px 16px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 14px; }
.modes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.modes.m2 { grid-template-columns: 1fr 1fr; }
.modes.sub { margin: 8px 0 0 28px; position: relative; }
.modes.sub::before { content: '↳'; position: absolute; left: -24px; top: 8px; font-weight: 900; color: var(--muted); }
.modes label { display: block; border: 2px solid var(--line); border-radius: 12px; padding: 10px; cursor: pointer; background: #fff; font-size: .88em; line-height: 1.5; }
.modes label b { display: block; font-size: 1.05em; }
.modes label.on { border-color: var(--navy); background: #fff7e6; box-shadow: 2px 2px 0 var(--navy); }
.modes input { display: none; }
.fromlist { display: flex; flex-wrap: wrap; gap: 6px; }
.fromlist label { display: inline-flex; align-items: center; gap: 4px; border: 1.5px solid var(--line); border-radius: 999px; padding: 3px 10px; font-size: .85em; cursor: pointer; background: #fff; }
.shotrow { display: grid; grid-template-columns: 96px 1fr auto; gap: 10px; align-items: center; padding: 8px 0; border-bottom: 1px dashed var(--line); }
.shotrow img { width: 96px; height: 64px; object-fit: cover; object-position: top; border: 1.5px solid var(--navy); border-radius: 8px; background: #fff; }
.shotrow .ops button { font: inherit; border: 1.5px solid var(--line); background: #fff; border-radius: 8px; padding: 3px 8px; cursor: pointer; }
.toast { position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%); z-index: 300; background: var(--navy); color: #fff; padding: 10px 18px; border-radius: 12px; font-weight: 700; box-shadow: 3px 3px 0 var(--mustard); max-width: 90vw; }
.toast.err { background: var(--red); }
.gate { max-width: 460px; margin: 10vh auto; }
.howto3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 10px 0; }
@media (max-width: 760px) {
  .grid2, .modes, .modes.m2, .howto3 { grid-template-columns: 1fr; }
  .modes.sub { margin-left: 22px; }
  .drow { grid-template-columns: 54px 1fr; }
  .mt th:nth-child(3), .mt td:nth-child(3) { display: none; }
}
</style>

<body>
<div class="atop">
  <div class="brand"><small>TEACHER GALLERY · ADMIN</small>🔧 教師展覽館管理</div>
  <span class="sp"></span>
  <span id="topLinks"></span>
</div>
<div class="awrap" id="app"><p class="muted" style="text-align:center;margin-top:20vh">載入中…</p></div>

<script src="../account/staff.js?v=20261024a"></script>
<script src="data.js?v=20261028a"></script>
<script src="drafts.js?v=20261028a"></script>
<script src="showcase.js?v=20261028c"></script>
<script type="module">
/* =========================================================
   🔧 教師展覽館管理頁（2026-10-28）
   - 只有管理員（puff0223@gmail.com，Google 登入）能改；資料在 Firebase showcase/pub、showcase/img
   - 「事務所工具」清單直接讀事務所首頁 index.html 的 TOOLS（首頁新增工具，這裡自動出現）
   - 存檔＝展覽館馬上更新；社群分享頁與預覽圖由 GitHub 每 30 分鐘檢查 rev 後自動重做
   ========================================================= */
const SC = window.SHOWCASE, W = window.WuStaff, esc = SC.esc;
const $ = (s, el) => (el || document).querySelector(s), $$ = (s, el) => Array.from((el || document).querySelectorAll(s));
const tip = (t) => `<span class="tip" tabindex="0" data-tip="${esc(t)}">?</span>`;
const toast = (m, err) => { const t = document.createElement('div'); t.className = 'toast' + (err ? ' err' : ''); t.textContent = m; document.body.appendChild(t); setTimeout(() => t.remove(), err ? 5000 : 2800); };
const rid = (n) => { const c = 'abcdefghijklmnopqrstuvwxyz0123456789', a = new Uint32Array(n); crypto.getRandomValues(a); return Array.from(a, (v) => c[v % c.length]).join(''); };
const clean = (o) => JSON.parse(JSON.stringify(o, (k, v) => (v === undefined ? null : v)));
/* 展覽館上的兩層設定（老師 2026-10-28 決定）：
   第 1 層：看得見／看不見（卡片上的開關，資料欄位 on）
   第 2 層（看得見時）：👀 只展示（只能看說明）／✅ 開放使用 → 🔐 要申請帳號（apply）或 🚀 不用申請（open）
   資料欄位 mode 仍是 show／apply／open，舊資料不用改 */
const MODE_INFO = {
  show: ['👀 只展示', '其他老師只看得到說明和截圖，不能使用。想用的人請私訊你。'],
  apply: ['🔐 開放申請', '其他老師到會員中心申請帳號，你核准後才能用。適合要存資料、要登入的系統。'],
  open: ['🚀 開放使用・免申請', '不用帳號，其他老師按一下就能直接用。適合免登入的小工具。']
};
const SEE = (on) => (on ? '👁️ 看得見' : '🙈 看不見');
const S = { user: null, pub: null, tools: [], mDrawers: [], tab: localStorage.getItem('sca-tab') || 'items', filter: 'all', q: '', safety: {}, edit: null };
let FB;

/* ---------- 登入 ---------- */
async function boot() {
  try { const M = await import('../account/fb.js?v=20261020a'); FB = await M.openFirebase('showcase'); S.M = M; }
  catch (e) { $('#app').innerHTML = `<div class="panel gate"><h2>😵 連不上 Firebase</h2><p class="muted">請確認網路後重新整理。（${esc(e.message || e)}）</p></div>`; return; }
  FB.onUser(async (u) => { S.user = u; if (!u) return renderLogin(); if (!W.isAdmin(u)) return renderNotAdmin(); await loadAll(); });
}
function topLinks() {
  $('#topLinks').innerHTML = S.user && W.isAdmin(S.user)
    ? `<span class="who">${esc(S.user.email)}</span> <a href="./" target="_blank" rel="noopener">👀 看展覽館 ↗</a> <a href="../index.html">🏠 事務所首頁</a> <button id="out">登出</button>`
    : (S.user ? '<button id="out">登出</button>' : '');
  const o = $('#out'); if (o) o.onclick = () => FB.logout();
}
function renderLogin(err) {
  topLinks();
  $('#app').innerHTML = `<div class="panel gate"><h2 style="font-family:'Noto Serif TC',serif">🔐 管理員登入</h2>
    <p class="muted small" style="margin:6px 0 14px">這一頁只有巫魚子老師的管理員帳號可以使用。</p>
    ${S.M.googleButtonHTML('gG', '使用 Google 帳號登入')}
    <label class="f">Email</label><input type="text" id="lE" autocomplete="username"><label class="f">密碼</label><input type="password" id="lP" style="font:inherit;border:2px solid #ddd3bd;border-radius:10px;padding:8px 10px;width:100%">
    <div class="row" style="margin-top:14px"><button class="btn" id="lGo">登入</button></div>${err ? `<div class="warn">${esc(err)}</div>` : ''}</div>`;
  $('#gG').onclick = async () => { try { await FB.google(); } catch (e) { renderLogin(S.M.authErr(e)); } };
  $('#lGo').onclick = async () => { try { await FB.login($('#lE').value.trim(), $('#lP').value); } catch (e) { renderLogin(S.M.authErr(e)); } };
}
function renderNotAdmin() {
  topLinks();
  $('#app').innerHTML = `<div class="panel gate"><h2>🙅 這個帳號不能管理展覽館</h2><p class="muted" style="margin-top:8px">目前登入：${esc(S.user.email)}。只有巫魚子老師的管理員帳號可以使用這一頁。</p><div class="row" style="margin-top:12px"><a class="btn ghost" href="./">← 回教師展覽館</a></div></div>`;
}

/* ---------- 讀資料：展覽館（Firebase）＋事務所首頁的工具清單 ---------- */
async function loadAll() {
  topLinks();
  $('#app').innerHTML = '<p class="muted" style="text-align:center;margin-top:16vh">讀取展覽館與事務所工具…</p>';
  try { S.pub = SC.normalize(await FB.get('showcase/pub')); } catch (e) { return toast('讀取展覽館失敗：' + (e.code || e.message), true); }
  try { await loadTools(); } catch (e) { S.tools = []; toast('讀不到事務所首頁的工具清單（' + e.message + '）', true); }
  if (!S.pub.rev) return renderWelcome();
  SC.setPub(S.pub, 'admin');
  render();
}
async function loadTools() {
  const html = await (await fetch('../index.html', { cache: 'no-store' })).text();
  const a = html.indexOf('const TOOLS = ['), b = html.indexOf('\n];', a);
  if (a < 0 || b < 0) throw new Error('找不到 TOOLS');
  S.tools = JSON.parse(html.slice(a + 'const TOOLS = '.length, b + 2));
  const d = html.slice(html.indexOf('const DRAWERS = ['), html.indexOf('];', html.indexOf('const DRAWERS = [')));
  S.mDrawers = Array.from(d.matchAll(/name:\s*'([^']+)'/g), (m) => m[1]);
}
function renderWelcome() {
  const seed = SC.seedPub(), n = Object.keys(seed.list).length, on = Object.values(seed.list).filter((l) => l.on).length;
  $('#app').innerHTML = `<div class="panel" style="max-width:640px;margin:6vh auto"><h2 style="font-family:'Noto Serif TC',serif">🌱 第一次使用：把展覽館搬進資料庫</h2>
    <p style="margin:10px 0;line-height:1.8">按下去之後，展覽館的內容會存進 Firebase，之後就由你在這一頁自己管理。</p>
    <div class="info">會匯入 <b>${on}</b> 個目前展覽館上看得見的系統（說明、截圖都保留，已分享出去的網址不變），以及 <b>${n - on}</b> 個 Claude 寫好初版、<b>先設成看不見</b>的工具。</div>
    <div class="row" style="margin-top:12px"><button class="btn" id="seed">🌱 匯入並開始管理</button></div></div>`;
  $('#seed').onclick = async () => {
    $('#seed').disabled = true;
    const p = SC.seedPub(); p.rev = Date.now();
    try { await FB.set('showcase/pub', clean(p)); toast('✅ 匯入完成'); await loadAll(); }
    catch (e) { $('#seed').disabled = false; toast('匯入失敗：' + (e.code || e.message), true); }
  };
}

/* ---------- 存檔：只寫有改的地方＋更新 rev ---------- */
async function save(paths, msg) {
  const rev = Date.now(), up = clean(Object.assign({}, paths, { rev }));
  await FB.update('showcase/pub', up);
  Object.entries(paths).forEach(([p, v]) => { const ks = p.split('/'); let o = S.pub; ks.slice(0, -1).forEach((k) => { o = o[k] = o[k] || {}; }); if (v === null) delete o[ks[ks.length - 1]]; else o[ks[ks.length - 1]] = clean(v); });
  S.pub.rev = rev; SC.setPub(S.pub, 'admin');
  if (msg !== false) toast(msg || '💾 已儲存，展覽館已更新');
}

/* ---------- 首頁連結安全檢查（「直接開啟」的頁面不能有回事務所首頁的按鈕） ---------- */
const HOME_RE = /回事務所首頁|返回工具箱首頁|href="(\.\.\/)+(index\.html)?"|href="\/wuyutzu-tools\/?(index\.html)?"/;
function safety(url) {
  url = String(url || '').trim();
  if (!url) return Promise.resolve('none');
  if (/^https?:\/\//.test(url)) return Promise.resolve('ext');
  if (S.safety[url]) return S.safety[url];
  return (S.safety[url] = fetch('../' + url.replace(/^\/+/, ''), { cache: 'no-store' }).then((r) => (r.ok ? r.text() : Promise.reject(new Error(r.status))))
    .then((t) => (HOME_RE.test(t) ? 'bad' : 'ok')).catch(() => 'missing'));
}
const SAFE_TXT = { ok: '<span class="st ok">✅ 可以免申請開放</span>', bad: '<span class="st bad">⚠️ 頁面有回首頁按鈕</span>', ext: '<span class="st ext">🌐 外部網站</span>', missing: '<span class="st bad">❓ 找不到頁面</span>', none: '' };

/* ---------- 主畫面 ---------- */
function render() {
  topLinks();
  const L = S.pub.list, ids = Object.keys(L), on = ids.filter((i) => L[i].on).length;
  const fresh = S.tools.filter((t) => !ids.some((i) => (L[i].from || []).includes(t.id))).length;
  const TABS = [['items', `🖼️ 展出的系統`], ['tools', `🧰 事務所工具${fresh ? `<span class="badge-n">${fresh}</span>` : ''}`], ['drawers', '🗂️ 分類'], ['help', '❓ 使用說明']];

/* 🖼️ 展出的系統：卡片小首頁（分類 → 小分類 → 卡片），開關、▲▼、✏️、🗑 */

        <div class="bar"><span class="sw ${l.on ? 'on' : ''}" data-tog="${esc(id)}" title="展覽館上看不看得見"><i></i>${SEE(l.on)}</span><span class="grow"></span>

const nextOrder = () => Math.max(0, ...Object.values(S.pub.list).map((l) => +l.order || 0)) + 1;
async function canShow(l) {

}

      <div class="grid2"><div><label class="f">分類（抽屜）</label><select data-l="drawer">${DR.map((d) => `<option value="${esc(d.id)}" ${l.drawer === d.id ? 'selected' : ''}>${esc(d.name)}</option>`).join('')}</select></div>
        <div><label class="f">小分類${tip('同一個抽屜裡的分組標題，例如「課堂遊戲化」。可以留空。')}</label><input type="text" data-l="shelf" value="${esc(l.shelf || '')}" list="shelfL" maxlength="20"><datalist id="shelfL">${shelves(l.drawer).map((s) => `<option>${esc(s)}</option>`).join('')}</datalist></div></div>
      <label class="f">展覽館上看得見嗎？</label><div class="modes m2"><label class="${l.on ? '' : 'on'}"><input type="radio" name="see" value="0" ${l.on ? '' : 'checked'}><b>🙈 看不見</b>先藏起來，只有你在管理頁看得到。</label><label class="${l.on ? 'on' : ''}"><input type="radio" name="see" value="1" ${l.on ? 'checked' : ''}><b>👁️ 看得見</b>放在展覽館上給其他老師看。</label></div>
      <label class="f">其他老師可以怎麼用？${tip('看不見的時候也可以先設定好，打開「看得見」時就照這個設定。')}</label>
      <div class="modes m2"><label class="${l.mode === 'show' ? 'on' : ''}"><input type="radio" name="use" value="show" ${l.mode === 'show' ? 'checked' : ''}><b>${MODE_INFO.show[0]}</b>${MODE_INFO.show[1]}</label>
        <label class="${l.mode !== 'show' ? 'on' : ''}"><input type="radio" name="use" value="use" ${l.mode !== 'show' ? 'checked' : ''}><b>✅ 開放使用</b>其他老師可以拿去自己的課堂用。</label></div>
      ${l.mode !== 'show' ? `<div class="modes m2 sub"><label class="${l.mode === 'apply' ? 'on' : ''}"><input type="radio" name="mode" value="apply" ${l.mode === 'apply' ? 'checked' : ''}><b>🔐 要申請帳號</b>${MODE_INFO.apply[1]}</label>
        <label class="${l.mode === 'open' ? 'on' : ''}"><input type="radio" name="mode" value="open" ${l.mode === 'open' ? 'checked' : ''}><b>🚀 不用申請，直接打開</b>${MODE_INFO.open[1]}</label></div>` : ''}
      <div id="modeExtra"></div>
      <label class="f">對應的事務所工具${tip('勾選後，「🧰 事務所工具」分頁就知道這個工具已經加入展覽館。')}</label>
      <div class="fromlist">${S.tools.map((t) => `<label><input type="checkbox" data-from="${esc(t.id)}" ${l.from.includes(t.id) ? 'checked' : ''}>${esc(t.icon)} ${esc(t.name)}</label>`).join('')}</div>
      <p class="muted small" style="margin-top:10px">網址代號：<b>${esc(id)}</b>（說明頁 guide.html?app=${esc(id)}、分享頁 share/${esc(id)}.html，建立後不能改）</p>`;

      ${field('intro', '簡介', '說明頁最上面的一段介紹，3～5 句最好。' + BOLD, 5)}
      ${lineField('facts', 2, '快速資訊（小方塊）', '一行一個：標題｜內容\n例：適合｜高一化學\n例：學生要準備｜手機', 4)}

      ${lineField('links', 2, '額外按鈕（選填）', '一行一個：按鈕文字｜網址（https:// 開頭）\n分享頁不會顯示這些按鈕。', 2)}`;

      ${lineField('feats', 3, '主要功能', '一行一個：圖示｜功能名稱｜一句話說明\n例：📊｜能力分析｜依難度統計答對率', 7)}

    if (E.tab === 'sides') return `${oneField('student', '👩‍🎓 學生端', '一行一點')}${oneField('teacher', '👨‍🏫 老師端', '一行一點')}${oneField('prep', '🧰 開始前要準備', '一行一點')}`;
    if (E.tab === 'faq') return lineField('faq', 2, '常見問題', '一行一題：問題｜回答\n例：要付費嗎？｜不用，免費使用。', 10);
    return `<div class="info small">📸 可以一次選好幾張。會自動壓縮成網頁用的大小；寬度小於 600 的（手機截圖）會放在「📱 學生端」那一區。<b>畫面裡的學生姓名請用假名。</b></div>
      <div class="row"><label class="btn small"><input type="file" id="upl" accept="image/*" multiple hidden>⬆️ 上傳截圖</label><span id="uplMsg" class="muted small"></span></div>
      <div id="shotList">${it.shots.length ? it.shots.map((s, i) => `<div class="shotrow"><img data-src="${esc(s[0])}" alt=""><div><input type="text" data-cap="${i}" value="${esc(s[1] || '')}" placeholder="圖說"><div class="muted small">${s[2] && s[2] < 600 ? '📱 手機畫面' : '💻 電腦畫面'}・${s[2] || '?'}×${s[3] || '?'}${String(s[0]).startsWith('f:') ? '・你上傳的' : '・Claude 拍的'}</div></div>
        <div class="ops"><button data-smv="${i}" data-d="-1">▲</button> <button data-smv="${i}" data-d="1">▼</button> <button data-sdel="${i}">🗑</button></div></div>`).join('') : '<p class="muted" style="padding:14px 0">還沒有截圖。</p>'}</div>`;
  }
  function paint() {
    md.innerHTML = `<div class="mbox"><div class="mhead"><h3>${esc(l.icon)} ${esc(l.name)}</h3><span class="sw ${l.on ? 'on' : ''}" id="eOn" title="展覽館上看不看得見"><i></i>${SEE(l.on)}</span><span class="grow"></span>
        ${S.pub.list[id] ? `<a class="btn small ghost" href="guide.html?app=${encodeURIComponent(id)}&preview=1" target="_blank" rel="noopener">👀 預覽說明頁 ↗</a>` : ''}</div>
      <div class="mtabs">${TABS.map(([k, n]) => `<button data-et="${k}" class="${E.tab === k ? 'on' : ''}">${n}</button>`).join('')}</div>
      <div class="mbody">${body()}</div>
      <div class="mfoot"><button class="btn" id="eSave">💾 儲存</button><button class="btn ghost" id="eSaveX">儲存並關閉</button><span class="grow"></span><span class="muted small" id="eDirty">${E.dirty ? '● 有還沒儲存的修改' : ''}</span><button class="btn ghost" id="eX">關閉</button></div></div>`;
    $$('[data-et]', md).forEach((b) => { b.onclick = () => { collect(); E.tab = b.dataset.et; paint(); }; });
    $$('input, textarea, select', md).forEach((x) => { x.addEventListener('input', () => { E.dirty = true; $('#eDirty', md).textContent = '● 有還沒儲存的修改'; }); });
    $$('[name=mode]', md).forEach((r) => { r.onchange = () => { collect(); l.mode = r.value; paint(); }; });
    $$('[name=use]', md).forEach((r) => { r.onchange = () => { collect(); l.mode = r.value === 'show' ? 'show' : (l.app && (W.APPS || {})[l.app] ? 'apply' : (l.url ? 'open' : 'apply')); paint(); }; });
    $$('[name=see]', md).forEach((r) => { r.onchange = () => { collect(); l.on = r.value === '1'; paint(); }; });
    const dsel = $('[data-l="drawer"]', md); if (dsel) dsel.onchange = () => { collect(); paint(); };
    $('#eOn', md).onclick = () => { collect(); l.on = !l.on; E.dirty = true; paint(); };
    $('#eSave', md).onclick = () => doSave(false); $('#eSaveX', md).onclick = () => doSave(true);
    $('#eX', md).onclick = () => { collect(); if (E.dirty && !confirm('有還沒儲存的修改，確定要關閉嗎？')) return; md.remove(); S.edit = null; render(); };
    if (E.tab === 'card') modeExtra();
    if (E.tab === 'shots') shotsWire();
  }
  function modeExtra() {
    const box = $('#modeExtra', md);
    if (l.mode === 'apply') {
      box.innerHTML = `<label class="f">會員中心的系統代號${tip('其他老師申請時要勾的系統。新的需要帳號的系統，要先請 Claude 接上會員中心才會出現在這裡。')}</label>
        <select data-l="app"><option value="">（請選擇）</option>${Object.entries(APPS).map(([k, a]) => `<option value="${esc(k)}" ${l.app === k ? 'selected' : ''}>${esc(a.name)}（${esc(k)}）</option>`).join('')}</select>
        ${l.app && !APPS[l.app] ? '<div class="warn">這個系統代號已經不在會員中心了。</div>' : ''}`;
    } else if (l.mode === 'open') {
      box.innerHTML = `<label class="f">工具網址${tip('站內網址從網站根目錄寫起，例如 gamification/picker.html；外部網站寫完整 https:// 網址。')}</label><input type="text" data-l="url" value="${esc(l.url || '')}"><div id="safeBox" class="small muted" style="margin-top:6px">檢查中…</div>`;
      const run = () => safety($('[data-l="url"]', md).value).then((s) => { const b = $('#safeBox', md); if (!b) return; b.innerHTML = s === 'bad' ? '<div class="warn">⚠️ 這個頁面有「回事務所首頁」的按鈕，其他老師點了會看到你的私人首頁。請改成「👀 只展示」或「🔐 要申請帳號」，或請 Claude 拿掉那顆按鈕。</div>' : s === 'ok' ? '<div class="okbox">✅ 頁面沒有回事務所首頁的按鈕，可以免申請開放。</div>' : s === 'ext' ? '<div class="okbox">🌐 外部網站，會在新分頁打開。</div>' : '<div class="warn">❓ 找不到這個頁面，請確認網址。</div>'; });
      run(); $('[data-l="url"]', md).addEventListener('change', run);
    } else box.innerHTML = '';
  }
  function shotsWire() {
    $$('img[data-src]', md).forEach((im) => { const s = im.dataset.src; if (s.startsWith('f:')) SC.fimg(s.slice(2), false).then((d) => { if (d) im.src = d; }); else im.src = SC.thumb(s); });
    $$('[data-cap]', md).forEach((x) => { x.oninput = () => { it.shots[+x.dataset.cap][1] = x.value; E.dirty = true; }; });
    $$('[data-smv]', md).forEach((b) => { b.onclick = () => { const i = +b.dataset.smv, j = i + +b.dataset.d; if (j < 0 || j >= it.shots.length) return; [it.shots[i], it.shots[j]] = [it.shots[j], it.shots[i]]; E.dirty = true; paint(); }; });
    $$('[data-sdel]', md).forEach((b) => { b.onclick = () => { const s = it.shots[+b.dataset.sdel]; if (!confirm('刪除這張截圖？')) return; it.shots.splice(+b.dataset.sdel, 1); if (String(s[0]).startsWith('f:')) (E.gone = E.gone || []).push(s[0].slice(2)); E.dirty = true; paint(); }; });
    $('#upl', md).onchange = async (e) => {
      const files = Array.from(e.target.files || []); if (!files.length) return;
      for (let k = 0; k < files.length; k++) {
        $('#uplMsg', md).textContent = `壓縮並上傳第 ${k + 1}／${files.length} 張…`;
        try { const r = await compress(files[k]); const iid = rid(14); await FB.set('showcase/img/' + iid, { data: r.data, t: r.t }); it.shots.push(['f:' + iid, files[k].name.replace(/\.[^.]+$/, ''), r.w, r.h]); E.dirty = true; }
        catch (err) { toast(`「${files[k].name}」上傳失敗：${err.message || err}`, true); }
      }
      paint(); toast('📸 上傳完成，記得按 💾 儲存');
    };
  }
  function collect() {
    $$('[data-l]', md).forEach((x) => { l[x.dataset.l] = x.value.trim(); });
    $$('[data-it]', md).forEach((x) => { it[x.dataset.it] = x.value.trim(); });
    $$('[data-lines]', md).forEach((x) => { const k = x.dataset.lines, n = +x.dataset.n; it[k] = PARSE(x.value, n, k === 'flow' ? (a) => { a[3] = /學|^s$/i.test(a[3]) ? 's' : 't'; return a; } : null); });
    $$('[data-one]', md).forEach((x) => { it[x.dataset.one] = PONE(x.value); });
    if ($$('[data-from]', md).length) l.from = $$('[data-from]', md).filter((c) => c.checked).map((c) => c.dataset.from);
  }
  async function doSave(close) {
    collect();
    if (!l.name.trim()) return toast('請填系統名稱', true);
    if (l.on) { const why = await canShow(l); if (why) { E.tab = 'card'; paint(); return toast(why, true); } }
    const item = {}; Object.entries(it).forEach(([k, v]) => { if (Array.isArray(v) ? v.length : v) item[k] = v; });
    const lst = Object.assign({}, l); if (lst.mode !== 'apply') lst.app = ''; if (lst.mode !== 'open' && !lst.url) lst.url = '';
    try {
      await save({ [`list/${id}`]: lst, [`items/${id}`]: item }, l.on ? '💾 已儲存，展覽館已更新' : '💾 已儲存（目前展覽館看不見）');
      for (const g of E.gone || []) await FB.remove('showcase/img/' + g).catch(() => {});
      E.gone = []; E.dirty = false; E.isNew = false;
      if (close) { md.remove(); S.edit = null; render(); } else paint();
    } catch (e) { toast('儲存失敗：' + (e.code || e.message), true); }
  }
  paint();
}

/* ---------- 截圖壓縮：最長邊 1200、WebP（不支援就 JPEG），超過大小就降品質；縮圖一半大小 ---------- */
async function compress(file) {
  const img = await new Promise((ok, bad) => { const u = URL.createObjectURL(file), i = new Image(); i.onload = () => { URL.revokeObjectURL(u); ok(i); }; i.onerror = () => bad(new Error('不是圖片檔')); i.src = u; });
  const draw = (w) => { const c = document.createElement('canvas'); c.width = w; c.height = Math.round(img.height * w / img.width); c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); return c; };
  const enc = (c, q) => { let d = c.toDataURL('image/webp', q); if (!d.startsWith('data:image/webp')) d = c.toDataURL('image/jpeg', q); return d; };
  let w = Math.min(1200, img.width), c = draw(w), q = 0.82, data = enc(c, q);
  while (data.length > 430000 && (q > 0.45 || w > 600)) { if (q > 0.45) q -= 0.08; else { w = Math.round(w * 0.8); c = draw(w); } data = enc(c, q); }
  if (data.length > 430000) throw new Error('圖片太大，請先裁小一點');
  const tw = w >= 600 ? 600 : 240, t = enc(draw(Math.min(tw, w)), 0.76);
  return { data, t, w, h: c.height };
}
