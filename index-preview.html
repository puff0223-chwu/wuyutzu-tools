<head>
<meta charset="UTF-8">

<style>
  :root {
    --cream: #fbf6ec;      /* 偵探筆記本的米白 */
    --card: #ffffff;
    --navy: #1f2a44;       /* 偵探大衣深藍 */
    --navy-2: #34405e;
    --mustard: #f2b134;    /* 放大鏡黃銅（亮版） */
    --red: #e4572e;        /* 線索紅 */
    --teal: #1f9e8f;       /* 化學藍綠 */
    --plum: #7b5ea7;       /* 遊戲紫 */
    --line: #ece3d2;
    --muted: #6d6a75;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Noto Sans TC', 'Microsoft JhengHei', sans-serif;
    color: var(--navy); background-color: var(--cream);
    background-image: radial-gradient(ellipse at 50% -20%, rgba(242,177,52,0.18), transparent 55%);
    min-height: 100vh; padding: 0 16px 40px;
  }
  .wrap { max-width: 1080px; margin: 0 auto; }
  .hidden { display: none !important; }

  /* ===== 招牌 ===== */
  header { display: flex; align-items: center; gap: 18px; padding: 34px 0 22px; }
  .badge {
    flex: none; width: 76px; height: 76px; border-radius: 50%;
    background: var(--mustard); display: grid; place-items: center;
    box-shadow: 0 0 0 3px var(--navy), 0 6px 14px rgba(31,42,68,0.18);
  }
  .eyebrow { font-family: 'Bebas Neue', sans-serif; letter-spacing: 0.18em; color: var(--red); font-size: 1.05em; }
  h1 { font-family: 'Noto Serif TC', serif; font-weight: 900; font-size: clamp(1.9em, 6vw, 2.9em); letter-spacing: 0.06em; line-height: 1.15; }
  h1 .hl { background: linear-gradient(transparent 62%, rgba(242,177,52,0.65) 62%); padding: 0 2px; }
  .tagline { color: var(--muted); margin-top: 4px; font-size: 0.95em; }

  /* ===== 搜尋 ===== */
  .tools { position: sticky; top: 0; z-index: 20; padding: 10px 0 12px; background: linear-gradient(var(--cream) 80%, rgba(251,246,236,0)); }
  .search {
    display: flex; align-items: center; gap: 10px; background: var(--card);
    border: 1.5px solid #ddd2bf; border-radius: 12px; padding: 4px 6px 4px 14px;
    box-shadow: 0 2px 10px rgba(31,42,68,0.06);
  }
  .search:focus-within { border-color: var(--navy); }
  .search input { flex: 1; min-width: 0; border: none; background: transparent; font: inherit; font-size: 1.05em; color: var(--navy); outline: none; padding: 9px 0; }
  .search input::placeholder { color: #9a96a3; }
  .search .clear { border: none; background: var(--navy); color: #fff; border-radius: 9px; padding: 7px 12px; font: inherit; font-size: 0.85em; cursor: pointer; }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
  .chip {
    font: inherit; font-size: 0.9em; font-weight: 700; cursor: pointer; color: var(--navy);
    background: var(--card); border: 1px solid #ddd2bf; border-radius: 999px; padding: 5px 14px;
  }
  .chip.on { background: var(--navy); color: #fff; border-color: var(--navy); }
  .chip .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; vertical-align: 1px; }
  .count { margin-left: auto; align-self: center; color: var(--muted); font-size: 0.88em; }

  /* ===== 抽屜 ===== */
  .drawer { margin: 22px 0 30px; }
  .drawer-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; margin-bottom: 4px; }
  .drawer-head h2 { white-space: nowrap; font-family: 'Noto Serif TC', serif; font-weight: 900; font-size: 1.45em; }
  .drawer-head .tag { white-space: nowrap; font-family: 'Bebas Neue', sans-serif; letter-spacing: 0.12em; color: #fff; padding: 1px 10px; border-radius: 6px; font-size: 0.95em; }
  .drawer-head .desc { color: var(--muted); font-size: 0.88em; }
  .shelf { color: var(--muted); font-size: 0.85em; font-weight: 700; letter-spacing: 0.06em; margin: 14px 0 10px; }

  /* ===== 工具卡 ===== */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 14px; }
  .card {
    position: relative; display: flex; gap: 12px; align-items: flex-start; text-align: left;
    background: var(--card); color: var(--navy); font: inherit; cursor: pointer;
    border: 1px solid #e6dccb; border-radius: 12px; padding: 14px;
    box-shadow: 0 1px 2px rgba(31,42,68,0.05), 0 4px 12px rgba(31,42,68,0.05);
    transition: transform 0.15s, box-shadow 0.15s, border-color 0.15s;
  }
  .card:hover { transform: translateY(-2px); border-color: var(--accent, var(--navy)); box-shadow: 0 8px 20px rgba(31,42,68,0.10); }
  .card:active { transform: none; }
  .card:focus-visible { outline: 3px solid var(--mustard); outline-offset: 2px; }
  .card .icon { flex: none; width: 46px; height: 46px; border-radius: 12px; display: grid; place-items: center; font-size: 1.5em; background: var(--soft, #f3efe6); }
  .card .name { font-weight: 900; font-size: 1.05em; line-height: 1.3; }
  .card .brief { color: var(--muted); font-size: 0.84em; line-height: 1.5; margin-top: 2px; }
  .pill { display: inline-block; font-size: 0.72em; font-weight: 700; border-radius: 999px; padding: 1px 8px; margin-top: 6px; }
  .pill.case { background: var(--red); color: #fff; font-family: 'Bebas Neue', sans-serif; letter-spacing: 0.1em; font-size: 0.82em; }
  .pill.lock { background: #fff1d6; color: #8a5a00; border: 1px solid var(--mustard); }

  .empty { text-align: center; color: var(--muted); padding: 50px 0; font-weight: 700; }

  /* ===== 說明卷宗（彈窗） ===== */
  .overlay { position: fixed; inset: 0; background: rgba(31,42,68,0.55); z-index: 100; display: none; align-items: center; justify-content: center; padding: 16px; }
  .overlay.on { display: flex; }
  .dossier {
    position: relative; width: min(500px, 100%); max-height: 90vh; overflow: auto;
    background: var(--card); color: var(--navy); border-radius: 16px;
    box-shadow: 0 24px 60px rgba(31,42,68,0.35); animation: pop 0.18s ease;
  }
  @keyframes pop { from { transform: scale(0.94); opacity: 0; } to { transform: none; opacity: 1; } }
  .d-top { background: var(--accent, var(--navy)); color: #fff; padding: 18px 22px 16px; border-radius: 16px 16px 0 0; }
  .d-top .no { font-family: 'Bebas Neue', sans-serif; letter-spacing: 0.15em; opacity: 0.9; }
  .d-top h3 { font-family: 'Noto Serif TC', serif; font-weight: 900; font-size: 1.6em; display: flex; align-items: center; gap: 10px; }
  .d-top .sub { opacity: 0.92; font-size: 0.9em; margin-top: 2px; }
  .close { position: absolute; top: 12px; right: 14px; border: none; background: rgba(255,255,255,0.22); color: #fff; width: 32px; height: 32px; border-radius: 50%; font-size: 1.05em; cursor: pointer; }
  .d-body { padding: 16px 22px 20px; }
  .warn { background: #fff1d6; border: 1.5px solid var(--mustard); border-radius: 10px; padding: 8px 12px; font-size: 0.86em; margin-bottom: 12px; }
  .d-body ul { list-style: none; margin-bottom: 16px; }
  .d-body li { padding: 7px 0 7px 26px; position: relative; line-height: 1.55; font-size: 0.95em; border-bottom: 1px dashed var(--line); }
  .d-body li::before { content: '🔍'; position: absolute; left: 0; top: 7px; font-size: 0.85em; }
  .go {
    display: block; text-align: center; text-decoration: none; font-weight: 900; letter-spacing: 0.05em;
    background: var(--mustard); color: var(--navy); border-radius: 10px;
    padding: 12px; box-shadow: 0 3px 0 #c98d17;
  }
  .go:hover { filter: brightness(1.04); }
  .go:active { transform: translateY(2px); box-shadow: 0 1px 0 #c98d17; }
  .note { text-align: center; font-size: 0.84em; color: var(--muted); margin-top: 10px; }

  footer { text-align: center; color: var(--muted); font-size: 0.85em; padding: 26px 0 6px; }
  footer a { color: var(--navy); font-weight: 700; margin: 0 8px; }

  @media (max-width: 640px) {
    header { padding-top: 24px; gap: 14px; }
    .badge { width: 58px; height: 58px; }
    .badge svg { width: 30px; height: 30px; }
    .grid { grid-template-columns: 1fr; gap: 10px; }
    .count { width: 100%; margin-left: 0; }
    .drawer-head .desc { width: 100%; }
    .tagline { font-size: 0.88em; }
  }
  @media (prefers-reduced-motion: reduce) { .card, .dossier { transition: none; animation: none; } }
</style>
</head>

  {"id": "poke", "drawer": 1, "shelf": "課堂遊戲化", "icon": "🎁", "name": "戳戳樂", "brief": "6×6格子，隨機獎品，即時開獎音效", "title": "戳戳樂", "sub": "6×6格子 · 即時開獎", "features": ["上傳背景圖片，36格覆蓋展示", "老師自訂獎品內容與數量", "學生輸入座號，點格即時開獎", "中獎金色閃亮，銘謝惠顧灰底", "下載完整中獎名單 Excel"], "href": "gamification/poke-game.html", "btn": "開始使用"},
  {"id": "truthdare", "drawer": 1, "shelf": "課堂遊戲化", "icon": "🎲", "name": "真心話大冒險", "brief": "真心話開放式提問・大冒險拉霸機", "title": "真心話大冒險", "sub": "班級互動遊戲 · 兩種模式", "features": ["真心話：7大類70題，開放式問法", "大冒險：拉霸機決定任務，保證合理有趣", "對象機率：自己60%・同學30%・老師10%", "無傷大雅，適合課堂使用"], "href": "gamification/truth-or-dare.html", "btn": "開始使用"},
  {"id": "bartle", "drawer": 2, "shelf": "玩家研究", "icon": "🃏", "name": "巴圖玩家類型", "brief": "♦♠♥♣ 四種玩家風格，12題精簡或30題完整版", "title": "巴圖玩家類型測驗", "sub": "遊戲設計思考 · 玩家心理探索", "features": ["精簡版 12 題（約2分鐘）／完整版 30 題（約6分鐘）", "四種玩家類型：♦成就型・♠探索型・♥社交型・♣殺手型", "每題二選一，操作簡單直覺", "結果含四維度分數、座標軸位置圖、與其他類型的關係", "理論來源：Richard Bartle（1996）"], "href": "classroom/bartle.html", "btn": "開始測驗"}
];

const DRAWERS = [
  { name: '班級事務', tag: 'Drawer I',   desc: '行政、認識學生、班級氣氛', color: '#1f9e8f', soft: '#e3f4f1' },
  { name: '化學實驗室 No.307', tag: 'Drawer II', desc: '懸案系列與課堂遊戲化', color: '#e4572e', soft: '#fde8e1' },
  { name: '遊戲研究室', tag: 'Drawer III', desc: '遊戲設計思考課程', color: '#7b5ea7', soft: '#eee8f6' }
];

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
// 顯示用：跳脫後把體積莫耳濃度 CM 的 M 改成下標
const rich = s => esc(s).replace(/\bCM\b/g, 'C<sub>M</sub>');
let filterDrawer = -1;

// 卷宗編號：抽屜代號＋序號，例如 I-03
const ROMAN = ['I', 'II', 'III', 'IV', 'V'];
const counters = {};
TOOLS.forEach(t => { counters[t.drawer] = (counters[t.drawer] || 0) + 1; t.no = `No. ${ROMAN[t.drawer]}-${String(counters[t.drawer]).padStart(2, '0')}`; });

/* ---------- 篩選 ---------- */
$('chips').innerHTML = `<button class="chip on" data-d="-1" type="button">全部</button>` +
  DRAWERS.map((d, i) => `<button class="chip" data-d="${i}" type="button"><span class="dot" style="background:${d.color}"></span>${esc(d.name)}</button>`).join('') +
  `<span class="count" id="count"></span>`;
$('chips').querySelectorAll('.chip').forEach(b => b.onclick = () => {
  filterDrawer = +b.dataset.d;
  $('chips').querySelectorAll('.chip').forEach(x => x.classList.toggle('on', x === b));
  render();
});

/* ---------- 搜尋 ---------- */
const norm = s => String(s).toLowerCase().replace(/\s+/g, '');
function matches(t, q) {
  if (!q) return true;
  const hay = norm([t.name, t.brief, t.title, t.sub, t.shelf, DRAWERS[t.drawer].name, ...t.features, t.teacher ? '老師專用 老師頁' : '', t.case || ''].join(' '));
  return q.split(/\s+/).filter(Boolean).every(k => hay.includes(norm(k)));
}
$('q').addEventListener('input', () => { $('clear').classList.toggle('hidden', !$('q').value); render(); });
$('clear').onclick = () => { $('q').value = ''; $('clear').classList.add('hidden'); render(); $('q').focus(); };

/* ---------- 畫抽屜與卡片 ---------- */
function cardHTML(t) {
  const d = DRAWERS[t.drawer];
  const pill = t.case ? `<span class="pill case">${esc(t.case)}</span>` : t.teacher ? `<span class="pill lock">🔒 老師專用</span>` : '';
  return `<button class="card" data-id="${t.id}" type="button" style="--accent:${d.color};--soft:${d.soft}">
    <span class="icon" aria-hidden="true">${t.icon}</span>
    <span><span class="name">${esc(t.name)}</span><br><span class="brief">${rich(t.brief)}</span>${pill ? '<br>' + pill : ''}</span>
  </button>`;
}
function render() {
  const q = $('q').value.trim();
  const shown = TOOLS.filter(t => (filterDrawer < 0 || t.drawer === filterDrawer) && matches(t, q));
  let html = '';
  DRAWERS.forEach((d, di) => {
    const items = shown.filter(t => t.drawer === di);
    if (!items.length) return;
    const shelves = [...new Set(items.map(t => t.shelf))];
    html += `<section class="drawer">
      <div class="drawer-head"><span class="tag" style="background:${d.color}">${d.tag}</span><h2>${esc(d.name)}</h2><span class="desc">${esc(d.desc)}</span></div>
      ${shelves.map(s => `${shelves.length > 1 ? `<div class="shelf">${esc(s)}</div>` : '<div class="shelf"></div>'}<div class="grid">${items.filter(t => t.shelf === s).map(cardHTML).join('')}</div>`).join('')}
    </section>`;
  });
  $('drawers').innerHTML = html || `<div class="empty">🔎 查無此案……換個關鍵字再找找看吧</div>`;
  $('count').textContent = q || filterDrawer >= 0 ? `找到 ${shown.length} 份卷宗` : `共 ${TOOLS.length} 份卷宗`;
  $('drawers').querySelectorAll('.card').forEach(b => b.onclick = () => openDossier(b.dataset.id));
}

/* ---------- 打開卷宗 ---------- */
let lastFocus = null;
function openDossier(id) {
  const t = TOOLS.find(x => x.id === id);
  if (!t) return;
  const d = DRAWERS[t.drawer];
  lastFocus = document.activeElement;
  $('dossier').style.setProperty('--accent', d.color);
  $('dossier').innerHTML = `
    <div class="d-top">
      <button class="close" id="d-close" aria-label="關閉">✕</button>
      <div class="no">${t.no}${t.case ? ' · ' + esc(t.case) : ''} · ${esc(d.name)}</div>
      <h3 id="d-title"><span aria-hidden="true">${t.icon}</span>${esc(t.title)}</h3>
      <div class="sub">${rich(t.sub)}</div>
    </div>
    <div class="d-body">
      ${t.teacher ? `<div class="warn">🔒 老師專用頁面，含答案與管理功能，請勿提供給學生。</div>` : ''}
      <ul>${t.features.map(f => `<li>${rich(f)}</li>`).join('')}</ul>
      <a class="go" href="${esc(t.href)}" target="_blank" rel="noopener">${t.teacher ? '🔒 ' : ''}${esc(t.btn)} →</a>
      ${t.note ? `<p class="note">${esc(t.note)}</p>` : ''}
    </div>`;
  $('overlay').classList.add('on');
  $('d-close').onclick = closeDossier;
  $('d-close').focus();
}
function closeDossier() {
  $('overlay').classList.remove('on');
  if (lastFocus) lastFocus.focus();
}
$('overlay').addEventListener('click', e => { if (e.target === $('overlay')) closeDossier(); });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && $('overlay').classList.contains('on')) closeDossier();
  if (e.key === '/' && document.activeElement !== $('q') && !$('overlay').classList.contains('on')) { e.preventDefault(); $('q').focus(); }
});

render();
</script>
</body>
</html>
