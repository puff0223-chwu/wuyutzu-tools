<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🔎 巫魚子教課事務所</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;700;900&family=IM+Fell+English+SC&family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet">
<style>
  :root {
    --night: #1b1611;      /* 煙燻深棕：夜晚的書房 */
    --night-2: #2a221a;
    --leather: #3b2c20;    /* 皮革 */
    --paper: #efe3c8;      /* 羊皮紙 */
    --paper-2: #e6d6b3;
    --manila: #d9c294;     /* 牛皮紙卷宗 */
    --brass: #b08d57;      /* 黃銅 */
    --brass-hi: #d6b77c;
    --oxblood: #7a1f1f;    /* 酒紅封蠟 */
    --ink: #2b2420;        /* 墨水 */
    --ink-soft: #5a4a3c;
    --fog: #a8998a;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    font-family: 'Noto Sans TC', 'Microsoft JhengHei', sans-serif;
    color: var(--paper);
    background-color: var(--night);
    background-image:
      radial-gradient(ellipse at 50% -10%, rgba(214,183,124,0.22), transparent 55%),
      radial-gradient(ellipse at 50% 120%, rgba(0,0,0,0.6), transparent 60%),
      repeating-linear-gradient(90deg, rgba(255,255,255,0.018) 0 2px, transparent 2px 7px);
    min-height: 100vh;
    padding: 0 16px 40px;
  }
  .wrap { max-width: 1120px; margin: 0 auto; }
  .serif { font-family: 'Noto Serif TC', serif; }
  .fell { font-family: 'IM Fell English SC', 'Noto Serif TC', serif; letter-spacing: 0.12em; }

  /* ===== 招牌 ===== */
  header { text-align: center; padding: 44px 0 26px; }
  .emblem { width: 74px; height: 74px; margin: 0 auto 10px; }
  .eyebrow { color: var(--brass-hi); font-size: 0.95em; }
  h1 {
    font-family: 'Noto Serif TC', serif; font-weight: 900;
    font-size: clamp(2.1em, 7vw, 3.6em); letter-spacing: 0.12em;
    color: var(--paper); text-shadow: 0 2px 0 #000, 0 0 24px rgba(214,183,124,0.25);
    margin: 4px 0 6px;
  }
  .rule { display: flex; align-items: center; gap: 12px; justify-content: center; color: var(--brass); margin: 6px auto 10px; max-width: 520px; }
  .rule::before, .rule::after { content: ''; flex: 1; height: 1px; background: linear-gradient(90deg, transparent, var(--brass), transparent); }
  .tagline { color: var(--fog); font-size: 0.95em; }
  .motto { font-family: 'IM Fell English', 'Noto Serif TC', serif; font-style: italic; color: var(--brass-hi); margin-top: 10px; font-size: 1.02em; }

  /* ===== 搜尋 ===== */
  .search-bar {
    position: sticky; top: 0; z-index: 20;
    background: linear-gradient(var(--night), rgba(27,22,17,0.92));
    padding: 12px 0 10px; margin-bottom: 8px;
    backdrop-filter: blur(4px);
  }
  .search {
    display: flex; align-items: center; gap: 10px;
    background: var(--paper); color: var(--ink);
    border: 2px solid var(--brass); border-radius: 999px;
    padding: 6px 8px 6px 16px; box-shadow: 0 6px 18px rgba(0,0,0,0.45), inset 0 0 0 3px rgba(176,141,87,0.18);
  }
  .search svg { flex: none; }
  .search input { flex: 1; min-width: 0; border: none; background: transparent; font: inherit; font-size: 1.05em; color: var(--ink); outline: none; padding: 6px 0; }
  .search input::placeholder { color: #8a7a64; }
  .search .clear { border: none; background: var(--ink); color: var(--paper); border-radius: 999px; padding: 6px 12px; font: inherit; font-size: 0.85em; cursor: pointer; }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; justify-content: center; }
  .chip {
    font: inherit; font-size: 0.88em; cursor: pointer;
    background: transparent; color: var(--paper-2);
    border: 1px solid rgba(176,141,87,0.55); border-radius: 4px; padding: 5px 12px;
  }
  .chip.on { background: var(--brass); color: var(--night); border-color: var(--brass); font-weight: 700; }
  .result-note { text-align: center; color: var(--fog); font-size: 0.9em; min-height: 1.4em; margin-top: 6px; }

  /* ===== 抽屜 ===== */
  .drawer { margin: 26px 0 34px; }
  .plate {
    display: flex; align-items: center; gap: 14px;
    background: linear-gradient(180deg, #4a3826, var(--leather));
    border: 1px solid #5c4630; border-radius: 6px;
    padding: 12px 18px; box-shadow: 0 4px 0 #120d09, inset 0 1px 0 rgba(255,255,255,0.08);
  }
  .plate .label {
    background: linear-gradient(180deg, var(--brass-hi), var(--brass));
    color: var(--ink); border-radius: 3px; padding: 4px 14px;
    font-family: 'Noto Serif TC', serif; font-weight: 900; font-size: 1.15em; letter-spacing: 0.08em;
    box-shadow: inset 0 0 0 1px rgba(0,0,0,0.25), 0 1px 0 rgba(255,255,255,0.2);
  }
  .plate .no { color: var(--brass-hi); font-size: 0.85em; }
  .plate .desc { color: var(--fog); font-size: 0.85em; margin-left: auto; text-align: right; }
  .shelf-title {
    display: flex; align-items: center; gap: 10px;
    color: var(--brass-hi); font-family: 'Noto Serif TC', serif; font-weight: 700;
    margin: 20px 0 12px 4px; font-size: 1.02em;
  }
  .shelf-title::after { content: ''; flex: 1; border-bottom: 1px dashed rgba(176,141,87,0.4); }

  /* ===== 卷宗卡片 ===== */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 22px 18px; }
  .folder {
    position: relative; cursor: pointer; text-align: left;
    display: flex; flex-direction: column; align-items: flex-start; justify-content: flex-start;
    background: linear-gradient(170deg, #e8d6ab 0%, var(--manila) 60%, #cdb27d 100%);
    color: var(--ink); border: none; font: inherit;
    border-radius: 2px 8px 8px 8px; padding: 26px 16px 16px;
    margin-top: 14px;
    box-shadow: 0 8px 18px rgba(0,0,0,0.45), inset 0 0 0 1px rgba(90,70,40,0.25), inset 0 -10px 22px rgba(120,90,40,0.18);
    transition: transform 0.18s, box-shadow 0.18s;
  }
  .folder::before {             /* 卷宗標籤 */
    content: attr(data-no);
    position: absolute; top: -16px; left: 0;
    background: linear-gradient(180deg, #e8d6ab, var(--manila));
    padding: 2px 14px 0; height: 17px; line-height: 17px;
    border-radius: 6px 10px 0 0;
    font-family: 'IM Fell English SC', serif; font-size: 0.75em; letter-spacing: 0.12em; color: var(--ink-soft);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.4);
  }
  .folder:hover, .folder:focus-visible { transform: translateY(-4px) rotate(-0.4deg); box-shadow: 0 14px 26px rgba(0,0,0,0.55), inset 0 0 0 1px rgba(90,70,40,0.3); outline: none; }
  .folder:focus-visible { box-shadow: 0 0 0 3px var(--brass-hi), 0 14px 26px rgba(0,0,0,0.55); }
  .folder .icon {
    width: 52px; height: 52px; border-radius: 50%; display: grid; place-items: center; font-size: 1.6em;
    background: radial-gradient(circle at 35% 30%, #f6ecd4, #d8c294);
    border: 2px solid rgba(90,70,40,0.35); margin-bottom: 10px;
    filter: sepia(0.35) saturate(0.85);
  }
  .folder .name { font-family: 'Noto Serif TC', serif; font-weight: 900; font-size: 1.12em; margin-bottom: 4px; }
  .folder .brief { font-size: 0.86em; color: var(--ink-soft); line-height: 1.5; }
  .folder .clip { position: absolute; top: -6px; right: 18px; width: 14px; height: 34px; border: 3px solid #8e8a83; border-radius: 8px; border-bottom-color: transparent; opacity: 0.8; }

  .stamp {
    position: absolute; right: 10px; bottom: 10px;
    font-family: 'IM Fell English SC', 'Noto Serif TC', serif; font-size: 0.72em; letter-spacing: 0.1em;
    color: var(--oxblood); border: 2px solid var(--oxblood); border-radius: 4px; padding: 1px 7px;
    transform: rotate(-8deg); opacity: 0.85; background: rgba(239,227,200,0.35);
  }
  .stamp.lock { font-family: 'Noto Sans TC', sans-serif; font-weight: 700; letter-spacing: 0; }
  .folder.has-stamp { padding-bottom: 38px; }

  .empty { text-align: center; color: var(--fog); padding: 40px 0; font-family: 'Noto Serif TC', serif; }

  /* ===== 卷宗打開（彈窗） ===== */
  .overlay { position: fixed; inset: 0; background: rgba(10,7,5,0.72); z-index: 100; display: none; align-items: center; justify-content: center; padding: 16px; }
  .overlay.on { display: flex; }
  .dossier {
    position: relative; width: min(520px, 100%); max-height: 90vh; overflow: auto;
    background:
      repeating-linear-gradient(0deg, transparent 0 27px, rgba(90,70,40,0.12) 27px 28px),
      radial-gradient(ellipse at 30% 20%, #f6ecd6, var(--paper) 60%, var(--paper-2));
    color: var(--ink); border-radius: 4px;
    padding: 30px 28px 24px; box-shadow: 0 24px 60px rgba(0,0,0,0.6), inset 0 0 0 1px rgba(90,70,40,0.25);
    animation: open 0.22s ease;
  }
  @keyframes open { from { transform: translateY(14px) rotate(-1deg); opacity: 0; } to { transform: none; opacity: 1; } }
  .dossier .close { position: absolute; top: 10px; right: 12px; border: none; background: none; font-size: 1.4em; color: var(--ink-soft); cursor: pointer; }
  .dossier .file-no { color: var(--ink-soft); font-size: 0.85em; }
  .dossier h2 { font-family: 'Noto Serif TC', serif; font-weight: 900; font-size: 1.7em; margin: 4px 0 2px; display: flex; align-items: center; gap: 10px; }
  .dossier .d-sub { color: var(--ink-soft); font-size: 0.92em; margin-bottom: 14px; }
  .dossier .seal {
    position: absolute; top: 22px; right: 46px; transform: rotate(10deg);
    color: var(--oxblood); border: 3px double var(--oxblood); border-radius: 6px; padding: 2px 10px;
    font-family: 'IM Fell English SC', serif; letter-spacing: 0.15em; opacity: 0.8;
  }
  .dossier ul { list-style: none; margin: 4px 0 18px; }
  .dossier li { padding: 6px 0 6px 26px; position: relative; line-height: 1.6; border-bottom: 1px dotted rgba(90,70,40,0.3); font-size: 0.95em; }
  .dossier li::before { content: '✒'; position: absolute; left: 2px; color: var(--brass); }
  .dossier .go {
    display: block; text-align: center; text-decoration: none;
    background: linear-gradient(180deg, #8f2a2a, var(--oxblood)); color: var(--paper);
    padding: 13px; border-radius: 4px; font-weight: 700; letter-spacing: 0.08em;
    box-shadow: 0 4px 0 #3d0e0e;
  }
  .dossier .go:active { transform: translateY(2px); box-shadow: 0 2px 0 #3d0e0e; }
  .dossier .note { text-align: center; font-size: 0.85em; color: var(--ink-soft); margin-top: 10px; }
  .dossier .warn { background: rgba(122,31,31,0.1); border-left: 3px solid var(--oxblood); padding: 8px 10px; font-size: 0.85em; margin-bottom: 14px; }

  footer { text-align: center; color: var(--fog); font-size: 0.85em; padding: 30px 0 10px; border-top: 1px solid rgba(176,141,87,0.25); margin-top: 20px; }
  footer a { color: var(--brass-hi); margin: 0 8px; text-decoration: none; }
  footer a:hover { text-decoration: underline; }

  @media (max-width: 640px) {
    header { padding-top: 30px; }
    .plate { flex-wrap: wrap; }
    .plate .desc { margin-left: 0; text-align: left; width: 100%; }
    .grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 20px 12px; }
    .folder { padding: 22px 12px 14px; }
    .folder .icon { width: 44px; height: 44px; font-size: 1.35em; }
    .folder .name { font-size: 1em; }
    .folder .brief { font-size: 0.8em; }
    .dossier { padding: 26px 18px 20px; }
    .dossier .seal { display: none; }
  }
  @media (prefers-reduced-motion: reduce) { .folder, .dossier { transition: none; animation: none; } }
</style>
</head>

</div>

const DRAWERS = [
  { name: '班級事務卷宗',       no: 'Drawer I',   desc: '導師班的行政、認識學生與班級氣氛' },
  { name: '化學實驗室 No.307',  no: 'Drawer II',  desc: '化學課堂的懸案系列與遊戲化工具' },
  { name: '遊戲研究室',         no: 'Drawer III', desc: '遊戲設計思考課程的研究工具' }
];

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
let filterDrawer = -1;

// 卷宗編號：抽屜代號＋序號，例如 I-03
const ROMAN = ['I', 'II', 'III', 'IV', 'V'];
const counters = {};
TOOLS.forEach(t => { counters[t.drawer] = (counters[t.drawer] || 0) + 1; t.no = `No. ${ROMAN[t.drawer]}-${String(counters[t.drawer]).padStart(2, '0')}`; });

/* ---------- 篩選籤 ---------- */
$('chips').innerHTML = ['全部卷宗', ...DRAWERS.map(d => d.name)].map((n, i) =>
  `<button class="chip${i === 0 ? ' on' : ''}" data-d="${i - 1}" type="button">${esc(n)}</button>`).join('');
$('chips').querySelectorAll('.chip').forEach(b => b.onclick = () => {
  filterDrawer = +b.dataset.d;
  $('chips').querySelectorAll('.chip').forEach(x => x.classList.toggle('on', x === b));
  render();
});

/* ---------- 搜尋 ---------- */
const norm = s => String(s).toLowerCase().replace(/\s+/g, '');
function matches(t, q) {
  if (!q) return true;
  const hay = norm([t.name, t.brief, t.title, t.sub, t.shelf, DRAWERS[t.drawer].name, ...t.features, t.teacher ? '老師專用 老師頁' : '', t.case || ''].join(' '));
  return q.split(/\s+/).filter(Boolean).every(k => hay.includes(norm(k)));
}
$('q').addEventListener('input', () => { $('clear').classList.toggle('hidden', !$('q').value); render(); });
$('clear').onclick = () => { $('q').value = ''; $('clear').classList.add('hidden'); render(); $('q').focus(); };

/* ---------- 畫抽屜與卷宗 ---------- */
function folderHTML(t) {
  const stamp = t.case ? `<span class="stamp">${esc(t.case)}</span>` : t.teacher ? `<span class="stamp lock">🔒 老師專用</span>` : '';
  return `<button class="folder${stamp ? ' has-stamp' : ''}" data-id="${t.id}" data-no="${t.no}" type="button">
    <span class="clip" aria-hidden="true"></span>
    <div class="icon" aria-hidden="true">${t.icon}</div>
    <div class="name">${esc(t.name)}</div>
    <div class="brief">${esc(t.brief)}</div>
    ${stamp}
  </button>`;
}
function render() {
  const q = $('q').value.trim();
  const shown = TOOLS.filter(t => (filterDrawer < 0 || t.drawer === filterDrawer) && matches(t, q));
  let html = '';
  DRAWERS.forEach((d, di) => {
    const items = shown.filter(t => t.drawer === di);
    if (!items.length) return;
    const shelves = [...new Set(items.map(t => t.shelf))];
    html += `<section class="drawer">
      <div class="plate"><span class="no fell">${d.no}</span><span class="label">${esc(d.name)}</span><span class="desc">${esc(d.desc)}</span></div>
      ${shelves.map(s => `<div class="shelf-title">${esc(s)}</div><div class="grid">${items.filter(t => t.shelf === s).map(folderHTML).join('')}</div>`).join('')}
    </section>`;
  });
  $('drawers').innerHTML = html || `<div class="empty">🔎 查無此案……換個關鍵字再找找看吧</div>`;
  $('note').textContent = q || filterDrawer >= 0 ? `找到 ${shown.length} 份卷宗` : `共 ${TOOLS.length} 份卷宗`;
  $('drawers').querySelectorAll('.folder').forEach(b => b.onclick = () => openDossier(b.dataset.id));
}

/* ---------- 打開卷宗 ---------- */
let lastFocus = null;
function openDossier(id) {
  const t = TOOLS.find(x => x.id === id);
  if (!t) return;
  lastFocus = document.activeElement;
  $('dossier').innerHTML = `
    <button class="close" id="d-close" aria-label="關閉">✕</button>
    <div class="seal">${t.case ? esc(t.case) : 'FILE'}</div>
    <div class="file-no fell">${t.no} · ${esc(DRAWERS[t.drawer].name)}</div>
    <h2 id="d-title"><span aria-hidden="true">${t.icon}</span>${esc(t.title)}</h2>
    <div class="d-sub">${esc(t.sub)}</div>
    ${t.teacher ? `<div class="warn">🔒 這是老師專用頁面，含答案與管理功能，請勿提供給學生。</div>` : ''}
    <ul>${t.features.map(f => `<li>${esc(f)}</li>`).join('')}</ul>
    <a class="go" href="${esc(t.href)}" target="_blank" rel="noopener">${t.teacher ? '🔒 ' : ''}${esc(t.btn)} →</a>
    ${t.note ? `<p class="note">${esc(t.note)}</p>` : ''}`;
  $('overlay').classList.add('on');
  $('d-close').onclick = closeDossier;
  $('d-close').focus();
}
function closeDossier() {
  $('overlay').classList.remove('on');
  if (lastFocus) lastFocus.focus();
}
$('overlay').addEventListener('click', e => { if (e.target === $('overlay')) closeDossier(); });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && $('overlay').classList.contains('on')) closeDossier();
  if (e.key === '/' && document.activeElement !== $('q') && !$('overlay').classList.contains('on')) { e.preventDefault(); $('q').focus(); }
});

render();
</script>
<style>.hidden { display: none !important; }</style>
